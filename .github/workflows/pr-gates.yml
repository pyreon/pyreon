name: PR Gates

# The two gates that are LABEL-sensitive — a `skip-changeset` /
# `skip-diagnose-catalog` label must re-run them without re-running the
# whole of ci.yml (whose `pull_request` trigger deliberately does NOT
# include `labeled`, because a label on a busy PR would cancel its
# in-flight CI run). Everything else that used to be a standalone
# single-job workflow now runs as a step of ci.yml's Fast Gates.
#
# Two jobs, two names, because both are required contexts that are pinned
# by name in branch protection; one file because they share a trigger, a
# permission set and a reason to exist.
#
# ── Changeset ──
# PRs changing PUBLISHED-to-npm package source must either add a changeset
# (feature/fix PR) or consume one (the Version PR generated by
# `changesets/action`). The detector excludes private packages and
# changeset-`ignore`d workspaces (examples, docs, ai-reference) — see
# `scripts/check-changeset-required.ts` + its unit tests. Bypass with the
# `skip-changeset` label (comment-only edit, type-tightening with no runtime
# impact).
#
# ── Diagnose Catalog ──
# A PR that adds or edits a user-visible error or warning message in the
# framework's error-surface source (`runtime-dom`, `runtime-server`, `core`,
# `compiler`, `router`) must leave it matched by the `ERROR_PATTERNS` catalog
# that `pyreon doctor diagnose` + the MCP `diagnose` tool pattern-match
# against (an existing entry, or a new one) — or carry `skip-diagnose-catalog`.
# The demand comes from the diff's content: a perf-only change, or a message
# that was only moved or reformatted, demands nothing. `changeset-release/*`
# branches auto-skip. See `scripts/check-diagnose-catalog.ts`.

on:
  # NO `branches:` filter — deliberately. A PR whose base is another FEATURE
  # branch (a stack) is still a PR that will reach main, and gating on
  # `branches: [main]` meant none of it ran on one, which reads as
  # "validated" and is not.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Merge queue: both contexts are required, so the queue waits for them on
  # every merge group. Both are functions of the PR's own diff and labels,
  # which a merge group cannot change and does not carry (no PR payload, no
  # labels), and the PR already passed them to enter the queue. So both jobs
  # SKIP in a merge group — a skipped required check is accepted — instead
  # of re-deciding a label exemption they cannot see. Inert until a
  # merge-queue rule is enabled on main.
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # A merge group has no PR number; its unique queue ref keeps groups from
  # cancelling one another through a shared `pr-gates-` key.
  group: pr-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changeset:
    name: Changeset
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Verify changeset activity (added or consumed)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HAS_SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changeset') }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: bun scripts/check-changeset-required.ts

  diagnose-catalog:
    name: Diagnose Catalog
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Verify new messages are catalogued (or skip-label)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HAS_SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'skip-diagnose-catalog') }}
        run: bun scripts/check-diagnose-catalog.ts
