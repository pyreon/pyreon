name: Required Check Autoheal

# A required check that lands `cancelled` blocks merge exactly like a real
# failure, but shows no red X inviting investigation and never retries
# itself — the difference between "CI is strict" (a real failure stays red)
# and "CI is fragile" (an infra hiccup silently strands a mergeable PR until
# a human notices the BLOCKED state and re-runs it by hand). That is what
# happened to `Native Device Build` on #3492: `iOS — xcodebuild (Simulator
# SDK)` (a required check) was actively mid-build when the WHOLE RUN was
# cancelled from outside — its unrelated `notify-nightly` sibling job, gated
# `if: always() && github.event_name == 'schedule'` and normally SKIPPED on
# a pull_request run, was marked `cancelled` at the identical second, which
# only happens when a run-level cancel hits every job at once. Nothing in
# the job's own logic explains it.
#
# This workflow does NOT retry a genuine `failure` — that must stay loud and
# block merge, which is the "strict" half. It retries ONLY `cancelled`,
# bounded to 2 attempts total (the run's own `run_attempt`, so a rerun of a
# rerun does not loop forever), and always leaves a visible trace: a PR
# comment naming what happened, so a third failure is investigated by a
# human rather than retried into silence.
on:
  workflow_run:
    workflows:
      - Native Device Build
    types: [completed]

permissions:
  actions: write
  pull-requests: write

jobs:
  heal:
    if: github.event.workflow_run.conclusion == 'cancelled' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run the failed/cancelled jobs and say so on the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const run = context.payload.workflow_run
            await github.rest.actions.reRunWorkflowFailedJobs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            })
            // The RERUN above is the deliverable; this comment is advisory context
            // for it. A GitHub API 5xx here must never turn the heal job itself red —
            // that IS the dead-gate class `notify-nightly` documents two jobs over.
            const prs = run.pull_requests ?? []
            for (const pr of prs) {
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body:
                    `\`Native Device Build\` was cancelled from outside the workflow (not a job failure) — ` +
                    `re-running the failed/cancelled jobs automatically: ${run.html_url}\n\n` +
                    `If this happens a second time on the same commit, treat it as a real signal rather than retrying again.`,
                })
              } catch (err) {
                core.warning(`could not comment on #${pr.number}: ${err}`)
              }
            }
