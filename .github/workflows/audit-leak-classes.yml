name: Audit Leak Classes

# Advisory-only nightly run of `scripts/audit-leak-classes.ts` — the
# offline static analyzer for the 5 memory-leak classes catalogued in
# `.claude/rules/anti-patterns.md` "Memory Leak Classes". The script
# is permissive by design (always exits 0); this workflow uploads the
# JSON report as an artifact + diffs against the previous run's
# baseline so newly-introduced findings surface in the summary.
#
# Triggers:
#   - workflow_dispatch: manual run on any branch.
#   - schedule: nightly drift check against main. Catches leak shapes
#     introduced by PRs that merged without triggering the audit.
#   - pull_request: auto-runs when a PR gets the `leak-audit` label,
#     so contributors making leak-class-relevant changes can opt in
#     to a pre-merge audit.
#
# The REPORT is advisory — the audit is permissive by design and its
# findings are for manual triage, not proof of a leak. What IS gated is
# GROWTH: `check-leak-ratchet` compares the findings against the
# committed `leak-baseline.json`, which can only shrink. That gate runs
# in `validate-fast`, in the pre-push hook and in CI's lib-free gate
# job, so a new finding surfaces on the PR that introduces it; this
# nightly is the drift check behind it, and is not a required context.
#
# The lint rules `pyreon/promise-race-needs-cleartimeout` and
# `pyreon/init-fn-needs-idempotency` (in the `recommended` preset since
# #743) remain the high-precision gating signal for their 2 classes.

on:
  workflow_dispatch:
  schedule:
    # 04:23 UTC daily — staggered against the perf workflow's 03:17.
    - cron: '23 4 * * *'
  pull_request:
    types: [labeled, synchronize]

# Read-only default; per-job blocks grant only what each step needs.
permissions:
  contents: read

jobs:
  audit:
    # Only run on leak-audit-labelled PRs — skip by default.
    # Event-precise opt-in: `labeled` fires for EVERY label addition, so
    # pre-fix, adding any unrelated label (skip-changeset, …) to a PR
    # already carrying `leak-audit` re-ran this whole suite. Only the
    # `leak-audit` label itself, or a code push to an already-labelled
    # PR, runs it now.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'leak-audit') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'leak-audit'))
    name: Run audit-leak-classes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        # `--frozen-lockfile` ensures the audit runs against the locked
        # dependency tree exactly as CI / production does. Audit is
        # source-only so the dep graph doesn't affect findings, but
        # the bootstrap step does need `lib/` artifacts to be present.
        run: bun install --frozen-lockfile

      - name: Run audit
        id: audit
        run: |
          # Capture JSON + human-readable simultaneously. The script
          # always exits 0 (advisory); we extract the finding count
          # for the summary.
          mkdir -p audit-out
          bun scripts/audit-leak-classes.ts --json > audit-out/findings.json
          bun scripts/audit-leak-classes.ts > audit-out/findings.txt
          # shellcheck disable=SC2002
          TOTAL=$(cat audit-out/findings.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["total"])')
          echo "total=${TOTAL}" >> "$GITHUB_OUTPUT"

      - name: Summarize in workflow output
        run: |
          {
            echo "## audit-leak-classes — ${{ steps.audit.outputs.total }} finding(s)"
            echo ""
            echo "The audit is **permissive** — a finding is a prompt to triage, not proof of a leak. GROWTH is gated separately by \`bun run check-leak-ratchet\` against \`leak-baseline.json\`. See \`.claude/rules/anti-patterns.md\` \"Memory Leak Classes\" for the canonical fix shapes."
            echo ""
            echo "<details><summary>Full report</summary>"
            echo ""
            echo "\`\`\`"
            cat audit-out/findings.txt
            echo "\`\`\`"
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-leak-classes-${{ github.run_id }}
          path: audit-out/
          retention-days: 30

      # Ratchet against the committed baseline, not a bare ceiling.
      #
      # This used to be `if total -gt 40`, with a comment claiming "current
      # baseline (~19) + 2x headroom". The repo had since reached exactly 40,
      # so there was NO headroom: the next module-level cache anyone added
      # reddened this nightly. And a total can only report that some number
      # moved — it cannot name the new finding, and it nets a fix against a
      # new leak to zero.
      #
      # `leak-baseline.json` is keyed per `detector::file`, can only shrink,
      # and names WHICH file gained WHICH leak class. Same discipline as
      # `lint-baseline.json`. The gate also runs in `validate-fast` and in
      # CI's lib-free gate job, so a regression now surfaces on the PR that
      # causes it rather than on the next night's run.
      - name: Leak ratchet
        run: bun run check-leak-ratchet
