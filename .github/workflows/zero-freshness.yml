# Weekly freshness check for what @pyreon/zero makes users deploy (audit A7).
#
# Two kinds of rot arrive with no commit in this repo, so no PR gate can see
# them: a runtime the adapters or scaffold templates pin reaching END OF LIFE
# (vercelAdapter defaulted to nodejs20.x past Node 20's EOL), and a scaffold
# dependency pin that STOPS INSTALLING (the @supabase/supabase-js mispublish
# that broke every fresh scaffold). scripts/check-zero-freshness.ts checks
# both; its verdict depends on the date and the npm registry, not the diff,
# which is why it runs on a schedule and not per PR.
name: Zero Freshness

on:
  schedule:
    # Mondays 06:41 UTC — offset from the daily alarms (03:17 / 04:11 / 05:23).
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Runtimes not EOL, scaffold pins install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # The check imports create-zero's REAL package.json generator, whose
      # imports resolve through the workspace. PYREON_BOOTSTRAP_SKIP: it
      # reads source only, no lib/ build needed.
      - name: Install
        env:
          PYREON_BOOTSTRAP_SKIP: '1'
        run: bun install --frozen-lockfile
      - name: Check zero freshness
        run: bun scripts/check-zero-freshness.ts

  # A weekly check nobody reads is a dead gate. Same sticky-issue pattern as
  # published-state.yml: one issue, one comment per red run, auto-closed by
  # the next green run.
  notify:
    name: Weekly status → sticky issue
    if: always() && github.event_name == 'schedule'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # `retries: 3` for transient API 5xx, but NO swallow-all catch: the
      # notification is the deliverable (see check-advisory-comment-steps).
      - name: Create / update / close the sticky failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const title = '[zero-freshness] an EOL runtime or an uninstallable scaffold pin'
            const result = '${{ needs.check.result }}'
            const failed = result !== 'success'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: 'github-actions[bot]',
              per_page: 100,
            })
            const sticky = issues.find((i) => i.title === title)
            if (failed) {
              const line = `Weekly check result: **${result}** — ${runUrl}`
              if (sticky) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: sticky.number,
                  body: line,
                })
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body: [
                    'The weekly `scripts/check-zero-freshness.ts` run is red: a runtime',
                    'pinned by a zero adapter or scaffold template is at/past end of life',
                    '(see scripts/runtime-eol.json), or a create-zero dependency pin no',
                    'longer resolves from npm. The run log names the file and line.',
                    '',
                    'This issue is managed by the workflow: one comment per red run,',
                    'auto-closed by the next green run.',
                    '',
                    line,
                  ].join('\n'),
                })
              }
            } else if (sticky) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: sticky.number,
                body: `Weekly check is green again: ${runUrl} — auto-closing.`,
              })
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: sticky.number,
                state: 'closed',
              })
            }
