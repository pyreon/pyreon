name: Perf

# Advisory-only perf regression workflow. Does NOT block merges — once the
# baseline is trusted (multiple nightly runs landed, noise bounded), promote
# this to a required check in branch protection.
#
# Triggers:
#   - workflow_dispatch: manual run, any branch. Useful for reproducing a PR
#     author's local perf claim in a clean VM.
#   - (no pull_request trigger — dispatch against a branch instead; see `on:`)
#   - schedule: nightly drift check against main. Uploads results as artifact
#     so regressions that land between PR labels are still caught.
#
# Baselines:
#   - `perf-results/baseline-<app>-<journey>.json` is the committed baseline.
#     A PR run compares its recording against the baseline and posts a diff
#     as a PR comment. A missing baseline → diff step is skipped with a
#     notice (first-time PRs can't regress against a non-existent baseline).
#   - Scheduled runs on main regenerate the baseline and upload as artifact
#     but do NOT auto-commit — intentional: baselines should be reviewed,
#     not silently updated by a cron job.

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Example app name'
        required: false
        default: 'perf-dashboard'
      journey:
        description: 'Journey name'
        required: false
        default: 'boot'
  # NO pull_request trigger (removed 2026-09-23): the PR path was label opt-in
  # (`perf`), no PR has EVER carried that label, and every push to every
  # PR still created a run whose one job was skipped — a permanent
  # "skipping" row on each PR and ~205 empty runs/week in the Actions queue.
  # To measure a branch, dispatch it: `gh workflow run perf.yml --ref <branch>`.
  schedule:
    - cron: '17 3 * * *'

# Read-only default — this workflow checks out source + uploads artifacts;
# no write surface needed.
permissions:
  contents: read

jobs:
  perf:
    name: Record ${{ matrix.app }}/${{ matrix.journey }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: perf-dashboard
            journey: boot
          - app: perf-dashboard
            journey: toggleTheme
          - app: perf-dashboard
            journey: themeThrash
          - app: perf-dashboard
            journey: shuffleRows
          - app: perf-dashboard
            journey: regenRows
          - app: perf-dashboard
            journey: modalCycle
          # Canonical journeys for the architectural-experiments plan (#325).
          # Every architectural experiment will be measured against these.
          - app: perf-dashboard
            journey: chat
          - app: perf-dashboard
            journey: dashboard
          - app: perf-dashboard
            journey: form
          # Forms-stress benchmark — 10k-field @pyreon/form audit. Five
          # journeys exercising mount + edit + state-read at production
          # scale. Drives the form.fieldSignalCreate / formStateScan /
          # formStateScan.fieldsRead counters introduced for this audit.
          - app: perf-dashboard
            journey: formMount-10k
          - app: perf-dashboard
            journey: formEditSingle-10k
          - app: perf-dashboard
            journey: formEditBatch-10k
          - app: perf-dashboard
            journey: formStateRead-10k
          - app: perf-dashboard
            journey: formStateReadSelector-10k
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-chromium-${{ runner.os }}-
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Record
        # Dev mode only — preview (prod build) tree-shakes the counter
        # emit call tree, so counters stay at zero and `perf:record` exits 4
        # with "harness not installed" because `install()` in main.tsx is
        # gated on `import.meta.env.DEV`. The tree-shake guarantee is the
        # correct design; we just need to record against a DEV build where
        # both the gate opens and the emits fire.
        run: |
          bun run perf:record \
            --app ${{ matrix.app }} \
            --journey ${{ matrix.journey }} \
            --runs 5 \
            --mode dev

      # Resolve short SHA so artifact names match `perf:record` output.
      - name: Compute SHA
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload current result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-${{ matrix.app }}-${{ matrix.journey }}-${{ steps.sha.outputs.sha }}
          path: perf-results/${{ steps.sha.outputs.sha }}-${{ matrix.app }}-${{ matrix.journey }}.json
          retention-days: 30

      # Runs on EVERY event, not just pull_request. A scheduled run that only
      # RECORDS has no verdict, so nothing on main could ever report drift —
      # the recording succeeded and the workflow went green regardless of what
      # the numbers said. The comparison is cheap; only the POSTING is
      # PR-specific, so that is where the event check belongs.
      - name: Diff against baseline (if present)
        id: diff
        continue-on-error: true
        run: |
          baseline="perf-results/baseline-${{ matrix.app }}-${{ matrix.journey }}.json"
          current="perf-results/${{ steps.sha.outputs.sha }}-${{ matrix.app }}-${{ matrix.journey }}.json"
          summary="perf-results/summary-${{ matrix.app }}-${{ matrix.journey }}.md"
          if [ -f "$baseline" ]; then
            bun run perf:diff "$baseline" "$current" --output "$summary" || echo "regressed=true" >> "$GITHUB_OUTPUT"
            echo "summary_path=$summary" >> "$GITHUB_OUTPUT"
          else
            echo "No baseline committed at $baseline — skipping diff." > "$summary"
            echo "(add one via a nightly run artifact when ready.)" >> "$summary"
            echo "summary_path=$summary" >> "$GITHUB_OUTPUT"
          fi

      # The nightly's verdict has nowhere to be posted (no PR), so it goes to
      # the run summary plus a warning annotation. Advisory by design: a
      # counter regression on main must be VISIBLE without turning a data
      # collection run red.
      - name: Publish diff to the run summary
        if: steps.diff.outputs.summary_path != ''
        run: |
          {
            echo "## ${{ matrix.app }} / ${{ matrix.journey }}"
            cat "${{ steps.diff.outputs.summary_path }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.diff.outputs.regressed }}" = "true" ]; then
            echo "::warning title=perf drift on ${{ matrix.journey }}::A counter regressed against the committed baseline. See the run summary for the table."
          fi

