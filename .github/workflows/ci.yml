name: CI

on:
  push:
    branches: [main]
  # NO `branches:` filter — deliberately. A PR whose base is another FEATURE
  # branch (a stack) is still a PR that will reach main, and gating this
  # workflow on `branches: [main]` meant none of it ran on one: no typecheck,
  # no test cells, no lint, no gates. The PR then showed a small all-green set
  # from the handful of workflows that DO run on any base, which reads as
  # "validated" and is not.
  # Re-adding the filter re-opens that hole.
  pull_request:
  merge_group:

# Cancellation policy — burst-safe WITHOUT per-commit pileup.
#
# Requirement: the safety-net gates that ONLY run on main (`Coverage (Full)`,
# `Benchmark` — gated `event_name == 'push' || 'merge_group'`, so they never
# run on PRs) must always run to completion for main HEAD; a newer commit must
# never cancel a run that is mid-flight.
#
# Two earlier designs each got half of it:
#   1. `cancel-in-progress: true` on a per-ref group — cancelled the RUNNING
#      main-push run every time a newer commit landed (merges land faster than
#      the 15-min coverage job), so the gates never completed (20+ pushes, all
#      cancelled).
#   2. per-`run_id` group (cancellation "never fires") — fixed (1) but gave
#      EVERY commit its own uncancellable full run, so a burst of N merges
#      produced N heavy main-CI runs that saturated the runner pool (observed:
#      7 stacked `CI [push] main` runs draining serially).
#
# Correct policy = protect the RUNNING run, COALESCE pending to the latest.
# A SHARED per-ref group + `cancel-in-progress: false` makes GitHub:
#   - never cancel the in-progress run  → Coverage/Benchmark always complete;
#   - cancel a *stale pending* run when a newer one queues (documented
#     concurrency behaviour) → a burst of N merges collapses to ~2 full runs:
#     the in-flight one + the latest HEAD. No pileup, no starvation.
# main HEAD is always covered (the coalesced-to-latest pending run); skipping
# coverage for the intermediate commits in a burst is correct — HEAD subsumes
# them, and the pre-merge gates already validated each PR.
#
# - push:main    → group `ci-refs/heads/main`, cancel:false → running protected, pending coalesced to latest HEAD.
# - merge_group  → unique queue ref per attempt, cancel:false → each merge-queue run completes (the queue requires it).
# - pull_request → per-PR ref, cancel:true → newest commit on the PR wins (unchanged).
#
# **YAML interpolation gotcha** — a bare `${{ github.event_name == 'pull_request' }}`
# interpolates to the literal string "true" or "false". YAML then re-parses
# `cancel-in-progress: false` as the BOOLEAN false (good), BUT `cancel-in-
# progress: true` as boolean true… and crucially, **GitHub's runner has been
# observed to treat the string-interpolated form as truthy even when it
# evaluates to `false`** (empirical: every push:main run cancelled at the
# pending stage despite the expression evaluating to `false`). The
# documented workaround is the explicit ternary `&& true || false` — forces
# the expression to return a JSON-native boolean that the runner's
# concurrency engine reads correctly.
#
# Bisect-verifiable: revert to the bare comparison → push:main runs cancel
# at the pending stage (never run any jobs); apply the ternary → push:main
# runs progress to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && true || false }}

permissions:
  contents: read

# ── Job map ─────────────────────────────────────────────────────────────────
# The org is on the free plan: 20 concurrent jobs ORG-WIDE, 5 macOS, shared
# by every in-flight PR. Runner-minutes are unmetered (public repo); SLOTS
# and DAG LEVELS are the whole constraint — measured 2026-09-01 an ordinary
# code PR spent 641 min queued for 24 min of work. So the shape is: as few
# jobs as the isolation genuinely needs, two levels deep, and a gate that
# takes seconds is a STEP, never a job.
#
#   level 1   Install            install + decide + lib/ (one job, one failure semantics)
#   level 2   Fast Gates         every lib-free gate (lint, docs, manifests, policy, secrets)
#             Build              every lib-needing gate (examples, modes, budgets, coverage, rust)
#             typecheck / test / e2e / scaffold cells   dynamic, batched by ci-batch.ts
#             Test (browser)     vitest --browser (Playwright)
#             Release Build      the literal next-release build + pack rehearsal
#             bootstrap-exit-codes                      only when bootstrap.ts changed
#   level 3   Test               ONE aggregator for all four matrices
#   main only Coverage (Full), Benchmark
#
# Required contexts (both authorities — classic protection AND ruleset
# 19416270 — must stay identical): Install, Fast Gates, Build, Test,
# Test (browser), Release Build, bootstrap-exit-codes, plus the native and
# CodeQL workflows' own jobs. NEVER rename a required job; DROP a name from
# protection before deleting its job, never ADD one (an added name hangs
# every open PR on "Expected" until its next push).
#
# ── Shared cache keys ──────────────────────────────────────────────────────
# lib/ has TWO layers: a SOURCE-HASHED cross-run key (Install restores it,
# rebuilds only content-changed packages, saves it back) and this per-run-id
# key that every downstream job restores through setup-pyreon for an exact,
# fresh set. hashFiles() cannot appear in workflow-level env, so the
# source-hashed key is inlined at each site and `check-cache-key-sync`
# enforces that every site hashes the same inputs. node_modules is keyed by
# lockfile hash inside setup-pyreon.
env:
  BOOTSTRAP_KEY: bootstrap-${{ github.run_id }}

jobs:
  # ── Install: ONE job for install → decide → build lib/ ─────────────────
  # This used to be three jobs — Install ∥ Changes (decide) → Bootstrap — on
  # the theory that a no-`needs` decide job "starts at t=0" and lib-free jobs
  # should not wait for the lib/ build. Both hold only while runners are
  # free, and they are not: the org's free plan allows 20 concurrent jobs
  # ORG-WIDE, shared by every in-flight PR, and on 2026-09-01 an ordinary
  # code PR (run 33544139801) spent 641 min queued for 24 min of work. Under
  # that regime every DAG LEVEL costs a full queue round (tens of minutes)
  # and every JOB is a slot the other PRs wait for — so one job at level 1
  # beats three jobs across two levels, even though lib-free jobs now wait a
  # couple of minutes longer for the build. The decide work is seconds of
  # git + bun and needs nothing from node_modules; it runs after the install
  # only so this job has one failure semantics: if Install fails, every
  # dependent's fail-closed clause fires and the FULL set runs, loudly.
  #
  # Outputs — all fail-closed (a detection error means "run everything",
  # because a skipped required check reports SUCCESS to branch protection):
  #   code       a non-docs source file changed → gates the read-nothing
  #              heavy jobs (Build's gates, browser tests, Release Build)
  #   affected   ANY workspace is affected, INCLUDING a doc-INPUT change
  #              mapped to its consumer (anti-patterns.md → @pyreon/mcp,
  #              whose tests parse it) → gates the lib/ build below
  #   typecheck-/test-/e2e-/scaffold-matrix (+ -has)  dynamic cell lists,
  #              packed by ci-batch.ts; only affected categories spawn a
  #              cell, and the cells still compute their own narrow filter
  #   bootstrap-exit-codes   bootstrap.ts's own contract test is relevant
  # `code` and `affected` diverge exactly on a doc-INPUT change (code=false,
  # affected=true). A pure-prose docs PR is false/false → only Fast Gates and
  # the aggregators run.
  install:
    name: Install
    runs-on: ubuntu-latest
    # Derived, not guessed: install ~50s + decide ~20s + lib/ build 90-280s
    # (prefix-hit incremental vs cold, measured 2026-09) + two cache saves.
    # 15 is ~2× the cold case.
    timeout-minutes: 15
    outputs:
      code: ${{ steps.detect.outputs.code }}
      affected: ${{ steps.detect.outputs.affected }}
      typecheck-matrix: ${{ steps.matrices.outputs.typecheck }}
      typecheck-has: ${{ steps.matrices.outputs.typecheck-has }}
      test-matrix: ${{ steps.matrices.outputs.test }}
      test-has: ${{ steps.matrices.outputs.test-has }}
      e2e-matrix: ${{ steps.e2e.outputs.matrix }}
      e2e-has: ${{ steps.e2e.outputs.has }}
      scaffold-has: ${{ steps.scaffold.outputs.has }}
      scaffold-matrix: ${{ steps.scaffold.outputs.matrix }}
      bootstrap-exit-codes: ${{ steps.bexit.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the decide steps diff against the base ref
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # ── 1. install ──────────────────────────────────────────────────────
      # bun's global package-tarball store. When the lockfile-keyed
      # node_modules restore misses (new bun.lock hash, fresh runner),
      # `bun install --frozen-lockfile` extracts from this store instead of
      # re-fetching every package (~30-90s cold). Content-addressed, so a
      # prefix-restored stale store is always valid.
      # RESTORE always, SAVE on push:main only. This is ~1 GB per lockfile
      # variant — saving it per ref is what filled the 10 GB actions cache
      # (twice), evicting the small entries every PR depends on. ONE key,
      # ONE writer: every other workflow that needs it restores under this
      # exact key (`bun-install-cache-<os>-<lockhash>`) and never saves.
      - name: Restore bun install cache
        id: bun-tarball-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-cache-${{ runner.os }}-
      - name: Restore node_modules
        id: nm-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/*/node_modules
            examples/*/node_modules
            docs/node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      # PYREON_BOOTSTRAP_SKIP=1 keeps the postinstall lib/ build out of the
      # install (it runs below, gated on `affected`, so a docs-only PR never
      # builds). Local-dev installs deliberately keep the postinstall build.
      - run: PYREON_BOOTSTRAP_SKIP=1 bun install --frozen-lockfile
      # node_modules is fully determined by the lockfile, so the content key
      # IS the exact key; downstream jobs restore it via setup-pyreon. The
      # per-ref save is deliberate (unlike the tarball store): a lockfile-
      # changing PR's ~30 downstream jobs would otherwise each pay the
      # fallback install.
      - name: Save node_modules (lockfile key)
        if: steps.nm-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/*/node_modules
            examples/*/node_modules
            docs/node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Save bun install cache (main only)
        if: github.ref == 'refs/heads/main' && steps.bun-tarball-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # ── 2. decide ───────────────────────────────────────────────────────
      - name: Detect changes (code + affected)
        id: detect
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "affected=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event (${{ github.event_name }}) → code=true, affected=true (full run)."
            exit 0
          fi
          git fetch origin "${{ github.base_ref }}" || true
          BASE="origin/${{ github.base_ref }}"
          # Fail-closed: ONLY a clean "false" narrows the run. Any other value
          # (empty output, a non-zero affected.ts exit, an unexpected string)
          # defaults to `true` → run the full set. A skipped heavy job reports
          # success to branch protection, so a mis-detection must never silently
          # disable the required checks.
          CODE=$(bun run scripts/affected.ts --code-changed --base="$BASE") || CODE=true
          if [ "$CODE" != "false" ]; then CODE=true; fi
          AFFECTED=$(bun run scripts/affected.ts --has-affected --base="$BASE") || AFFECTED=true
          if [ "$AFFECTED" != "false" ]; then AFFECTED=true; fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "affected=$AFFECTED" >> "$GITHUB_OUTPUT"
          echo "Code (non-docs) changed: $CODE | Any package affected: $AFFECTED"
      - name: Compute typecheck/test cell matrices
        id: matrices
        run: |
          # Category lists MUST mirror the cells' own case statements below.
          # The three `native-*` test entries are PSEUDO-categories splitting
          # packages/native/ across three runners (see test-cell's timeout
          # comment); their affected-args mirror the cell exactly so the
          # decide verdict and the cell's own filter can never disagree
          # (same script, same base, deterministic). `native-compiler-{1,2,3}`
          # resolve the SAME package and differ only by vitest `--shard`.
          TC_ALL='["core","fundamentals","internals","native","tools","ui","ui-system","zero","examples"]'
          TEST_ALL='["core","fundamentals","internals","native-compiler-1","native-compiler-2","native-compiler-3","native-rest","tools","ui","ui-system","zero"]'
          # The four native TEST cells must never share a runner: each keys a
          # compile-verdict cache on its own category and the three derive
          # DISJOINT verdict sets, so merging them would make the key ambiguous
          # and silently turn every lookup into a miss.
          NATIVE_ISO='native-compiler-1,native-compiler-2,native-compiler-3,native-rest'
          emit() { # emit <prefix> <json>
            echo "$1=$2" >> "$GITHUB_OUTPUT"
            if [ "$2" = "[]" ]; then echo "$1-has=false" >> "$GITHUB_OUTPUT"; else echo "$1-has=true" >> "$GITHUB_OUTPUT"; fi
            echo "$1 matrix: $2"
          }
          batch() { # batch <prefix> <json-list> <max> [isolate-csv]
            local prefix="$1" json="$2" max="$3" iso="${4:-}" out
            if [ "$json" = "[]" ]; then emit "$prefix" "[]"; return 0; fi
            # Fail-closed: if batching errors, fall back to the UNBATCHED list
            # (slower, but never fewer cells than were selected).
            if ! out=$(bun run scripts/ci-batch.ts --items="$json" --max="$max" --isolate="$iso"); then
              echo "ci-batch failed for $prefix — falling back to unbatched"
              emit "$prefix" "$json"; return 0
            fi
            emit "$prefix" "$out"
          }
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            batch typecheck "$TC_ALL" 3
            batch test "$TEST_ALL" 2 "$NATIVE_ISO"
            exit 0
          fi
          BASE="origin/${{ github.base_ref }}"
          # pick <output-prefix> <full-json> <cat>:<affected-args>...
          # Fail-closed: any affected.ts error, or a root-file `--filter=*`
          # verdict, emits the FULL list — never a silently-narrowed one.
          # Echoes the selected-cell JSON on stdout; progress notes go to
          # stderr so they cannot contaminate the captured value. Fail-closed
          # behaviour is unchanged — any error or a root-file verdict returns
          # the FULL list.
          pick() {
            local full="$1"; shift
            local list="" cat args out
            for spec in "$@"; do
              cat="${spec%%:*}"; args="${spec#*:}"
              # shellcheck disable=SC2086
              if ! out=$(bun run scripts/affected.ts --base="$BASE" $args); then
                echo "affected.ts failed for $cat — fail-closed to full matrix" >&2
                echo "$full"; return 0
              fi
              if [ "$out" = "--filter=*" ]; then
                echo "root-file change — full matrix" >&2
                echo "$full"; return 0
              fi
              [ -n "$out" ] && list="$list\"$cat\","
            done
            echo "[${list%,}]"
          }
          # BATCH the selected categories into at most `max` cells. Same
          # reasoning as the e2e matrix: a cell's fixed cost (queue wait +
          # checkout + setup-pyreon) is ~30-60s, and most category cells RUN
          # for under two minutes — so past a handful of cells the fan-out
          # buys queue tax rather than wall-clock. See scripts/ci-batch.ts.
          TC_SEL=$(pick "$TC_ALL" \
            "core:--category=core" "fundamentals:--category=fundamentals" \
            "internals:--category=internals" "native:--category=native" \
            "tools:--category=tools" "ui:--category=ui" \
            "ui-system:--category=ui-system" "zero:--category=zero" \
            "examples:--category=examples")
          TEST_SEL=$(pick "$TEST_ALL" \
            "core:--category=core" "fundamentals:--category=fundamentals" \
            "internals:--category=internals" \
            "native-compiler-1:--category=native/compiler" \
            "native-compiler-2:--category=native/compiler" \
            "native-compiler-3:--category=native/compiler" \
            "native-rest:--category=native --exclude=native/compiler" \
            "tools:--category=tools" "ui:--category=ui" \
            "ui-system:--category=ui-system" "zero:--category=zero")
          # typecheck: 9 categories -> 3 cells (~12 min serial).
          # test: 7 non-native categories -> 2 cells, plus the 3 native cells
          # kept 1:1 = 5 cells (down from 10).
          batch typecheck "$TC_SEL" 3
          batch test "$TEST_SEL" 2 "$NATIVE_ISO"
      - name: Select affected e2e suites
        id: e2e
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SUITES=$(bun run scripts/e2e-affected.ts --base=origin/${{ github.base_ref }})
          else
            SUITES=$(bun run scripts/e2e-affected.ts --all)
          fi
          # BATCH the selected suites into at most 4 cells. A cell's fixed cost
          # (queue wait + checkout + setup-pyreon + a Playwright browser
          # install) is 35-52s, while most suites RUN for 8-30s — measured on
          # run 31023199747, where 25 e2e cells spent ~19 min of runner time on
          # setup to execute ~8 min of tests, and the median cell waited 30.6
          # min for a slot. Splitting only pays while runners are free; under
          # contention the cells serialise through the queue anyway and the
          # split just multiplies the fixed cost. See scripts/ci-batch.ts.
          NAMES=$(echo "$SUITES" | jq -c '[.[].name]')
          MATRIX=$(bun run scripts/ci-batch.ts --items="$NAMES" --max=4)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          if [ "$MATRIX" = "[]" ]; then
            echo "has=false" >> "$GITHUB_OUTPUT"
          else
            echo "has=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Selected e2e suites: $SUITES"
          echo "Batched e2e matrix: $MATRIX"
      - name: Detect scaffold-relevant changes
        id: scaffold
        run: |
          # The six scaffold cells, packed into 3 batches (see ci-batch.ts
          # for why a cell is not free: each one was its own runner — six
          # queue entries + six setups for ~6 min of work apiece, and under
          # slot contention the six serialised anyway). `emit` writes BOTH
          # outputs on every exit path so the cell job can never see a
          # `has=true` with an empty matrix.
          CELLS='["cpa-smoke-app-vercel","cpa-smoke-app-static","cpa-smoke-blog-cloudflare","cpa-smoke-dashboard-vercel-full","cpa-smoke-dashboard-node-supabase","cpa-smoke-monorepo-vercel"]'
          emit() {
            echo "has=$1" >> "$GITHUB_OUTPUT"
            if [ "$1" = "true" ]; then
              local out
              if ! out=$(bun run scripts/ci-batch.ts --items="$CELLS" --max=3); then
                # Batcher failure must never DROP a cell — fall back to one
                # cell per batch, which is exactly the pre-batching shape.
                echo "ci-batch failed for scaffold — falling back to unbatched"
                out=$(echo "$CELLS" | sed -E 's/"([^"]+)"/{"name":"\1","members":"\1"}/g')
              fi
              echo "matrix=$out" >> "$GITHUB_OUTPUT"
            else
              echo "matrix=[]" >> "$GITHUB_OUTPUT"
            fi
          }
          # Non-PR triggers always run the full matrix — main / merge_group
          # is the protected path. Per-suite skipping is a PR-only opt.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            emit true
            echo "Full scaffold matrix forced (event: ${{ github.event_name }})"
            exit 0
          fi
          BASE="origin/${{ github.base_ref }}"
          # Changed files (handles fetch failures cleanly — fall back to
          # running the matrix if we can't determine the diff).
          if ! CHANGED=$(git diff --name-only "$BASE"...HEAD 2>/dev/null); then
            emit true
            echo "Could not determine changes — running full matrix (safety)"
            exit 0
          fi
          # Scaffold-relevant paths: the templates, the scaffolder, the
          # CLI, the zero runtime (which templates depend on), and the
          # test driver + workflow itself. Generous superset — false
          # positives are fine; false negatives would skip a real bug.
          TRIGGERS=$(cat <<'EOF'
          packages/zero/zero/
          packages/zero/zero-cli/
          packages/zero/create-zero/
          packages/zero/meta/
          packages/core/
          scripts/scaffold-smoke.ts
          scripts/affected.ts
          .github/workflows/ci.yml
          bun.lock
          package.json
          EOF
          )
          HAS=false
          while IFS= read -r prefix; do
            if echo "$CHANGED" | grep -qE "^$prefix"; then
              HAS=true
              echo "Matched trigger: $prefix"
              break
            fi
          done <<< "$TRIGGERS"
          emit "$HAS"
          if [ "$HAS" = "false" ]; then
            echo "No scaffold-relevant changes — skipping matrix (saves ~265s/cell)"
          fi
      - name: Detect whether bootstrap-exit-codes inputs changed
        id: bexit
        run: |
          # push:main / merge_group always run.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Full run forced (event: ${{ github.event_name }})"
            exit 0
          fi
          BASE="origin/${{ github.base_ref }}"
          if ! CHANGED=$(git diff --name-only "$BASE"...HEAD 2>/dev/null); then
            # Couldn't determine diff — safe default = run.
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RELEVANT=false
          for prefix in \
            scripts/bootstrap.ts \
            scripts/install-git-hooks.ts \
            packages/internals/test-utils/src/tests/bootstrap-exit-codes.test.ts \
            .github/workflows/ci.yml; do
            if echo "$CHANGED" | grep -qE "^$prefix"; then
              RELEVANT=true
              echo "Matched trigger: $prefix"
              break
            fi
          done
          echo "run=$RELEVANT" >> "$GITHUB_OUTPUT"
          if [ "$RELEVANT" = "false" ]; then
            echo "No bootstrap.ts changes — bootstrap-exit-codes job will skip (saves ~190s)"
          fi
      # ── 3. lib/ ─────────────────────────────────────────────────────────
      # Gated on `affected` (NOT `code`: a doc-INPUT change is code=false but
      # its consumer's tests need lib/) OR `e2e-has` — that half is
      # load-bearing: a PR that only touches `e2e/**` affects no workspace,
      # yet its e2e suites need every example built (#2978).
      - name: Decide whether lib/ is needed
        id: lib
        run: |
          if [ "${{ steps.detect.outputs.affected }}" = "true" ] || [ "${{ steps.e2e.outputs.has }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing affected and no e2e selected — lib/ not built."
          fi
      # TWO-LAYER lib/ cache. (1) A SOURCE-HASHED cross-run key: on an exact
      # hit the build is skipped outright; on a prefix (restore-keys) hit the
      # nearest prior lib/ + its `.bootstrap-cache.json` manifest come back
      # and `bootstrap.ts` rebuilds only the packages whose CONTENT hash
      # differs (15-90s for a 1-2 package PR vs ~280s cold). restore-keys is
      # safe precisely because dirtiness is decided by content hash, never
      # mtime — a prefix-restored older lib/ can never look falsely fresh.
      # (2) The per-run-id key (`BOOTSTRAP_KEY`, workflow env) that every
      # downstream job restores through setup-pyreon for an exact, fresh set.
      # hashFiles() is inlined because GHA forbids it in workflow-level env;
      # `check-cache-key-sync` enforces that every site hashes the same
      # inputs.
      - name: Restore source-hashed lib/ cache (+ incremental manifest)
        id: bootstrap-cache
        if: steps.lib.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/*/*/lib
            .bootstrap-cache.json
          key: bootstrap-ubuntu-${{ hashFiles('packages/*/*/src/**', 'packages/*/*/package.json', 'packages/*/*/tsconfig.json', 'tsconfig.json', 'scripts/bootstrap.ts', 'bun.lock') }}
          restore-keys: |
            bootstrap-ubuntu-
      - name: Build lib/ (incremental)
        if: steps.lib.outputs.run == 'true' && steps.bootstrap-cache.outputs.cache-hit != 'true'
        run: bun scripts/bootstrap.ts
      - name: Cache-hit summary
        if: steps.lib.outputs.run == 'true'
        run: |
          if [ "${{ steps.bootstrap-cache.outputs.cache-hit }}" = "true" ]; then
            echo "::notice title=lib/ cache hit::source-hashed cache hit — build skipped"
          else
            echo "::notice title=lib/ rebuilt::source changed since the nearest cached build — bootstrap.ts rebuilt the stale packages"
          fi
      - name: Save source-hashed lib/ cache for next runs
        if: steps.lib.outputs.run == 'true' && steps.bootstrap-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/*/*/lib
            .bootstrap-cache.json
          key: bootstrap-ubuntu-${{ hashFiles('packages/*/*/src/**', 'packages/*/*/package.json', 'packages/*/*/tsconfig.json', 'tsconfig.json', 'scripts/bootstrap.ts', 'bun.lock') }}
      - name: Save lib/ under per-run-id key for downstream jobs
        if: steps.lib.outputs.run == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/*/*/lib
          key: ${{ env.BOOTSTRAP_KEY }}

  # ── Fast Gates: every lib-free gate, one runner ──────────────────────────
  # Consolidated 2026-08 (eleven singleton jobs → one) and again 2026-09
  # (Lint, PR targets main, Secrets Scan, Dependency Audit, Release
  # Readiness, Doc Examples → steps here; their check names were DROPPED from
  # branch protection, never renamed). The measurement behind both passes is
  # the same: under org-wide slot contention the per-JOB queue tax dwarfs
  # the work by 10-30×, so a 20-second gate in its own job is a 20-second
  # gate behind a 20-50 minute wait — and a slot every other PR pays for.
  #
  # Every gate is its own NAMED STEP, and every step runs even when an
  # earlier one failed (`!cancelled()`), so one push reports EVERY failing
  # gate instead of the first — the job is red if any step is. The one
  # exception is setup: if checkout/setup-pyreon fail, the gates are skipped
  # rather than each failing noisily on a missing node_modules.
  #
  # Secrets Scan's ghcr.io pre-pull keeps its retry loop; a genuine registry
  # outage reds this ONE step and the other gates still report.
  fast-gates:
    name: Fast Gates
    needs: install
    if: always() && needs.install.result == 'success'
    runs-on: ubuntu-latest
    # Derived: ~90s of prior gates + lint 20s + doc examples 45s + secrets
    # scan 30s (+ up to 100s of pre-pull backoff) + audit/readiness/guard
    # ~25s ≈ 4-5 min worst case; 15 is ~3× that.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Docs Sync, Doc Examples, secrets scan and the changeset gate all diff against history
      - uses: ./.github/actions/setup-pyreon
        id: setup
        with:
          restore-bootstrap: 'false' # every gate here is lib-free
          node-version: '24' # Doc Examples typechecks under node
      # ── repo policy ──────────────────────────────────────────────────────
      # Every PR must be gated by CI, and GitHub can only gate a PR whose base
      # is a PROTECTED branch. Protecting feature branches is structurally
      # impossible (a ruleset's required checks gate REF UPDATES — applying
      # it to a branch people push to freezes it; verified 2026-07-30), so
      # "every PR merges gated" reduces to "every PR targets main", and this
      # step is that policy made visible. Skipped on push/merge_group.
      - name: PR targets main
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$BASE" = "main" ]; then
            echo "base=main — this PR is gated by branch protection."
            exit 0
          fi
          echo "::error::This PR targets '$BASE', not 'main'. A PR into an unprotected feature branch can be merged before ANY check finishes — GitHub cannot require status checks on a branch people push to (the rule gates ref updates, freezing the branch). Re-target with: gh pr edit ${{ github.event.pull_request.number }} --base main. For dependent work, branch FROM the parent but still open the PR against main — the diff shrinks automatically when the parent merges."
          exit 1
      # ── lint ─────────────────────────────────────────────────────────────
      - name: Lint (oxlint)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run lint
      - name: Lint (pyreon/require-browser-smoke-test)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run lint:browser-smoke
      - name: Lint Ratchet (oxlint warn baseline)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run check-lint-ratchet
      - name: Lint Ratchet (pyreon-lint advisory baseline)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run check-pyreon-lint-ratchet
      - name: Pyreon Lint Gate
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run lint:pyreon
      # ── docs + generated surfaces ────────────────────────────────────────
      - name: Check Doc Claims
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run check-doc-claims
      - name: Multiplatform Matrix (headline == table sum)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun scripts/check-multiplatform-matrix.ts
      - name: Docs Sync (gen-docs --check)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run gen-docs --check
      - name: Docs Sync (check-mcp-docs)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run check-mcp-docs
      # The AI-facing prop contract for @pyreon/ui-components, DERIVED by
      # running its rocketstyle chains against a real theme (dimension values
      # live in `.states((t) => …)` callbacks, so they cannot be read from
      # types). Runs here rather than in `validate-fast` because it mounts
      # 108 components and costs ~48s cold.
      - name: Atlas Agent Guide (AI prop contract in sync)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run atlas-guide
      - name: Docs Generated Fresh
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun docs/scripts/check-generated-fresh.ts
      # Doc Examples: typecheck the `// @check`-marked docs blocks + resolve
      # README imports. Path-scoped INSIDE the job (a trigger-level `paths:`
      # filter on a required check is the documented Expected-hang deadlock).
      - name: Doc Examples (relevance)
        id: doc-examples
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "${{ github.base_ref }}" || true
          if ! CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" 2>/dev/null); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$CHANGED" | grep -qE '^(docs/src/content/docs/|packages/[^/]+/[^/]+/README\.md|packages/[^/]+/[^/]+/src/|scripts/check-(doc-examples|readme-imports)\.ts|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Relevant changes found — running doc-examples typecheck."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No doc-example-relevant changes — skipping."
          fi
      - name: Doc Examples (typecheck opted-in blocks)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.doc-examples.outputs.run == 'true' }}
        run: bun scripts/check-doc-examples.ts
      - name: Doc Examples (README imports resolve)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.doc-examples.outputs.run == 'true' }}
        run: bun scripts/check-readme-imports.ts
      # ── type + manifest + package contracts ──────────────────────────────
      - name: Audit Types
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run audit-types --all --strict
      - name: Check Manifest Depth
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run check-manifest-depth
      - name: Check Manifest Examples
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run check-manifest-examples
      - name: Check Export Entries
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run check-export-entries
      - name: Check No Major Changesets
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun scripts/check-no-major-changesets.ts
      - name: Check Client Bundle Node Imports
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run check-client-bundle-node-imports
      # Release Readiness: publishConfig.access + changeset fixed-group
      # coverage — red here means the NEXT release will fail.
      - name: Release Readiness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          HAS_SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'skip-release-readiness') }}
        run: bun scripts/check-release-readiness.ts
      # ── dependencies + secrets ───────────────────────────────────────────
      - name: Dependency Audit (untrusted deps)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun pm untrusted
        continue-on-error: true
      - name: Dependency Audit (no lockfile drift)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: git diff --exit-code bun.lock || (echo "::error::Lockfile is out of sync with package.json" && exit 1)
      # The trufflehog action `docker run`s ghcr.io/trufflesecurity/trufflehog
      # at runtime, and ghcr.io intermittently times out on the manifest fetch
      # (exit 125, before any scan). Pre-pull with retry + backoff so the
      # action finds the image locally; a genuine sustained outage still fails
      # after honest retries. Scan scope and action SHA are unchanged.
      - name: Secrets Scan (pre-pull trufflehog image)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          img="ghcr.io/trufflesecurity/trufflehog:latest"
          for i in 1 2 3 4; do
            if docker pull "$img"; then exit 0; fi
            echo "::warning::ghcr.io pull attempt $i/4 failed for $img; backing off ${i}0s"
            sleep "${i}0"
          done
          echo "::error::trufflehog image pull failed after 4 attempts — genuine ghcr.io outage, not a transient flake"
          exit 1
      - name: Secrets Scan (trufflehog, verified only)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          extra_args: --only-verified

  # ── Shared setup anchor (YAML anchor not supported, so we repeat) ───────
  # Every downstream job: checkout → setup-bun → restore run_id caches.
  # No bun install needed — caches are guaranteed fresh from Install job.

  # ── Typecheck: per-category matrix (P3b) ─────────────────────────────
  # Sharded by `packages/<category>/` (8 cells in parallel). Each cell
  # narrows the affected-filter to its own slice via
  # `scripts/affected.ts --category=<name>`; cells with no affected
  # packages in their category skip gracefully (empty filter = no-op).
  # Aggregator `typecheck` job (next) keeps the stable `Typecheck`
  # required check name for branch protection.
  #
  # Why shard: pre-P3b Typecheck ran `bun run $FILTER --sequential
  # typecheck` against EVERY affected package on one runner (~270s
  # median for full-suite runs because we must run sequentially to
  # avoid 7+ heavy tsc invocations OOM-killing the 7GB runner). Sharding
  # parallelizes across runners — per-cell wall-clock = ~max-of-category
  # (90-120s typical) instead of the full sum. Critical-path drop
  # ~150-180s.
  #
  # Why 8 cells (not 5 as the plan first sketched): every `packages/*`
  # category is its own cell — including `internals` (4 pkgs), `ui` (3
  # private), `native` (6, newer ios/android stuff). The matrix infra
  # cost is per-cell startup overhead (~30s composite restore); going
  # 5→8 cells adds ~3 runners but each finishes in ~30-60s anyway
  # because every cell carries fewer packages. Smaller cells also fit
  # under the 10min job timeout with comfortable margin on the OOM-
  # sensitive `--sequential` path.
  typecheck-cell:
    name: typecheck (${{ matrix.name }})
    # DYNAMIC matrix (2026-07): only categories with affected packages spawn a
    # cell — `changes` computes the list with the SAME script+base each cell
    # uses, so the spawn decision and the cell's own filter can never disagree.
    # Pre-change all 9 cells booted a runner on every PR and most self-skipped
    # via an empty filter (~30–60s of queue+checkout+setup per no-op). The
    # `typecheck` aggregator treats a skipped/empty matrix as a pass.
    # Fail-closed twice over: if `changes` failed, the failure() arm runs the
    # cells AND the `|| full-list` matrix fallback spawns every category.
    # `examples` is a pseudo-category (affected.ts maps it to the top-level
    # examples/ dir) — example type regressions were invisible to CI before it.
    needs: install
    if: ${{ (success() && needs.install.outputs.typecheck-has == 'true') || (failure() && needs.install.result != 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.install.outputs.typecheck-matrix || '[{"name":"all","members":"core fundamentals internals native tools ui ui-system zero examples"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # affected.ts needs the merge-base to compute a real diff;
          # the install job uses fetch-depth: 0 for the same reason.
          fetch-depth: 0
      - uses: ./.github/actions/setup-pyreon
        with:
          # P3c — typecheck reads src/ via the bun customCondition (root
          # tsconfig.json line 8); lib/ is not needed. Skipping the
          # bootstrap restore lets typecheck start as soon as Install
          # finishes (~60s) instead of waiting for Bootstrap (~210s).
          restore-bootstrap: 'false'
      # Incremental typecheck cache (`incremental` in @pyreon/tsconfig/base.json).
      #
      # Every package resolves its @pyreon/* deps to SOURCE, so a cold typecheck
      # re-parses its whole dependency subtree. Measured locally on the `core`
      # category: 12.2s cold, 4.9s with a warm cache and a leaf-file change
      # (2.5x), 9.3s when a BASE package changed. Cells here run 144-235s and
      # `Typecheck` is a required check, so this is on the merge critical path.
      #
      # ## Why the key is what it is
      #
      # Cell NAMES are unstable across the PR/main boundary: `ci-batch` packs
      # whatever categories are affected, so main produces
      # `core+internals+native+tools` while a PR touching one package produces
      # `core`. A name-keyed cache would therefore miss in exactly the case it
      # exists for. The restore-key is a bare `runner.os` prefix so a PR cell
      # takes whichever tree is nearest, whatever cell built it.
      #
      # That works because the trees CONVERGE by construction: each cell
      # restores the broad prefix BEFORE typechecking and saves afterwards, so
      # what it saves is (whatever it restored) + (its own categories, fresh).
      # After one main run every key holds a near-complete tree, and a partial
      # or mismatched restore costs a cold typecheck — never a wrong one.
      #
      # ## Why a stale tree cannot produce a false green
      #
      # TypeScript versions every file in the program by CONTENT, so a cache
      # built on another commit re-checks whatever actually changed. That is the
      # load-bearing claim, and it is proven rather than assumed:
      # `incremental-typecheck-safety.test.ts` runs five classes of mutation
      # (own-source error, dependency arity, exported-type shape, removed
      # export, type-only change) against a warm cache AND from scratch and
      # asserts the two report IDENTICAL diagnostics.
      #
      # Saves happen on main only. A PR-scoped save is invisible to every other
      # PR, so it would cost upload time and help nobody.
      - name: Restore typecheck cache (tsbuildinfo)
        id: tsbuildinfo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/*/*/.cache/tsbuildinfo
            examples/*/.cache/tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ github.run_id }}-${{ matrix.name }}
          restore-keys: tsbuildinfo-${{ runner.os }}-
      - name: Run typecheck (${{ matrix.name }})
        env:
          MEMBERS: ${{ matrix.members }}
        run: |
          # A cell runs a BATCH of categories sequentially. No `set -e`: one
          # failing category must not hide the ones behind it, so failures are
          # collected and reported together at the end.
          FAILED=""
          for category in $MEMBERS; do
          echo "::group::typecheck — $category"
          # Recompute the filter per-cell with --category narrowing.
          # We DON'T reuse install.outputs.affected-filter because it
          # spans every category; per-cell we need only this slice.
          # The script's closure is still computed against the full dep
          # graph (a @pyreon/core change still expands to every
          # dependent), but the final emit drops anything outside the
          # cell's category.
          #
          # The `examples` pseudo-category maps to the top-level examples/
          # dir; every other category maps to packages/<cat>/.
          if [ "$category" = "examples" ]; then
            CATEGORY_GLOB="./examples/*"
          else
            CATEGORY_GLOB="./packages/$category/*"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" || true
            FILTER=$(bun run scripts/affected.ts \
              --base=origin/${{ github.base_ref }} \
              --category="$category")
            # Root-file change in a PR returns --filter=* from the
            # script (the only safe escalation when blast radius is
            # unknowable). At the cell level we translate that to the
            # category-scoped glob so each cell runs its OWN full
            # slice — otherwise every cell would run every package and
            # we'd lose the shard entirely.
            if [ "$FILTER" = "--filter=*" ]; then
              FILTER="--filter=$CATEGORY_GLOB"
            fi
          else
            # push:main + merge_group always run the full slice for
            # this category — the gate that protects main never
            # trusts the narrowing.
            FILTER="--filter=$CATEGORY_GLOB"
          fi
          if [ -z "$FILTER" ]; then
            echo "No affected packages in this category — skipping."
            echo "::endgroup::"
            continue
          fi
          echo "Cell filter: $FILTER"
          set -f
          # --sequential caps simultaneous memory at the largest
          # single tsc invocation (~775 MB for app-showcase, ~583 MB
          # for fundamentals-playground — the heaviest are the example
          # apps, now covered by the `examples` cell). --sequential keeps
          # per-cell peak memory at one tsc at a time.
          # shellcheck disable=SC2086
          bun run $FILTER --sequential typecheck || FAILED="$FAILED $category"
          set +f
          echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "::error title=typecheck batch failed::category(ies):$FAILED"
            exit 1
          fi

      # Save on main only — see the restore step's rationale. `if: always()` so
      # a cell that FAILED still contributes its cache: the packages that
      # typechecked cleanly before the failure produced valid buildinfo, and
      # discarding it would make the next run pay for them again.
      - name: Save typecheck cache (tsbuildinfo)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/*/*/.cache/tsbuildinfo
            examples/*/.cache/tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ github.run_id }}-${{ matrix.name }}

  # ── Test: per-category matrix (P3b) ──────────────────────────────────
  # Same shard shape as `typecheck-cell` above (8 cells, per-category).
  # Aggregator `test` job (next) keeps the stable `Test` required check
  # name for branch protection. See `typecheck-cell` comment for shard
  # rationale.
  #
  # P3c re-classification: needs `bootstrap`, not `install`. Most tests
  # use the bun condition → src/, but TWO classes of test legitimately
  # need lib/: bundle-size tests (`@pyreon/charts/src/tests/bundle-size`)
  # measure the BUILT lib/ in bytes, and tests that boot a nested Vite
  # SSR build at test time (`@pyreon/vite-plugin/src/tests/rocketstyle-
  # collapse`) hit Vite's hardcoded node-condition resolver which
  # requires lib/ for @pyreon/vite-plugin itself. Both surfaced as
  # `test (tools)` + `test (fundamentals)` failures on the first P3c
  # CI run; flipping back to `bootstrap` is the safe fix. Lib-free
  # tests still benefit indirectly — they run faster within the cell
  # because Install is now ~60s instead of ~210s, freeing the runner
  # pool sooner for everything downstream.
  test-cell:
    name: test (${{ matrix.name }})
    # Dynamic matrix (see typecheck-cell): only categories with affected
    # packages spawn — the doc-INPUT mapping is preserved because Install's
    # decide steps use the same affected.ts (anti-patterns.md /
    # docs/patterns/** → @pyreon/mcp → the `tools` cell spawns and runs its
    # parser test). The `Test` aggregator treats a skipped/empty matrix as a
    # pass and is fail-closed on an Install failure.
    # NO cost-gate edge (2026-09). The 2026-07 pass dropped the `typecheck`
    # edge (four queue rounds before a test started) and kept `lint` as a
    # cheap gate; with Lint now a step of Fast Gates, gating on it would
    # re-add a DAG level — and under slot contention a level is a full queue
    # round (tens of minutes, measured), while lint failures on CI are rare
    # (0 of the 25 most recent failed runs — the pre-push hook catches them).
    # A lint or typecheck failure no longer skips tests; the merge is
    # blocked by the required Fast Gates / Test checks regardless, so the
    # only cost is some wasted runner time on a doomed
    # run — cheaper than taxing every green run with two extra queue rounds.
    needs: install
    if: ${{ (success() && needs.install.outputs.test-has == 'true') || (failure() && needs.install.result != 'success') }}
    runs-on: ubuntu-latest
    # `native` used to be ONE cell carrying two unrelated heavy workloads, and
    # it kept getting timeout-CANCELLED — which fails the required `Test`
    # aggregator on PRs that never touched native. The first attempt at a fix
    # raised the cap 10 → 25 minutes; measurement shows why that only bought
    # time: on `main` the single cell runs 1357–1472s against the 1500s cap,
    # i.e. 2–10% headroom. A gate that close to its own limit is a coin flip,
    # and a coin-flip required gate is worse than no gate.
    #
    # `native/compiler` is ~75-85% of the pair's cost, and that cost is almost
    # entirely REAL TOOLCHAIN. `packages/native/compiler/src/validate.ts` shells
    # out via `execFileSync`, and the suite has 175 `validateSwift`/
    # `validateKotlin` call sites across 98 test files. Measured warm, per
    # invocation: `swiftc -parse` 5.2-5.7s, `kotlinc` 17.4s. 175 x ~15s ~= 2600s,
    # which accounts for the whole ~2800s of aggregate test CPU. On 4 vCPUs that
    # is ~700s + overhead; the cell is observed at 1276s. Consistent.
    #
    # Two plausible hypotheses that measurement killed, recorded so nobody pays
    # for them twice:
    #   - "The 21 chained `verify-kotlin.ts --service=` runs pay kotlinc startup
    #     21 times." They are 26% of the cell, and the JVM page-cache warms after
    #     the first (29s cold, then 2-4s). Optimising them targets the wrong 26%.
    #   - "native/compiler spawns no toolchain; `import 383s` is the lead."
    #     Both false. `--no-isolate` cuts import 383s -> 48s and wall-clock does
    #     not move (291s -> 294s): `tests`, not `import`, dominates.
    #
    # So neither cell can be made meaningfully faster by scheduling, and the
    # toolchain cost is irreducible without changing what the suite validates.
    # What WAS fixable: two unrelated heavy workloads shared one runner for no
    # reason but living in the same directory. Hence a runner each.
    #
    # The halves are `native/compiler` and `native` MINUS `native/compiler`
    # (see `filterByCategory`'s `exclude`), so their union is `native` BY
    # CONSTRUCTION — a newly-added `packages/native/<pkg>` joins the `-rest`
    # cell automatically rather than silently escaping CI.
    #
    # Observed after that split: `native-compiler` 1276s (85% of cap),
    # `native-rest` 191s (13%). 85% was flagged there as thinner than a
    # required gate deserves — and it was: the PMTC ui-system arc (#2456,
    # #2463-#2466, #2475-#2477, #2483, #2485) grew the suite from 175
    # `validateSwift`/`validateKotlin` call sites over 98 files to ~580 refs
    # over 123, and `native-compiler` began timeout-CANCELLING at the 1500s
    # cap ON MAIN — 3 of 4 consecutive main runs (30027780842, 30023863568,
    # 30008739790 all killed at ~25m15s; 30006624167 passed at 18m03s). A
    # cancelled cell fails the required `Test` aggregator, so main and every
    # PR branched off it were red through no fault of their own.
    #
    # It is NOT a hang: the 18m03s success on identical code proves the suite
    # converges, and the cancelled cells' logs show live `java`/kotlinc
    # compiles at kill time. It is genuine, earned growth in toolchain spawns.
    #
    # The fix is more runners, not a bigger cap — the previous note's own
    # conclusion ("the remaining lever is spawn reduction, NOT a cap tweak")
    # still holds, and raising 25 -> 35 would just rebuild the same cliff one
    # feature arc later. `native-compiler` is therefore SHARDED via vitest
    # `--shard=i/N`, which splits the package's test FILES into disjoint
    # groups whose union is every file — changing NOTHING about what is
    # validated: every test still runs, on some runner, exactly once. Spawn
    # reduction (batch/cache `swiftc -parse` / `kotlinc`) remains the real
    # long-term lever; sharding buys the room to do it deliberately instead
    # of under a red gate.
    #
    # 2026-08-19: the 2-way split ran out. `native-compiler-1` was CANCELLED
    # at 25m16s against the 25-minute cap — not a failure, a ceiling — and
    # the fail-closed aggregator turns `cancelled` into a red `Test`, so it
    # presents as a broken PR rather than an over-budget cell. Split three
    # ways (304 test files). The native lowering arcs keep adding REAL
    # swiftc/kotlinc specs, which is exactly the growth this cap is meant to
    # absorb, so expect to need a 4th eventually.
    #
    # If a shard starts creeping toward the cap again, add the NEXT cell and
    # bump the `--shard=i/N` denominators — do NOT raise the cap.
    #
    # Non-native cells are vitest-only and keep the tight 10-minute cap so a
    # genuine hang there still fails fast.
    timeout-minutes: ${{ startsWith(matrix.name, 'native') && 25 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        # Dynamic (see typecheck-cell): only affected categories spawn;
        # `|| full-list` fallback keeps a `changes` failure fail-closed.
        include: ${{ fromJSON(needs.install.outputs.test-matrix || '[{"name":"native-compiler-1","members":"native-compiler-1"},{"name":"native-compiler-2","members":"native-compiler-2"},{"name":"native-compiler-3","members":"native-compiler-3"},{"name":"native-rest","members":"native-rest"},{"name":"batch-a","members":"core fundamentals internals"},{"name":"batch-b","members":"tools ui ui-system zero"}]') }}
    steps:
      # Pin Node — vitest's `#!/usr/bin/env node` shebang means tests
      # run under whatever Node is on PATH. Without this, ubuntu-latest's
      # baked-in Node (currently 20) runs vitest; developers on Node 22+
      # hit interactions (e.g. the happy-dom localStorage shim trap fixed
      # in vitest.setup.ts) that ubuntu's stale Node masks. Pinning to
      # active-LTS Node 24 makes the CI env reflect what modern consumers
      # use, so bugs surface in CI instead of only at pre-push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pyreon
        with:
          node-version: '24'
          # P3c — needs lib/ for bundle-size tests + nested-Vite-SSR
          # tests; default `restore-bootstrap: 'true'` is correct.
      # Native compile-verdict cache — the single biggest work item in CI.
      #
      # The two native-compiler cells were measured at ~1030s EACH on an
      # ordinary PR run (2026-08-04, run 30901780195): 44% of the entire run's
      # work minutes, and the wall-clock critical path. Per-file timing showed
      # where it goes — validate-kotlin.test.ts alone was 697s — because
      # ubuntu runner images SHIP kotlinc, so the ~600 real compile
      # validations run, and they ran COLD every time: the content-addressed
      # verdict cache (validate-cache.ts; measured 397s cold → 6s warm) was
      # only ever wired up in native-validate.yml. These cells fell back to
      # tmpdir(), fresh per runner. The in-file comment above calling the
      # toolchain cost "irreducible" predates that cache.
      #
      # Correctness is carried by the CACHE'S OWN KEYS (validator kind +
      # compiler version + exact compiled bytes), not by this workflow key —
      # a stale entry can only miss, never lie. RESTORE always; SAVE on
      # push:main only (the #2652 lesson: per-branch saves duplicate the
      # store once per branch and evict everything else out of the 10 GB
      # repo budget). PRs restore main's latest store via the prefix key.
      # The nightly native-validate schedule stays deliberately UNCACHED.
      # Keys are PER-CATEGORY: the three native cells derive DISJOINT verdict
      # sets (two vitest shards + the rest), so a shared key would (a) make
      # the three saves race one immutable key — first wins, the others error
      # — and (b) let a cell restore a sibling's store, all misses. Each cell
      # saves and restores its own category's lineage.
      - name: Restore native compile-verdict cache
        if: startsWith(matrix.name, 'native')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pyreon-native-validate
          key: native-verdicts-ci-${{ runner.os }}-${{ matrix.name }}-${{ github.sha }}
          restore-keys: native-verdicts-ci-${{ runner.os }}-${{ matrix.name }}-

      - name: Run tests (${{ matrix.name }})
        # PYREON_SKIP_SLOW_TESTS=1 makes individual tests opt OUT of the
        # PR-time fast path. Today this skips `bootstrap-exit-codes.test.ts`
        # in test (internals) — which takes ~190s on CI due to 8 subprocess
        # spawns of bun + the bootstrap.ts walk. The contract is covered by
        # the dedicated `bootstrap-exit-codes` cell below, which runs WITHOUT
        # this env var when scripts/bootstrap.ts itself changes. push:main +
        # merge_group also run the full suite (no env var passed).
        env:
          PYREON_SKIP_SLOW_TESTS: ${{ github.event_name == 'pull_request' && '1' || '' }}
          # Verdict store for the native cells (see the restore step above).
          # Harmless for non-native cells: validate-cache only engages when a
          # validator actually runs.
          PYREON_VALIDATE_CACHE_DIR: ${{ github.workspace }}/.cache/pyreon-native-validate
          MEMBERS: ${{ matrix.members }}
        run: |
          # A cell runs a BATCH of categories sequentially. No `set -e` around
          # the loop: one failing category must not hide the ones behind it.
          BATCH_FAILED=""
          for category in $MEMBERS; do
          echo "::group::test — $category"
          # Most cells map 1:1 onto `packages/<category>/`. The two `native-*`
          # cells are PSEUDO-categories splitting `packages/native/` across two
          # runners (see the timeout-minutes comment). Their `--exclude`/glob
          # complement is derived, never enumerated, so a new native package is
          # always covered by exactly one of them.
          case "$category" in
            # All compiler shards resolve the SAME package; they differ only
            # by vitest `--shard`, which splits the package's test FILES into
            # disjoint groups whose union is every file. Sharding is applied
            # at `vitest run`; `vitest list` ignores it, so never probe the
            # split with `list`.
            native-compiler-1)
              AFFECTED_ARGS="--category=native/compiler"
              FULL_FILTER="--filter=./packages/native/compiler"
              SHARD_ARGS="--shard=1/3"
              ;;
            native-compiler-2)
              AFFECTED_ARGS="--category=native/compiler"
              FULL_FILTER="--filter=./packages/native/compiler"
              SHARD_ARGS="--shard=2/3"
              ;;
            native-compiler-3)
              AFFECTED_ARGS="--category=native/compiler"
              FULL_FILTER="--filter=./packages/native/compiler"
              SHARD_ARGS="--shard=3/3"
              ;;
            native-rest)
              AFFECTED_ARGS="--category=native --exclude=native/compiler"
              FULL_FILTER=$(for d in packages/native/*/; do
                d="${d%/}"
                [ "$d" = "packages/native/compiler" ] && continue
                printf -- '--filter=./%s ' "$d"
              done)
              ;;
            *)
              AFFECTED_ARGS="--category=$category"
              FULL_FILTER="--filter=./packages/$category/*"
              ;;
          esac
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" || true
            FILTER=$(bun run scripts/affected.ts \
              --base=origin/${{ github.base_ref }} \
              $AFFECTED_ARGS)
            if [ "$FILTER" = "--filter=*" ]; then
              FILTER="$FULL_FILTER"
            fi
          else
            FILTER="$FULL_FILTER"
          fi
          if [ -z "$FILTER" ]; then
            echo "No affected packages in this category — skipping."
            echo "::endgroup::"
            continue
          fi
          echo "Cell filter: $FILTER${SHARD_ARGS:+ (shard $SHARD_ARGS)}"
          set -f
          # Some affected packages genuinely have no `test` script (rare
          # under packages/* — most are zero-cli kind of shape — but
          # possible). When the affected filter matches only such
          # packages, bun errors with "No packages matched the filter"
          # and exits 1. Tolerate that case — fail on real test
          # failures only.
          set +e
          # `$SHARD_ARGS` is empty for every non-sharded cell, so this is
          # byte-identical to the unsharded command there (unquoted on
          # purpose, under `set -f`, so empty expands to nothing).
          OUTPUT=$(bun run $FILTER test $SHARD_ARGS 2>&1)
          EXIT=$?
          set -e
          echo "$OUTPUT"
          if [ $EXIT -ne 0 ] && echo "$OUTPUT" | grep -q "No packages matched the filter"; then
            echo "(no matching packages have a 'test' script — treating as no-op)"
            EXIT=0
          fi
          [ $EXIT -ne 0 ] && BATCH_FAILED="$BATCH_FAILED $category"
          set +f
          echo "::endgroup::"
          done
          if [ -n "$BATCH_FAILED" ]; then
            echo "::error title=test batch failed::category(ies):$BATCH_FAILED"
            exit 1
          fi

      # Save the verdict store from EVERY run, PRs included. It was main-only
      # (the "save on main only" rule that exists for the 1 GB tarball
      # store), but this store is <1 MB and content-addressed — a verdict is
      # a pure function of (compiler version, stub text, exact bytes), so a
      # PR cannot "poison" it, only add entries — and main-only saving had a
      # real cost: main's run is CANCELLED whenever a newer merge queues
      # behind it (27 of the last 60), so the store went unsaved for hours
      # and the next run paid ~60 min of cold `kotlinc`/`swiftc` (measured
      # 1325s + 1312s + 931s on run 33532534054, vs ~45s warm). The sha in
      # the key keeps entries distinct; the restore's bare prefix picks the
      # newest. `if: always()` so a red run still saves what it derived.
      # This step MUST live in THIS matrix job: the first cut sat in the
      # `Test` aggregator, where `matrix.name` doesn't exist (condition
      # never true) and the derived store isn't on disk — so zero caches
      # were ever saved and every native cell stayed cold at ~15-17min.
      - name: Save native compile-verdict cache
        if: always() && startsWith(matrix.name, 'native')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pyreon-native-validate
          key: native-verdicts-ci-${{ runner.os }}-${{ matrix.name }}-${{ github.sha }}

  # ── E2E: real-Chromium app-level tests against example apps ──────────
  # Parallel, flake-resilient matrix. Before 2026-05 this was ONE runner
  # executing 11 suites SEQUENTIALLY — wall-clock = the SUM (~6-10 min),
  # and a flake in suite N skipped every suite after it (an unrelated
  # storage-hydration flake once skipped the whole zero-hmr gate). Now:
  #
  #  • `e2e-decide` maps the PR's changed paths → only the suites those
  #    changes can affect (scripts/e2e-affected.ts). push:main and
  #    merge_group always run ALL — the gate protecting main never
  #    trusts the narrowing; false-negatives are the only real danger.
  #  • `e2e-suite` is a `fail-fast: false` matrix — every suite is its
  #    own parallel job + own check. One suite's flake/failure cannot
  #    skip or cancel another. Wall-clock ≈ the slowest single suite.
  #  • Every playwright*.config.ts uses `retries: process.env.CI ? 2 : 0`
  #    so a flaky spec self-heals within its job (3 attempts); a real
  #    bug fails all 3. Local stays 0 for honest, fast feedback.
  #  • `e2e` (THIS exact check name) is the STABLE required check: it
  #    aggregates the matrix so branch-protection's "E2E" requirement
  #    keeps working no matter which / how many matrix jobs ran, and an
  #    empty matrix (docs-only PR) resolves as a green skip.
  e2e-suite:
    name: e2e (${{ matrix.name }})
    # e2e suites boot example apps via `vite preview` / `vite build`, which
    # resolve @pyreon/* via the node condition → lib/ (built by Install,
    # which also selects the suites). Fail-closed: a failed Install leaves
    # e2e-has empty → suites skip → the `Test` AGGREGATOR fails (it requires
    # install.result == success), so the check goes red, never
    # green-via-skip.
    needs: install
    if: needs.install.outputs.e2e-has == 'true'
    runs-on: ubuntu-latest
    # A cell runs a BATCH of suites now, so the cap covers the batch, not one
    # suite. Full serial e2e is ~8-20 min across every suite; at 4 batches the
    # heaviest lands well under 10 min, and 25 leaves real headroom for a slow
    # runner without letting a genuine hang sit for an hour.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.install.outputs.e2e-matrix || '[]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pyreon
      # RESTORE always; SAVE only on main. The browser bundle is ~261 MB and
      # depends only on the Playwright version in bun.lock, so a per-branch save
      # stored the SAME bytes once per PR — four live copies, 783 MB of pure
      # duplication, in a cache that is at 9.77 GB of its 10 GB limit.
      #
      # That ceiling is not an abstract tidiness concern. Bootstrap caches are
      # 5 MB, and one saved at 19:04 on run 30840261671 was already GONE when a
      # downstream job looked at 19:23. Every lib-needing job then rebuilds all
      # 74 packages: 43 jobs x ~350s = 228 of that run's 401 runner-minutes.
      # Large low-value entries evict small high-value ones.
      #
      # A PR that changes bun.lock misses the exact key, falls through the
      # `playwright-chromium-<os>-` prefix to main's nearest browser, and the
      # install step below reconciles it — the same path a cold runner takes.
      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-chromium-${{ runner.os }}-
      - name: Install Playwright Chromium
        run: |
          # The recurring e2e / Test(browser) "cancelled" flake is the Playwright
          # install hanging until the 15-min job timeout (the specs never run —
          # the whole budget burns in this step). TWO independent apt hangs cause
          # it, both addressed here:
          #   1. `apt-get update` hangs on GitHub's packages.microsoft.com apt
          #      sources (azure-cli + prod) when they 403 → strip them first.
          #   2. The `apt-get install` of the OS deps hangs FETCHING the ~21 MB of
          #      .deb archives from GitHub's apt mirror (observed: 14 min stuck at
          #      "Need to get 21.1 MB" before cancellation).
          # ubuntu-latest already ships Chromium's core libs, so the OS-dep install
          # is best-effort + hard-timeout-bounded + non-fatal; the browser binary
          # (from Playwright's own CDN, which never hangs) is what matters and is
          # ALWAYS installed.
          sudo grep -rlZ packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -0 -r rm -f || true
          timeout 240 bunx playwright install-deps chromium || echo "::warning::playwright install-deps timed out or failed — relying on the runner's preinstalled Chromium libs"
          bunx playwright install chromium
      # Same shared-entry rule as the browser-test job above.
      - name: Save Playwright browsers (main only)
        if: always() && github.ref == 'refs/heads/main' && steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Run e2e — ${{ matrix.name }}
        # Tee the combined output so the next step can surface FLAKY
        # specs. `set -o pipefail` keeps Playwright's real exit code
        # through the pipe so a genuine failure still fails the job.
        #
        # A cell now runs a BATCH of suites sequentially (see the batching
        # comment on `Select affected e2e suites`). Every suite still runs as
        # its own `bun run`, so behaviour per suite is unchanged — only the
        # number of RUNNERS changed.
        #
        # Deliberately NO `set -e`: a failing suite must not abort the rest of
        # the batch, or one red suite would mask every suite behind it (the
        # isolation the per-suite matrix was originally introduced to get). We
        # collect failures and fail the job at the end with all of them named.
        env:
          MEMBERS: ${{ matrix.members }}
        run: |
          set -o pipefail
          : > /tmp/e2e-out.txt
          FAILED=""
          for suite in $MEMBERS; do
            script=$(bun run scripts/e2e-affected.ts --scripts-for="$suite")
            echo "::group::e2e suite — $suite ($script)"
            if bun run "$script" 2>&1 | tee -a /tmp/e2e-out.txt; then
              echo "✓ $suite"
            else
              echo "::error title=e2e suite failed::$suite"
              FAILED="$FAILED $suite"
            fi
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "::error title=e2e batch failed::suite(s):$FAILED"
            exit 1
          fi
      - name: Surface flaky specs (passed only on retry)
        # `retries: 2` means a flaky spec self-heals → the job is green
        # and the flake is INVISIBLE. That hides a degrading spec. This
        # step turns "passed on retry" into a loud, durable signal: a
        # GitHub ::warning:: annotation + a job-summary block. It does
        # NOT fail the job (the retry already made it pass) — it makes
        # the flake impossible to ignore so the rate gets watched.
        if: always()
        run: |
          OUT=/tmp/e2e-out.txt
          [ -f "$OUT" ] || exit 0
          # Playwright's line/list reporter prints a final "  N flaky"
          # and lists each flaky title with a "(retry #N)" suffix.
          FLAKY=$(grep -E '[0-9]+ flaky' "$OUT" | grep -vE '\b0 flaky\b' || true)
          if [ -z "$FLAKY" ]; then
            echo "No flaky specs in suite '${{ matrix.name }}'."
            exit 0
          fi
          TITLES=$(grep -E '\(retry #[0-9]+\)' "$OUT" | sed 's/^[[:space:]]*//' | sort -u || true)
          echo "::warning title=Flaky e2e suite::'${{ matrix.name }}' had spec(s) that passed only on retry — $FLAKY"
          {
            echo "### ⚠️ Flaky specs in e2e suite \`${{ matrix.name }}\`"
            echo ""
            echo "Passed only after a retry (\`retries: 2\`). Green, but the flake rate should be watched / root-caused — not left to the retry mask."
            echo ""
            echo '```'
            echo "$FLAKY"
            [ -n "$TITLES" ] && { echo ""; echo "$TITLES"; }
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.name }}
          path: playwright-report/
          retention-days: 7

  # ── Scaffold smoke: end-to-end gate against create-pyreon-app ──────────
  # Runs the actual scaffolder + bun install + bun run build for every
  # cell defined in scripts/scaffold-smoke.ts (template × adapter ×
  # integrations). Catches the bug class that PR #404 shipped with —
  # template TS errors / missing deps / wrong API names that lint+
  # typecheck on the scaffolder package can't see, because templates
  # aren't in any tsconfig include path.
  #
  # P1d sharded this into 6 parallel cells; the 2026-09 queue pass packs
  # them into 3 batches via ci-batch.ts. The cells had grown to ~6 min
  # each (a scaffolded app's cold `bun install` dominates), so six of them
  # were six 50-min queue entries under slot contention — batching keeps
  # the per-batch failure surface, halves the setups, and frees 3 slots
  # for every other in-flight PR. See ci-batch.ts for the measured case.
  #
  # `scaffold-smoke-aggregate` mirrors the e2e aggregator pattern: a
  # stable required check name regardless of which cells ran (matches
  # branch-protection's expectations even if a cell gets renamed).
  #
  # ## Path-scoping (perf): PRs that don't touch the scaffolder OR any
  # template skip the matrix entirely. All 6 cells share the same
  # scaffold-relevant input surface (the cells differ only in template ×
  # adapter combinations — the SCAFFOLDER + the templates are the same
  # source) so it's all-or-nothing. Install's decide steps gate the matrix;
  # the `Test` aggregator treats an empty matrix as a green skip (same shape
  # as e2e). push:main + merge_group ALWAYS run the full matrix — main is
  # never allowed to merge an undetected scaffold regression.
  scaffold-smoke-cell:
    name: Scaffold Smoke (${{ matrix.name }})
    # Each cell runs `bun install` + `vite build` of the scaffolded app, which
    # resolves @pyreon/* via the node condition → lib/ (built by Install).
    needs: install
    if: ${{ needs.install.outputs.scaffold-has == 'true' }}
    runs-on: ubuntu-latest
    # Three cells of ~6 min in one batch, plus setup. Derived, not guessed:
    # measured cells run 222-373s; the heaviest LPT bin is 3 × ~370s.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Batched by Install's decide step — `[{name, members}]`, same shape
        # as the e2e matrix. `members` is the space-separated cell list.
        include: ${{ fromJSON(needs.install.outputs.scaffold-matrix || '[]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pyreon
      # A scaffolded app's `bun install` is the dominant per-cell cost, and
      # it ran against an EMPTY tarball store — every cell cold-fetched vite,
      # rolldown and friends from the registry. The monorepo's store holds
      # nearly all of them; restore-only (Install saves it on main).
      - name: Restore bun download cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-cache-${{ runner.os }}-
      # scaffold-smoke.ts accepts positional cell filters and runs the
      # matches sequentially:
      #   `bun scripts/scaffold-smoke.ts cpa-smoke-app-vercel cpa-smoke-app-static`
      - name: Run scaffold-smoke batch — ${{ matrix.name }}
        env:
          MEMBERS: ${{ matrix.members }}
        run: bun scripts/scaffold-smoke.ts $MEMBERS
  # ── Test: the ONE aggregator for every dynamic matrix ────────────────────
  # Branch protection pins a stable name; matrix cells have dynamic names.
  # This used to be four aggregator jobs (Test, Typecheck, E2E, Scaffold
  # Smoke), each a runner for 2 s of shell behind a 50-minute slot wait
  # (measured 2026-09-01). One job now aggregates all four matrices; the
  # other three names were dropped from protection. The summary names WHICH
  # matrix failed, so nothing is lost but three queue entries per PR.
  #
  # Semantics per matrix (unchanged from the four jobs it replaces):
  #   success  every cell passed (or self-skipped via an empty filter)
  #   skipped  the matrix was `if:`-gated off — nothing affected — a PASS
  #   e2e is special: the decide said RUN but the matrix did not succeed is a
  #   contradiction (#2978's shape) and reads as red, never green-via-skip.
  # Fail-closed on Install: if the decide job did not succeed, cell selection
  # is unknown and this is red regardless of what did run.
  test:
    name: Test
    needs: [install, typecheck-cell, test-cell, e2e-suite, scaffold-smoke-cell]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate typecheck / test / e2e / scaffold matrices
        env:
          INSTALL: ${{ needs.install.result }}
          TYPECHECK: ${{ needs.typecheck-cell.result }}
          TEST: ${{ needs.test-cell.result }}
          E2E: ${{ needs.e2e-suite.result }}
          E2E_HAS: ${{ needs.install.outputs.e2e-has }}
          SCAFFOLD: ${{ needs.scaffold-smoke-cell.result }}
        run: |
          echo "install=$INSTALL  typecheck=$TYPECHECK  test=$TEST  e2e=$E2E (selected=$E2E_HAS)  scaffold=$SCAFFOLD"
          fail=0
          ok() { [ "$1" = "success" ] || [ "$1" = "skipped" ]; }
          if [ "$INSTALL" != "success" ]; then
            echo "::error::Install (decide) did not succeed ($INSTALL) — cell selection is unknown"
            fail=1
          fi
          ok "$TYPECHECK" || { echo "::error::typecheck cell(s) failed ($TYPECHECK)"; fail=1; }
          ok "$TEST" || { echo "::error::test cell(s) failed ($TEST)"; fail=1; }
          ok "$SCAFFOLD" || { echo "::error::scaffold-smoke batch(es) failed ($SCAFFOLD)"; fail=1; }
          if [ "$E2E_HAS" = "true" ]; then
            [ "$E2E" = "success" ] || { echo "::error::e2e suites were selected but the matrix did not succeed ($E2E)"; fail=1; }
          else
            echo "No e2e-relevant changes — matrix empty, green skip."
          fi
          if [ "$fail" -eq 0 ]; then echo "All matrices passed (or were correctly skipped)."; fi
          exit $fail

  # ── Build: every lib-needing singleton gate, one runner ──────────────────
  # Was SEVEN jobs — Build, Verify Modes, Check Bundle Budgets, Check Import
  # Budgets, Check Distribution, Check Bin Liveness, Coverage — plus Test
  # (Rust binary). All needed the same restored lib/, all did 20-110s of
  # work, and each paid its own checkout + setup + a 20-50 minute slot wait
  # (measured 2026-09-01). Their check names were dropped from branch
  # protection; the gates themselves are unchanged and now report as named
  # steps of this one required job. Every step runs even after an earlier
  # failure (`!cancelled()`) so a push shows every red gate at once.
  #
  # Gated on `code` (a docs-only PR changes no build output), fail-closed
  # on an Install failure.
  build:
    name: Build
    needs: install
    if: ${{ (success() && needs.install.outputs.code == 'true') || (failure() && needs.install.result != 'success') }}
    runs-on: ubuntu-latest
    # Derived from the measured steps (2026-09-01): examples build 70s +
    # verify-modes 90s + budgets 55s + distribution 25s + bin-liveness 30s +
    # coverage 40-110s + rust (cached target) ~100s + setup ≈ 7-9 min; 25 is
    # ~3× and satisfies check-ci-job-timeouts' lib-restore floor.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # coverage's affected.ts needs the merge-base
      - uses: ./.github/actions/setup-pyreon
        id: setup
        with:
          # Coverage REQUIRES node (bun's inspector lacks the V8 coverage API);
          # check-coverage.ts spawns vitest under node explicitly.
          node-version: '24'
      # ── examples ─────────────────────────────────────────────────────────
      # @pyreon/* is already built (lib/ restored from this run's cache); only
      # the example apps build here. Including @pyreon/* in the filter would
      # race the examples: rolldown cleans lib/ before rebuilding, and an
      # example reading lib/seo.js mid-clean hits "Cannot find module".
      - name: Build examples
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -f
          bun run --filter='./examples/*' build
      # `vite build` every example × mode cell and assert the RENDERED content
      # (not just a green build) — the typed-but-unimplemented backstop.
      - name: Verify Modes
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run verify-modes
      # ── package contracts against the built lib/ ────────────────────────
      - name: Check Bundle Budgets
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run check-bundle-budgets
      - name: Check Import Budgets
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run check-import-budgets
      # sideEffects declared + source maps shipped + a live `npm pack
      # --dry-run` probe against the built tarball.
      - name: Check Distribution
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run check-distribution
      # Spawn every published bin under REAL node and assert it does
      # something — the published-dead-bin class (pyreon-lint's no-op bin).
      - name: Check Bin Liveness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run check-bin-liveness
      # ── coverage ─────────────────────────────────────────────────────────
      - name: Coverage (floor + exemption drift)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run coverage:floor
      # Measure the packages this PR actually touches (`--changed-only`: the
      # DIRECTLY-changed workspaces, never the dependent closure — coverage
      # is a property of a package's own sources + tests, and the closure is
      # what tripped the >15 cap and silently skipped the packages that
      # matter most). The whole-repo run stays on push:main + merge_group.
      - name: Coverage (changed packages)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" || true
          FILTER=$(bun run scripts/affected.ts --changed-only --base=origin/${{ github.base_ref }})
          if [ "$FILTER" = "--filter=*" ]; then
            echo "Root-file change → blast radius unknowable; full coverage runs on main."
            exit 0
          fi
          NAMES=$(printf '%s\n' $FILTER | sed 's/^--filter=//' | paste -sd, -)
          COUNT=$(printf '%s\n' $FILTER | grep -c . || true)
          # A release PR touches every package.json → ~130 explicit filters;
          # the push:main full run is the backstop for that width.
          if [ "$COUNT" -gt 15 ]; then
            echo "$COUNT affected packages — too wide for a PR-time run;"
            echo "full coverage runs on push:main + merge_group."
            exit 0
          fi
          echo "Affected ($COUNT): ${NAMES:-<none>}"
          bun scripts/check-coverage.ts --only="$NAMES"
      # ── Rust binary: cross-backend equivalence gate ──────────────────────
      # Builds the @pyreon/compiler napi-rs binary and runs the compiler suite
      # with it loaded; the equivalence harness asserts every JS-path output
      # matches the Rust path. Without it only the JS fallback is exercised —
      # which is exactly what shipped the 6 divergences caught in #491.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master — pinned (OpenSSF Pinned-Dependencies)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        with:
          toolchain: stable
      - name: Cache cargo registry
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('packages/core/compiler/native/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-
      # Keyed by Cargo.lock + every Rust source: cargo's own content hashing
      # invalidates correctly, so a hit means the compiled output is exact.
      - name: Cache cargo target/
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/core/compiler/native/target
          key: cargo-target-${{ runner.os }}-${{ hashFiles('packages/core/compiler/native/Cargo.lock', 'packages/core/compiler/native/src/**/*.rs') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-${{ hashFiles('packages/core/compiler/native/Cargo.lock') }}-
            cargo-target-${{ runner.os }}-
      - name: Build native binary
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run --filter='@pyreon/compiler' build:native
      # build-native.ts soft-fails so cargo trouble routes CONSUMERS to JS;
      # CI's job is the opposite — fail loudly so the gate can never erode to
      # "JS-only ran, equivalence silently skipped".
      - name: Assert native binary present
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          BIN=packages/core/compiler/native/pyreon-compiler.node
          if [ ! -f "$BIN" ]; then
            echo "::error::Native binary missing at $BIN. Cargo build failed silently (build-native.ts soft-fails). The Rust equivalence gate cannot run without it."
            exit 1
          fi
          echo "Binary OK: $(ls -la $BIN)"
      - name: Test (Rust binary) — @pyreon/compiler suite against the binary
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run --filter='@pyreon/compiler' test

  test-browser:
    name: Test (browser)
    # Same risk class as `test-cell`: any browser test that asserts on built
    # artifacts (lib/) needs the lib/ Install built — restored via
    # setup-pyreon rather than audited per test. Skips entirely on a
    # docs-only PR (`code == false`); fail-closed on an Install failure.
    needs: install
    if: ${{ (success() && needs.install.outputs.code == 'true') || (failure() && needs.install.result != 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pyreon
        with:
          node-version: '24'
      # RESTORE always; SAVE only on main. The browser bundle is ~261 MB and
      # depends only on the Playwright version in bun.lock, so a per-branch save
      # stored the SAME bytes once per PR — four live copies, 783 MB of pure
      # duplication, in a cache that is at 9.77 GB of its 10 GB limit.
      #
      # That ceiling is not an abstract tidiness concern. Bootstrap caches are
      # 5 MB, and one saved at 19:04 on run 30840261671 was already GONE when a
      # downstream job looked at 19:23. Every lib-needing job then rebuilds all
      # 74 packages: 43 jobs x ~350s = 228 of that run's 401 runner-minutes.
      # Large low-value entries evict small high-value ones.
      #
      # A PR that changes bun.lock misses the exact key, falls through the
      # `playwright-chromium-<os>-` prefix to main's nearest browser, and the
      # install step below reconciles it — the same path a cold runner takes.
      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-chromium-${{ runner.os }}-
      - name: Install Playwright Chromium
        run: |
          # The recurring e2e / Test(browser) "cancelled" flake is the Playwright
          # install hanging until the 15-min job timeout (the specs never run —
          # the whole budget burns in this step). TWO independent apt hangs cause
          # it, both addressed here:
          #   1. `apt-get update` hangs on GitHub's packages.microsoft.com apt
          #      sources (azure-cli + prod) when they 403 → strip them first.
          #   2. The `apt-get install` of the OS deps hangs FETCHING the ~21 MB of
          #      .deb archives from GitHub's apt mirror (observed: 14 min stuck at
          #      "Need to get 21.1 MB" before cancellation).
          # ubuntu-latest already ships Chromium's core libs, so the OS-dep install
          # is best-effort + hard-timeout-bounded + non-fatal; the browser binary
          # (from Playwright's own CDN, which never hangs) is what matters and is
          # ALWAYS installed.
          sudo grep -rlZ packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -0 -r rm -f || true
          timeout 240 bunx playwright install-deps chromium || echo "::warning::playwright install-deps timed out or failed — relying on the runner's preinstalled Chromium libs"
          bunx playwright install chromium
      # Populate the shared entry ONLY from main, so one copy serves every PR
      # instead of one copy per PR. `if: always()` is deliberate: a failing spec
      # must not throw away a browser download the next run would reuse.
      - name: Save Playwright browsers (main only)
        if: always() && github.ref == 'refs/heads/main' && steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun run test:browser

  release-build:
    name: Release Build
    needs: install
    if: ${{ (success() && needs.install.outputs.code == 'true') || (failure() && needs.install.result != 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pyreon
        with:
          restore-bootstrap: 'false'
      - name: Clean full build of every published package (release path)
        run: bun scripts/build-batched.ts
      - name: Pack + validate every manifest (publish dry-run, no upload)
        run: bun scripts/publish.ts --dry-run

  # ── Dedicated cell for `bootstrap-exit-codes.test.ts` ──────────────────
  # That single test file spawns 8 bun subprocesses, each running the
  # full bootstrap.ts walk over ~80 packages. Locally this runs in ~5s;
  # on GHA's slower runners it took ~190s (entirely dominating `test
  # (internals)`'s ~196s wall-clock). The PR-time test (internals) job
  # now sets PYREON_SKIP_SLOW_TESTS=1 to skip this file; this dedicated
  # cell runs WITHOUT the env var, but ONLY when `scripts/bootstrap.ts`
  # itself can have changed — that's the only path that can regress the
  # exit-code contract this suite protects.
  #
  # push:main / merge_group always run (safety: main never merges without
  # the full contract validation).
  bootstrap-exit-codes:
    name: bootstrap-exit-codes
    # Relevance is decided in Install — this job used to boot a runner on
    # EVERY PR (checkout + setup + node 24, ~21–31s) just to conclude "not
    # relevant, skip" ~99% of the time. Now the job itself skips (no runner)
    # unless bootstrap.ts / the test / the workflow changed. Fail-closed: a
    # failed Install runs it.
    needs: install
    if: ${{ (success() && needs.install.outputs.bootstrap-exit-codes == 'true') || (failure() && needs.install.result != 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pyreon
        with:
          node-version: '24'
          restore-bootstrap: 'false' # this test doesn't read lib/
      - name: Run bootstrap-exit-codes
        run: |
          bun run --filter='@pyreon/test-utils' test src/tests/bootstrap-exit-codes.test.ts

  coverage-full:
    name: Coverage (Full)
    # P3c — runs the full test suite, same lib/-requiring tests as
    # `test-cell`. Needs Bootstrap.
    #
    # Scoped to push:main + merge_group ONLY — NOT every PR. The original
    # "runs on every trigger" claim estimated ~30s added to PR CI; actual
    # CI measurement showed 262s (4.4 min) — 9× the estimate. That's a
    # 262s slice off the PR critical path for a check that only catches
    # numeric regressions main / merge_queue already gate on, and is
    # functionally duplicated for PR-visible feedback by the
    # `Coverage` floor gate (runs always, ~5s).
    #
    # Trade-off restored: a PR that drops a package's actual coverage from
    # 92% to 88% (still above the floor) passes `Coverage` but fails
    # `Coverage (Full)` at merge-queue time. Same safety as before; the
    # signal just lands at merge-time instead of PR-time.
    # Event-gated to push:main + merge_group only (never runs on PRs), so the
    # docs-only Layer-2 gate does not apply here — a code change always exists
    # by the time something lands on main.
    #
    # 2026-07 restoration: this job had gone red-on-arrival (12 packages below
    # their configured thresholds — coverage drifted under feature waves whose
    # tests live in the browser/e2e tier). A permanently-red safety net detects
    # nothing. Invariant since the restoration: every package's configured
    # thresholds sit AT/BELOW measured node-suite reality (ratchet up as tests
    # land, like lint-baseline); browser-covered files are coverageExclude'd /
    # v8-ignored from the node gate with per-site rationale. If this job goes
    # red, treat it as a REGRESSION to fix or an honest re-baseline to land
    # immediately — never leave it red (see anti-patterns.md "CI / Build Gate
    # Mistakes": a red-on-arrival gate is a dead gate).
    if: ${{ github.event_name == 'push' || github.event_name == 'merge_group' }}
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pyreon
        with:
          # Coverage REQUIRES node — bun's inspector lacks the V8 coverage API
          # ('Coverage APIs are not supported'; the 2026-08-04 all-72-packages
          # red main). check-coverage.ts spawns vitest under node explicitly
          # and preflights for it; this pins the version instead of trusting
          # whatever the runner image happens to ship on PATH that day.
          node-version: '24'
      - name: Run full per-package coverage
        run: bun run coverage

  # ── Benchmark (push:main only — track perf over time) ────────────────────
  benchmark:
    name: Benchmark
    if: github.event_name == 'push'
    # P3c — benchmarks measure realistic perf against the BUILT artifacts,
    # not src/. Needs Bootstrap.
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pyreon
      - name: Run core benchmarks
        run: bun run bench:all > bench-results.json
      - name: Run bundle size analysis
        run: bun run bench:bundle-size > bundle-size.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-${{ github.sha }}
          path: |
            bench-results.json
            bundle-size.json
          retention-days: 90