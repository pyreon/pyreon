name: CodeQL

# SAST gap (security-scorecard): static analysis of the JS/TS surface — the
# dominant injection/XSS attack surface for a UI framework + its compiler.
# Rust CodeQL support is still beta; the small native crate is covered by the
# 180-test cross-backend-equivalence oracle + bisect discipline, so it is a
# deliberate follow-up rather than a noisy day-one addition.

on:
  push:
    branches: [main]
  # NO `branches:` filter — deliberately. A PR whose base is another FEATURE
  # branch (a stack) is still a PR that will reach main, and gating this
  # workflow on `branches: [main]` meant it never ran on one: the PR then
  # showed a small all-green set from the handful of workflows that DO run on
  # any base, which reads as "validated" and is not.
  # Re-adding the filter re-opens that hole.
  pull_request:
  schedule:
    - cron: '27 4 * * 1' # weekly, Mondays 04:27 UTC

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload CodeQL SARIF to the Security tab
      actions: read
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: javascript-typescript
          queries: security-extended
          # Scope to the shipped runtime/compiler surface; exclude test
          # fixtures, e2e/examples, and build output (controlled-input
          # false positives, not an attack surface). See the config file.
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:javascript-typescript
