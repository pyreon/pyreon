name: PyreonShowcase

options:
  bundleIdPrefix: com.pyreon
  deploymentTarget:
    iOS: '17.0'

packages:
  PyreonRuntime:
    path: ../../packages/native/runtime-swift
  PyreonRouter:
    path: ../../packages/native/router-swift

targets:
  PyreonShowcase:
    # Compile the shared source (../native-showcase/src) to generated/*.swift
    # before every Swift compile.
    preBuildScripts:
      - script: |
          cd "${SRCROOT}"
          bash scripts/build.sh
        name: '[Pyreon] Compile ../native-showcase/src → generated/'
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
    type: application
    platform: iOS
    deploymentTarget: '17.0'

    sources:
      - path: ios
        type: group
      - path: generated
        # generated/ is gitignored; the preBuildScript fills it.
        optional: true

    dependencies:
      - package: PyreonRuntime
      - package: PyreonRouter

    info:
      path: ios/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Today
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: '6.0'
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: 0.0.1
        CFBundleVersion: '1'
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pyreon.PyreonShowcase
        # Every iOS example sets CODE_SIGN_ENTITLEMENTS (scripts/check-ios-signing-policy.ts).
        CODE_SIGN_ENTITLEMENTS: ios/PyreonShowcase.entitlements
        ENABLE_BITCODE: NO
        SWIFT_VERSION: '5.0'
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O

  # Launch-and-interact smoke: add, toggle and remove a todo on a real Simulator.
  PyreonShowcaseUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: iosUITests
        type: group
    dependencies:
      - target: PyreonShowcase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pyreon.PyreonShowcaseUITests
        TEST_TARGET_NAME: PyreonShowcase
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        SWIFT_VERSION: '5.0'

schemes:
  PyreonShowcase:
    build:
      targets:
        PyreonShowcase: all
        PyreonShowcaseUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - PyreonShowcaseUITests
    run:
      config: Debug
