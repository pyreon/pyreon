<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Remembered theme → <html> before first paint. Mirrors THEME_BOOT in src/dev/server.ts. -->
    <script>
      try{var t=localStorage.getItem('loom:theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-lm-theme',t)}catch(e){}
    </script>
    <!--pyreon-head-->
  </head>
  <body>
    <div id="app"><!--pyreon-app--></div>
    <!--pyreon-scripts-->
    <script type="module" src="/src/entry-client.ts"></script>
  </body>
</html>
