<title id="bc-sc-select-t">Scaling: select, 100 to 20,000 rows</title>
<desc id="bc-sc-select-d">Scaling: select, 100 to 20,000 rows, log scale, µs. Pyreon: 100 rows 0.426, 1,000 rows 0.442, 5,000 rows 0.431, 10,000 rows 0.439, 20,000 rows 0.442; Octane: 100 rows 0.868, 1,000 rows 0.9, 5,000 rows 0.826, 10,000 rows 0.832, 20,000 rows 0.823; Solid: 100 rows 1.8, 1,000 rows 7.5, 5,000 rows 36.3, 10,000 rows 60.8, 20,000 rows 109.9. synthetic · author-run · one run · M3 Max · record of 2026-11-05 · batch instrument.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
