.bc-sc-select{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.bc-sc-select .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.bc-sc-select .bc-sc-select-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.bc-sc-select *{animation:none!important;transition:none!important}.bc-sc-select .bc-sc-select-rm{opacity:1}.bc-sc-select .bc-sc-select-am{opacity:0}}

.bc-sc-select .ttl{fill:var(--px-strong);font-size:22px;font-weight:600;letter-spacing:-.015em}
.bc-sc-select .eb{fill:var(--px-fog);font-size:12px;letter-spacing:.14em}
.bc-sc-select .lab{fill:var(--px-mist);font-size:14px}
.bc-sc-select .labP{fill:var(--px-strong);font-weight:600}
.bc-sc-select .val{fill:var(--px-mist);font-size:13.5px}
.bc-sc-select .valP{fill:var(--px-strong);font-weight:600}
.bc-sc-select .bar{fill:var(--px-bar)}
.bc-sc-select .ref{fill:none;stroke:var(--px-fog);stroke-width:1.2;stroke-dasharray:3 3}
.bc-sc-select .cav{fill:var(--px-fog);font-size:12px}
.bc-sc-select .note{fill:var(--px-mist);font-size:13px}
.bc-sc-select .grid{stroke:var(--px-line);stroke-width:1}

.bc-sc-select .chip rect{fill:none;stroke-width:1.2}
.bc-sc-select .chip text{font-size:11px;letter-spacing:.12em;font-weight:600}
.bc-sc-select .chip-win rect{fill:url(#bc-sc-select-eg);stroke:none} .bc-sc-select .chip-win text{fill:#0A0A0E}
.bc-sc-select .chip-tie rect{stroke:var(--px-link)} .bc-sc-select .chip-tie text{fill:var(--px-link)}
.bc-sc-select .chip-split rect{stroke:var(--px-mist)} .bc-sc-select .chip-split text{fill:var(--px-mist)}
.bc-sc-select .chip-loss rect{stroke:var(--px-err)} .bc-sc-select .chip-loss text{fill:var(--px-err)}
.bc-sc-select .chip-info rect{stroke:var(--px-fog)} .bc-sc-select .chip-info text{fill:var(--px-fog)}
