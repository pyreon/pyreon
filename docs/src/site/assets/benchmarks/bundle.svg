<svg xmlns="http://www.w3.org/2000/svg" class="pxa bc-bundle" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="bc-bundle-t bc-bundle-d" fill="none">
<title id="bc-bundle-t">Bundle, same keyed-table app</title>
<desc id="bc-bundle-d">Bundle, same keyed-table app. Lower is better. Vanilla: 3.6 KB gzip; Solid: 7.5 KB gzip; Preact: 10.1 KB gzip; Svelte 5: 16.1 KB gzip; Pyreon: 17.2 KB gzip; Vue 3: 27.4 KB gzip; Octane: 43.1 KB gzip; React 19: 69.6 KB gzip. gzip -9 · sizes are deterministic · record of 2026-11-05.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}
.bc-bundle{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.bc-bundle .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.bc-bundle .bc-bundle-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.bc-bundle *{animation:none!important;transition:none!important}.bc-bundle .bc-bundle-rm{opacity:1}.bc-bundle .bc-bundle-am{opacity:0}}

.bc-bundle .ttl{fill:var(--px-strong);font-size:22px;font-weight:600;letter-spacing:-.015em}
.bc-bundle .eb{fill:var(--px-fog);font-size:12px;letter-spacing:.14em}
.bc-bundle .lab{fill:var(--px-mist);font-size:14px}
.bc-bundle .labP{fill:var(--px-strong);font-weight:600}
.bc-bundle .val{fill:var(--px-mist);font-size:13.5px}
.bc-bundle .valP{fill:var(--px-strong);font-weight:600}
.bc-bundle .bar{fill:var(--px-bar)}
.bc-bundle .ref{fill:none;stroke:var(--px-fog);stroke-width:1.2;stroke-dasharray:3 3}
.bc-bundle .cav{fill:var(--px-fog);font-size:12px}
.bc-bundle .note{fill:var(--px-mist);font-size:13px}
.bc-bundle .grid{stroke:var(--px-line);stroke-width:1}

.bc-bundle .chip rect{fill:none;stroke-width:1.2}
.bc-bundle .chip text{font-size:11px;letter-spacing:.12em;font-weight:600}
.bc-bundle .chip-win rect{fill:url(#bc-bundle-eg);stroke:none} .bc-bundle .chip-win text{fill:#0A0A0E}
.bc-bundle .chip-tie rect{stroke:var(--px-link)} .bc-bundle .chip-tie text{fill:var(--px-link)}
.bc-bundle .chip-split rect{stroke:var(--px-mist)} .bc-bundle .chip-split text{fill:var(--px-mist)}
.bc-bundle .chip-loss rect{stroke:var(--px-err)} .bc-bundle .chip-loss text{fill:var(--px-err)}
.bc-bundle .chip-info rect{stroke:var(--px-fog)} .bc-bundle .chip-info text{fill:var(--px-fog)}
</style>
<defs><linearGradient id="bc-bundle-eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="bc-bundle-egu" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="960" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="bc-bundle-egv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="bc-bundle-egd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient></defs>
<text class="m eb" x="0" y="20">LOWER IS BETTER · KB gzip</text>
<text class="ttl" x="0" y="56">Bundle, same keyed-table app</text><text class="m lab" x="0" y="107">Vanilla</text><rect class="ref" x="210" y="92.6" width="32.1" height="18.8" rx="4"/><text class="m val" x="250.0689655172414" y="107">3.6 KB gzip</text><text class="m lab" x="0" y="141">Solid</text><rect x="210" y="126" width="66.8" height="20" rx="4" class="bar"/><text class="m val" x="284.8103448275862" y="141">7.5 KB gzip</text><text class="m lab" x="0" y="175">Preact</text><rect x="210" y="160" width="90.0" height="20" rx="4" class="bar"/><text class="m val" x="307.9712643678161" y="175">10.1 KB gzip</text><text class="m lab" x="0" y="209">Svelte 5</text><rect x="210" y="194" width="143.4" height="20" rx="4" class="bar"/><text class="m val" x="361.4195402298851" y="209">16.1 KB gzip</text><text class="m lab labP" x="0" y="243">Pyreon</text><rect x="210" y="228" width="153.2" height="20" rx="4" fill="url(#bc-bundle-egu)"/><text class="m val valP" x="371.2183908045977" y="243">17.2 KB gzip</text><text class="m lab" x="0" y="277">Vue 3</text><rect x="210" y="262" width="244.1" height="20" rx="4" class="bar"/><text class="m val" x="462.08045977011494" y="277">27.4 KB gzip</text><text class="m lab" x="0" y="311">Octane</text><rect x="210" y="296" width="383.9" height="20" rx="4" class="bar"/><text class="m val" x="601.9367816091955" y="311">43.1 KB gzip</text><text class="m lab" x="0" y="345">React 19</text><rect x="210" y="330" width="620.0" height="20" rx="4" class="bar"/><text class="m val" x="838" y="345">69.6 KB gzip</text><text class="m note" x="0" y="382">A quarter of React 19. Solid, Preact and Svelte ship less; it is on the page.</text><text class="m cav" x="0" y="424">gzip -9 · sizes are deterministic · record of 2026-11-05</text>
</svg>
