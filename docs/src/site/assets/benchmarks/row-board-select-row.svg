<svg xmlns="http://www.w3.org/2000/svg" class="pxa bc-rb-select-row" viewBox="0 0 960 508" width="960" height="508" role="img" aria-labelledby="bc-rb-select-row-t bc-rb-select-row-d" fill="none">
<title id="bc-rb-select-row-t">Row board: select row</title>
<desc id="bc-rb-select-row-d">Row board: select row. Lower is better. Vanilla: 0.005 ms; Pyreon: 0.01 ms; Vue 3.6 Vapor (RC): 0.025 ms; Octane 0.16: 0.025 ms; Solid: 0.03 ms; Solid 2.0 (RC): 0.06 ms; React 19: 0.26 ms; Preact: 0.28 ms; Svelte 5: 0.325 ms; Vue 3: 0.38 ms. synthetic · author-run · two runs (run 1 figures) · M3 Max · real Chromium · record of 2026-11-05.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}
.bc-rb-select-row{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.bc-rb-select-row .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.bc-rb-select-row .bc-rb-select-row-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.bc-rb-select-row *{animation:none!important;transition:none!important}.bc-rb-select-row .bc-rb-select-row-rm{opacity:1}.bc-rb-select-row .bc-rb-select-row-am{opacity:0}}

.bc-rb-select-row .ttl{fill:var(--px-strong);font-size:22px;font-weight:600;letter-spacing:-.015em}
.bc-rb-select-row .eb{fill:var(--px-fog);font-size:12px;letter-spacing:.14em}
.bc-rb-select-row .lab{fill:var(--px-mist);font-size:14px}
.bc-rb-select-row .labP{fill:var(--px-strong);font-weight:600}
.bc-rb-select-row .val{fill:var(--px-mist);font-size:13.5px}
.bc-rb-select-row .valP{fill:var(--px-strong);font-weight:600}
.bc-rb-select-row .bar{fill:var(--px-bar)}
.bc-rb-select-row .ref{fill:none;stroke:var(--px-fog);stroke-width:1.2;stroke-dasharray:3 3}
.bc-rb-select-row .cav{fill:var(--px-fog);font-size:12px}
.bc-rb-select-row .note{fill:var(--px-mist);font-size:13px}
.bc-rb-select-row .grid{stroke:var(--px-line);stroke-width:1}

.bc-rb-select-row .chip rect{fill:none;stroke-width:1.2}
.bc-rb-select-row .chip text{font-size:11px;letter-spacing:.12em;font-weight:600}
.bc-rb-select-row .chip-win rect{fill:url(#bc-rb-select-row-eg);stroke:none} .bc-rb-select-row .chip-win text{fill:#0A0A0E}
.bc-rb-select-row .chip-tie rect{stroke:var(--px-link)} .bc-rb-select-row .chip-tie text{fill:var(--px-link)}
.bc-rb-select-row .chip-split rect{stroke:var(--px-mist)} .bc-rb-select-row .chip-split text{fill:var(--px-mist)}
.bc-rb-select-row .chip-loss rect{stroke:var(--px-err)} .bc-rb-select-row .chip-loss text{fill:var(--px-err)}
.bc-rb-select-row .chip-info rect{stroke:var(--px-fog)} .bc-rb-select-row .chip-info text{fill:var(--px-fog)}
