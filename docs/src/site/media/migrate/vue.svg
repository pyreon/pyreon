<svg xmlns="http://www.w3.org/2000/svg" class="pxa pm-vue" viewBox="0 0 960 710" width="960" height="710" role="img" aria-labelledby="pm-vue-t pm-vue-d" fill="none">
<title id="pm-vue-t">Migrating from Vue: before and after</title>
<desc id="pm-vue-d">Vue to Pyreon, before and after: the same Vue single-file component component (11 lines) and its TSX on @pyreon/vue-compat version (11 lines). 10 lines change; the changed lines are marked with a minus rail in the before code and a plus rail in the after code. Code before: &lt;script setup lang="ts"&gt;
import { computed, ref } from 'vue'

const props = defineProps&lt;{ step: number }&gt;()
const count = ref(0)
const doubled = computed(() =&gt; count.value * 2)
&lt;/script&gt;

&lt;template&gt;
  &lt;button class="counter" @click="count += props.step"&gt;{{ count }} / {{ doubled }}&lt;/button&gt;
&lt;/template&gt; Code after: import { computed, ref } from 'vue' // resolves to @pyreon/vue-compat

export function Counter(props: { step: number }) {
  const count = ref(0)
  const doubled = computed(() =&gt; count.value * 2)
  return (
    &lt;button class="counter" onClick={() =&gt; (count.value += props.step)}&gt;
      {count.value} / {doubled.value}
    &lt;/button&gt;
  )
}</desc>
