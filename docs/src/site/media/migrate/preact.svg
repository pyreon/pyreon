<svg xmlns="http://www.w3.org/2000/svg" class="pxa pm-preact" viewBox="0 0 960 710" width="960" height="710" role="img" aria-labelledby="pm-preact-t pm-preact-d" fill="none">
<title id="pm-preact-t">Migrating from Preact: before and after</title>
<desc id="pm-preact-d">Preact to Pyreon, before and after: the same Preact component (11 lines) and its Pyreon version (11 lines). 6 lines change; the changed lines are marked with a minus rail in the before code and a plus rail in the after code. Code before: import { useState } from 'preact/hooks'

export function Counter({ step }: { step: number }) {
  const [count, setCount] = useState(0)
  const doubled = count * 2
  return (
    &lt;button class="counter" onClick={() =&gt; setCount(count + step)}&gt;
      {count} / {doubled}
    &lt;/button&gt;
  )
} Code after: import { computed, signal } from '@pyreon/reactivity'

export function Counter(props: { step: number }) {
  const count = signal(0)
  const doubled = computed(() =&gt; count() * 2)
  return (
    &lt;button class="counter" onClick={() =&gt; count.update((c) =&gt; c + props.step)}&gt;
      {count()} / {doubled()}
    &lt;/button&gt;
  )
}</desc>
<style>
