<svg xmlns="http://www.w3.org/2000/svg" class="pxa pm-steps" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="pm-steps-t pm-steps-d" fill="none">
<title id="pm-steps-t">Migrating from React, step by step</title>
<desc id="pm-steps-d">The five migration steps as a loop: install the compat layer, change two config files, keep shipping, convert one component at a time, switch the compiler on. Six components of an app flip one by one from React-style (the body re-runs) to Pyreon (runs once) while @pyreon/react-compat sits underneath; at the last step the compat layer is switched off and jsxImportSource becomes @pyreon/core.</desc>
