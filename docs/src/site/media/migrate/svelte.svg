<svg xmlns="http://www.w3.org/2000/svg" class="pxa pm-svelte" viewBox="0 0 960 287" width="960" height="287" role="img" aria-labelledby="pm-svelte-t pm-svelte-d" fill="none">
<title id="pm-svelte-t">Migrating from Svelte: before and after</title>
<desc id="pm-svelte-d">Svelte to Pyreon: the Svelte store module stays exactly as it is. The import from svelte/store resolves to @pyreon/svelte-compat, so 5 lines carry over unchanged. Code before: // stores/cart.ts: unchanged. `svelte/store` resolves to @pyreon/svelte-compat/store
import { derived, writable } from 'svelte/store'

export const items = writable&lt;string[]&gt;([])
export const count = derived(items, ($items) =&gt; $items.length) Code after: // stores/cart.ts: unchanged. `svelte/store` resolves to @pyreon/svelte-compat/store
import { derived, writable } from 'svelte/store'

export const items = writable&lt;string[]&gt;([])
export const count = derived(items, ($items) =&gt; $items.length)</desc>
