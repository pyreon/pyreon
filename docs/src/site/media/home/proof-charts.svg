.pp-charts{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pp-charts .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
