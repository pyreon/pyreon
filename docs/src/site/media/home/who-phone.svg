<svg xmlns="http://www.w3.org/2000/svg" class="pxa ph-who-phone" viewBox="0 0 560 220" width="560" height="220" role="img" aria-labelledby="ph-who-phone-t ph-who-phone-d" fill="none">
<title id="ph-who-phone-t">A web app that wants a phone app</title>
<desc id="ph-who-phone-d">Schematic: one .tsx file feeds three targets: a browser window labelled web, and two phones labelled SwiftUI and Jetpack Compose. Native targets are marked experimental.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}
.ph-who-phone{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.ph-who-phone .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.ph-who-phone .ph-who-phone-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.ph-who-phone *{animation:none!important;transition:none!important}.ph-who-phone .ph-who-phone-rm{opacity:1}.ph-who-phone .ph-who-phone-am{opacity:0}}

.ph-who-phone .ln{stroke:var(--px-hint);stroke-width:1.5}
.ph-who-phone .dash{stroke:var(--px-hint);stroke-width:1.5;stroke-dasharray:4 6}
.ph-who-phone .bx{fill:var(--px-card);stroke:var(--px-bar);stroke-width:1.5}
.ph-who-phone .bx2{fill:var(--px-raised);stroke:var(--px-bar);stroke-width:1.5}
.ph-who-phone .act{fill:none;stroke:var(--px-text);stroke-width:2}
.ph-who-phone .lab{fill:var(--px-fog);font-size:14px;letter-spacing:.02em}
.ph-who-phone .eb{fill:var(--px-fog);font-size:13px;letter-spacing:.16em}
.ph-who-phone .val{fill:var(--px-text);font-size:20px;font-weight:500}
.ph-who-phone .big{fill:var(--px-strong);font-size:30px;font-weight:600;letter-spacing:-.02em}
.ph-who-phone .txt{fill:var(--px-text);font-size:16px}
.ph-who-phone .mt{fill:var(--px-mist);font-size:14px}
.ph-who-phone .hint{fill:var(--px-fog);font-size:13px}
.ph-who-phone .ember{stroke:url(#ph-who-phone-eg);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:36 2000;fill:none}
.ph-who-phone .emS{stroke:url(#ph-who-phone-eg);stroke-width:2.5;fill:none}
.ph-who-phone .ring{fill:none;stroke:var(--px-accent);stroke-width:2}
.ph-who-phone .ok{fill:var(--px-ok)} .ph-who-phone .warm{fill:var(--px-warm)} .ph-who-phone .hot{fill:var(--px-accent)} .ph-who-phone .err{fill:var(--px-err)}
.ph-who-phone .okT{fill:var(--px-ok)} .ph-who-phone .warmT{fill:var(--px-warm)} .ph-who-phone .hotT{fill:var(--px-accent-text)} .ph-who-phone .errT{fill:var(--px-err)} .ph-who-phone .linkT{fill:var(--px-link)}
.ph-who-phone .focus{fill:none;stroke:var(--px-link);stroke-width:2;stroke-dasharray:3 3}
.pxa{--sx-kw:#FF5E1A;--sx-str:#FFC83D;--sx-num:#FF1F8C;--sx-fn:#22D3EE;--sx-type:#A78BFA;--sx-com:#8A8696;--sx-fg:#E6E0D2;--sx-pane:#111118;--sx-pane-line:#2E2E3B;--sx-del-bar:#FF1F8C;--sx-del-bg:rgba(255,31,140,.12);--sx-del-text:#F7B9D6;--sx-ins-bar:#22D3EE;--sx-ins-bg:rgba(34,211,238,.09);--sx-ins-text:#E9FBFF}
@media (prefers-color-scheme: light){.pxa{--sx-kw:#C2410C;--sx-str:#8A5A00;--sx-num:#BE185D;--sx-fn:#0E7490;--sx-type:#6D28D9;--sx-com:#6B6776;--sx-fg:#14141C;--sx-pane:#F4EFE6;--sx-pane-line:#E6DFD2;--sx-del-bar:#D1106F;--sx-del-bg:rgba(209,16,111,.07);--sx-del-text:#8E0B4C;--sx-ins-bar:#0A6E89;--sx-ins-bg:rgba(10,110,137,.08);--sx-ins-text:#0B4F63}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--sx-kw:#FF5E1A;--sx-str:#FFC83D;--sx-num:#FF1F8C;--sx-fn:#22D3EE;--sx-type:#A78BFA;--sx-com:#8A8696;--sx-fg:#E6E0D2;--sx-pane:#111118;--sx-pane-line:#2E2E3B;--sx-del-bar:#FF1F8C;--sx-del-bg:rgba(255,31,140,.12);--sx-del-text:#F7B9D6;--sx-ins-bar:#22D3EE;--sx-ins-bg:rgba(34,211,238,.09);--sx-ins-text:#E9FBFF}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--sx-kw:#C2410C;--sx-str:#8A5A00;--sx-num:#BE185D;--sx-fn:#0E7490;--sx-type:#6D28D9;--sx-com:#6B6776;--sx-fg:#14141C;--sx-pane:#F4EFE6;--sx-pane-line:#E6DFD2;--sx-del-bar:#D1106F;--sx-del-bg:rgba(209,16,111,.07);--sx-del-text:#8E0B4C;--sx-ins-bar:#0A6E89;--sx-ins-bg:rgba(10,110,137,.08);--sx-ins-text:#0B4F63}
.ph-who-phone .cd{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--sx-fg);white-space:pre;font-variant-ligatures:none}
.ph-who-phone .cd .k{fill:var(--sx-kw)} .ph-who-phone .cd .s{fill:var(--sx-str)} .ph-who-phone .cd .n{fill:var(--sx-num)}
.ph-who-phone .cd .f{fill:var(--sx-fn)} .ph-who-phone .cd .t{fill:var(--sx-type)} .ph-who-phone .cd .c{fill:var(--sx-com)} .ph-who-phone .cd .u{fill:var(--sx-com)}
.ph-who-phone .pane{fill:var(--sx-pane);stroke:var(--sx-pane-line);stroke-width:1}
.ph-who-phone .delbg{fill:var(--sx-del-bg)} .ph-who-phone .delbar{fill:var(--sx-del-bar)} .ph-who-phone .insbg{fill:var(--sx-ins-bg)} .ph-who-phone .insbar{fill:var(--sx-ins-bar)}
.ph-who-phone .sgn-d{fill:var(--sx-del-bar)} .ph-who-phone .sgn-i{fill:var(--sx-ins-bar)}.ph-who-phone .warnT{fill:var(--px-warn)}
</style>
