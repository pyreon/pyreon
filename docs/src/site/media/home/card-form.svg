<svg xmlns="http://www.w3.org/2000/svg" class="pxa ph-card-form" viewBox="0 0 560 220" width="560" height="220" role="img" aria-labelledby="ph-card-form-t ph-card-form-d" fill="none">
<title id="ph-card-form-t">Forms</title>
<desc id="ph-card-form-d">A small form: the Email field holds ada@example.com and shows the inline error "Already registered" from an async validator; the password field below is untouched.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}
.ph-card-form{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.ph-card-form .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.ph-card-form .ph-card-form-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.ph-card-form *{animation:none!important;transition:none!important}.ph-card-form .ph-card-form-rm{opacity:1}.ph-card-form .ph-card-form-am{opacity:0}}

.ph-card-form .ln{stroke:var(--px-hint);stroke-width:1.5}
.ph-card-form .dash{stroke:var(--px-hint);stroke-width:1.5;stroke-dasharray:4 6}
.ph-card-form .bx{fill:var(--px-card);stroke:var(--px-bar);stroke-width:1.5}
.ph-card-form .bx2{fill:var(--px-raised);stroke:var(--px-bar);stroke-width:1.5}
.ph-card-form .act{fill:none;stroke:var(--px-text);stroke-width:2}
.ph-card-form .lab{fill:var(--px-fog);font-size:14px;letter-spacing:.02em}
.ph-card-form .eb{fill:var(--px-fog);font-size:13px;letter-spacing:.16em}
.ph-card-form .val{fill:var(--px-text);font-size:20px;font-weight:500}
.ph-card-form .big{fill:var(--px-strong);font-size:30px;font-weight:600;letter-spacing:-.02em}
.ph-card-form .txt{fill:var(--px-text);font-size:16px}
.ph-card-form .mt{fill:var(--px-mist);font-size:14px}
.ph-card-form .hint{fill:var(--px-fog);font-size:13px}
.ph-card-form .ember{stroke:url(#ph-card-form-eg);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:36 2000;fill:none}
.ph-card-form .emS{stroke:url(#ph-card-form-eg);stroke-width:2.5;fill:none}
.ph-card-form .ring{fill:none;stroke:var(--px-accent);stroke-width:2}
.ph-card-form .ok{fill:var(--px-ok)} .ph-card-form .warm{fill:var(--px-warm)} .ph-card-form .hot{fill:var(--px-accent)} .ph-card-form .err{fill:var(--px-err)}
.ph-card-form .okT{fill:var(--px-ok)} .ph-card-form .warmT{fill:var(--px-warm)} .ph-card-form .hotT{fill:var(--px-accent-text)} .ph-card-form .errT{fill:var(--px-err)} .ph-card-form .linkT{fill:var(--px-link)}
.ph-card-form .focus{fill:none;stroke:var(--px-link);stroke-width:2;stroke-dasharray:3 3}
.pxa{--sx-kw:#FF5E1A;--sx-str:#FFC83D;--sx-num:#FF1F8C;--sx-fn:#22D3EE;--sx-type:#A78BFA;--sx-com:#8A8696;--sx-fg:#E6E0D2;--sx-pane:#111118;--sx-pane-line:#2E2E3B;--sx-del-bar:#FF1F8C;--sx-del-bg:rgba(255,31,140,.12);--sx-del-text:#F7B9D6;--sx-ins-bar:#22D3EE;--sx-ins-bg:rgba(34,211,238,.09);--sx-ins-text:#E9FBFF}
@media (prefers-color-scheme: light){.pxa{--sx-kw:#C2410C;--sx-str:#8A5A00;--sx-num:#BE185D;--sx-fn:#0E7490;--sx-type:#6D28D9;--sx-com:#6B6776;--sx-fg:#14141C;--sx-pane:#F4EFE6;--sx-pane-line:#E6DFD2;--sx-del-bar:#D1106F;--sx-del-bg:rgba(209,16,111,.07);--sx-del-text:#8E0B4C;--sx-ins-bar:#0A6E89;--sx-ins-bg:rgba(10,110,137,.08);--sx-ins-text:#0B4F63}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--sx-kw:#FF5E1A;--sx-str:#FFC83D;--sx-num:#FF1F8C;--sx-fn:#22D3EE;--sx-type:#A78BFA;--sx-com:#8A8696;--sx-fg:#E6E0D2;--sx-pane:#111118;--sx-pane-line:#2E2E3B;--sx-del-bar:#FF1F8C;--sx-del-bg:rgba(255,31,140,.12);--sx-del-text:#F7B9D6;--sx-ins-bar:#22D3EE;--sx-ins-bg:rgba(34,211,238,.09);--sx-ins-text:#E9FBFF}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--sx-kw:#C2410C;--sx-str:#8A5A00;--sx-num:#BE185D;--sx-fn:#0E7490;--sx-type:#6D28D9;--sx-com:#6B6776;--sx-fg:#14141C;--sx-pane:#F4EFE6;--sx-pane-line:#E6DFD2;--sx-del-bar:#D1106F;--sx-del-bg:rgba(209,16,111,.07);--sx-del-text:#8E0B4C;--sx-ins-bar:#0A6E89;--sx-ins-bg:rgba(10,110,137,.08);--sx-ins-text:#0B4F63}
.ph-card-form .cd{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--sx-fg);white-space:pre;font-variant-ligatures:none}
.ph-card-form .cd .k{fill:var(--sx-kw)} .ph-card-form .cd .s{fill:var(--sx-str)} .ph-card-form .cd .n{fill:var(--sx-num)}
.ph-card-form .cd .f{fill:var(--sx-fn)} .ph-card-form .cd .t{fill:var(--sx-type)} .ph-card-form .cd .c{fill:var(--sx-com)} .ph-card-form .cd .u{fill:var(--sx-com)}
.ph-card-form .pane{fill:var(--sx-pane);stroke:var(--sx-pane-line);stroke-width:1}
.ph-card-form .delbg{fill:var(--sx-del-bg)} .ph-card-form .delbar{fill:var(--sx-del-bar)} .ph-card-form .insbg{fill:var(--sx-ins-bg)} .ph-card-form .insbar{fill:var(--sx-ins-bar)}
.ph-card-form .sgn-d{fill:var(--sx-del-bar)} .ph-card-form .sgn-i{fill:var(--sx-ins-bar)}.ph-card-form .warnT{fill:var(--px-warn)}
</style>
<defs><linearGradient id="ph-card-form-eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="ph-card-form-egu" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="560" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="ph-card-form-egv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="ph-card-form-egd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient></defs>

<rect class="bx" x="16" y="16" width="528" height="188" rx="14"/>
<text class="txt" x="40" y="48" style="font-size:14px;font-weight:600">Email</text>
<rect x="40" y="58" width="300" height="38" rx="8" style="fill:var(--px-raised);stroke:var(--px-err);stroke-width:1.5"/><text class="m txt" x="54" y="82" style="font-size:14px">ada@example.com</text>
<text class="errT" x="40" y="116" style="font-size:13px">Already registered</text>
<text class="txt" x="40" y="148" style="font-size:14px;font-weight:600">Password</text>
<rect x="40" y="158" width="300" height="34" rx="8" style="fill:var(--px-raised);stroke:var(--px-bar);stroke-width:1.5"/>
<text class="m hint" x="372" y="82">async validator</text><text class="m hint" x="372" y="102">validateOn: change</text><text class="m hint" x="372" y="122">debounceMs: 300</text>
<line x1="340" y1="77" x2="362" y2="77" style="stroke:url(#ph-card-form-eg);stroke-width:2"/>
</svg>
