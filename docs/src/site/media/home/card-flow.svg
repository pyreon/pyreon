<svg xmlns="http://www.w3.org/2000/svg" class="pxa ph-card-flow" viewBox="0 0 560 220" width="560" height="220" role="img" aria-labelledby="ph-card-flow-t ph-card-flow-d" fill="none">
<title id="ph-card-flow-t">Flow</title>
<desc id="ph-card-flow-d">A node graph: Webhook connects to Enrich and Archive, and Enrich connects to CRM. The edge from Webhook to Enrich is highlighted.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}
.ph-card-flow{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.ph-card-flow .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.ph-card-flow .ph-card-flow-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.ph-card-flow *{animation:none!important;transition:none!important}.ph-card-flow .ph-card-flow-rm{opacity:1}.ph-card-flow .ph-card-flow-am{opacity:0}}

.ph-card-flow .ln{stroke:var(--px-hint);stroke-width:1.5}
.ph-card-flow .dash{stroke:var(--px-hint);stroke-width:1.5;stroke-dasharray:4 6}
.ph-card-flow .bx{fill:var(--px-card);stroke:var(--px-bar);stroke-width:1.5}
.ph-card-flow .bx2{fill:var(--px-raised);stroke:var(--px-bar);stroke-width:1.5}
.ph-card-flow .act{fill:none;stroke:var(--px-text);stroke-width:2}
.ph-card-flow .lab{fill:var(--px-fog);font-size:14px;letter-spacing:.02em}
.ph-card-flow .eb{fill:var(--px-fog);font-size:13px;letter-spacing:.16em}
.ph-card-flow .val{fill:var(--px-text);font-size:20px;font-weight:500}
.ph-card-flow .big{fill:var(--px-strong);font-size:30px;font-weight:600;letter-spacing:-.02em}
.ph-card-flow .txt{fill:var(--px-text);font-size:16px}
.ph-card-flow .mt{fill:var(--px-mist);font-size:14px}
.ph-card-flow .hint{fill:var(--px-fog);font-size:13px}
.ph-card-flow .ember{stroke:url(#ph-card-flow-eg);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:36 2000;fill:none}
.ph-card-flow .emS{stroke:url(#ph-card-flow-eg);stroke-width:2.5;fill:none}
.ph-card-flow .ring{fill:none;stroke:var(--px-accent);stroke-width:2}
.ph-card-flow .ok{fill:var(--px-ok)} .ph-card-flow .warm{fill:var(--px-warm)} .ph-card-flow .hot{fill:var(--px-accent)} .ph-card-flow .err{fill:var(--px-err)}
.ph-card-flow .okT{fill:var(--px-ok)} .ph-card-flow .warmT{fill:var(--px-warm)} .ph-card-flow .hotT{fill:var(--px-accent-text)} .ph-card-flow .errT{fill:var(--px-err)} .ph-card-flow .linkT{fill:var(--px-link)}
.ph-card-flow .focus{fill:none;stroke:var(--px-link);stroke-width:2;stroke-dasharray:3 3}
.pxa{--sx-kw:#FF5E1A;--sx-str:#FFC83D;--sx-num:#FF1F8C;--sx-fn:#22D3EE;--sx-type:#A78BFA;--sx-com:#8A8696;--sx-fg:#E6E0D2;--sx-pane:#111118;--sx-pane-line:#2E2E3B;--sx-del-bar:#FF1F8C;--sx-del-bg:rgba(255,31,140,.12);--sx-del-text:#F7B9D6;--sx-ins-bar:#22D3EE;--sx-ins-bg:rgba(34,211,238,.09);--sx-ins-text:#E9FBFF}
