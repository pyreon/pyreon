[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--sx-kw:#FF5E1A;--sx-str:#FFC83D;--sx-num:#FF1F8C;--sx-fn:#22D3EE;--sx-type:#A78BFA;--sx-com:#8A8696;--sx-fg:#E6E0D2;--sx-pane:#111118;--sx-pane-line:#2E2E3B;--sx-del-bar:#FF1F8C;--sx-del-bg:rgba(255,31,140,.12);--sx-del-text:#F7B9D6;--sx-ins-bar:#22D3EE;--sx-ins-bg:rgba(34,211,238,.09);--sx-ins-text:#E9FBFF}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--sx-kw:#C2410C;--sx-str:#8A5A00;--sx-num:#BE185D;--sx-fn:#0E7490;--sx-type:#6D28D9;--sx-com:#6B6776;--sx-fg:#14141C;--sx-pane:#F4EFE6;--sx-pane-line:#E6DFD2;--sx-del-bar:#D1106F;--sx-del-bg:rgba(209,16,111,.07);--sx-del-text:#8E0B4C;--sx-ins-bar:#0A6E89;--sx-ins-bg:rgba(10,110,137,.08);--sx-ins-text:#0B4F63}
.ph-card-flow .cd{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--sx-fg);white-space:pre;font-variant-ligatures:none}
.ph-card-flow .cd .k{fill:var(--sx-kw)} .ph-card-flow .cd .s{fill:var(--sx-str)} .ph-card-flow .cd .n{fill:var(--sx-num)}
.ph-card-flow .cd .f{fill:var(--sx-fn)} .ph-card-flow .cd .t{fill:var(--sx-type)} .ph-card-flow .cd .c{fill:var(--sx-com)} .ph-card-flow .cd .u{fill:var(--sx-com)}
.ph-card-flow .pane{fill:var(--sx-pane);stroke:var(--sx-pane-line);stroke-width:1}
.ph-card-flow .delbg{fill:var(--sx-del-bg)} .ph-card-flow .delbar{fill:var(--sx-del-bar)} .ph-card-flow .insbg{fill:var(--sx-ins-bg)} .ph-card-flow .insbar{fill:var(--sx-ins-bar)}
.ph-card-flow .sgn-d{fill:var(--sx-del-bar)} .ph-card-flow .sgn-i{fill:var(--sx-ins-bar)}.ph-card-flow .warnT{fill:var(--px-warn)}
</style>
