<svg xmlns="http://www.w3.org/2000/svg" class="pxa pil-404" viewBox="0 0 560 360" width="560" height="360" role="img" aria-labelledby="pil-404-t pil-404-d" fill="none">
<title id="pil-404-t">404: signal not found</title>
<desc id="pil-404-d">A graph path from a source node breaks in the middle; where the target should be there is an ember dashed ring with a question mark.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}
.pil-404{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pil-404 .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pil-404 .pil-404-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.pil-404 *{animation:none!important;transition:none!important}.pil-404 .pil-404-rm{opacity:1}.pil-404 .pil-404-am{opacity:0}}

.pil-404 .s1{stroke:var(--px-mist);stroke-width:1.5}.pil-404 .s2{stroke:var(--px-fog);stroke-width:1.5}.pil-404 .s3{stroke:var(--px-hint);stroke-width:1.5}
.pil-404 .e{stroke:var(--px-accent);stroke-width:1.5}.pil-404 .ef{fill:var(--px-accent)}.pil-404 .et{fill:var(--px-accent-text)}
.pil-404 .f1{fill:var(--px-mist)}.pil-404 .fc{fill:var(--px-card)}.pil-404 .fb{fill:var(--px-bg)}
.pil-404 .l2{fill:var(--px-fog);font-size:9px}.pil-404 .l3{fill:var(--px-hint);font-size:9px}.pil-404 .lt{fill:var(--px-text);font-size:10px}
.pil-404 .ttl{fill:var(--px-fog);font-size:15px;letter-spacing:.14em}
.pil-404 .rule{stroke:var(--px-line2);stroke-width:1}@keyframes pil-404-ring{0%{stroke-width:1.5;opacity:.55}40%{stroke-width:3;opacity:1}100%{stroke-width:1.5;opacity:1}}
@keyframes pil-404-glow{0%{opacity:0}40%{opacity:.22}100%{opacity:0}}
.pil-404 .ring{animation:pil-404-ring 200ms cubic-bezier(.2,.7,.3,1) 320ms both}.pil-404 .glow{animation:pil-404-glow 200ms cubic-bezier(.2,.7,.3,1) 320ms both;opacity:0}
</style>
<defs><linearGradient id="pil-404-eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pil-404-egu" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="560" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pil-404-egv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pil-404-egd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient></defs>
<g transform="scale(2)">
<circle class="f1" cx="40" cy="80" r="5"/>
<line class="s1" x1="46" y1="80" x2="110" y2="80"/>
<line class="e" x1="110" y1="80" x2="127" y2="80" stroke-dasharray="2 4"/><line class="e" x1="153" y1="80" x2="170" y2="80" stroke-dasharray="2 4"/>
<circle class="ef glow" cx="140" cy="80" r="17"/>
<circle class="e ring" cx="140" cy="80" r="13" fill="none" stroke-dasharray="3 4"/>
<text class="m et" x="140" y="85" text-anchor="middle" font-size="14" font-weight="600">?</text>
<line class="s3" x1="170" y1="80" x2="240" y2="80" stroke-dasharray="3 6"/>
<circle class="s3" cx="246" cy="80" r="5" fill="none"/>
<text class="m l2" x="40" y="105" text-anchor="middle">source</text>
<text class="m et" x="140" y="44" text-anchor="middle" font-size="9">missing</text>
<text class="m l3" x="246" y="105" text-anchor="middle">you</text></g>
<line class="rule" x1="40" y1="322" x2="520" y2="322"/>
<text class="m ttl" x="40" y="347">404 · SIGNAL NOT FOUND</text>
</svg>
