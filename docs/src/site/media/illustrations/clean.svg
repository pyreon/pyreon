<svg xmlns="http://www.w3.org/2000/svg" class="pxa pil-clean" viewBox="0 0 560 360" width="560" height="360" role="img" aria-labelledby="pil-clean-t pil-clean-d" fill="none">
<title id="pil-clean-t">All clean: 100 / 100</title>
<desc id="pil-clean-d">A healthy graph of seven connected nodes ending in a green check, with a full score bar underneath.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#6E6A7A;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#E40C70;--px-g2:#E84A0F;--px-g3:#E0A510;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#6E6A7A;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#E40C70;--px-g2:#E84A0F;--px-g3:#E0A510;--px-glow:rgba(232,74,15,.10)}
.pil-clean{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pil-clean .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pil-clean .pil-clean-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.pil-clean *{animation:none!important;transition:none!important}.pil-clean .pil-clean-rm{opacity:1}.pil-clean .pil-clean-am{opacity:0}}

.pil-clean .s1{stroke:var(--px-mist);stroke-width:1.5}.pil-clean .s2{stroke:var(--px-fog);stroke-width:1.5}.pil-clean .s3{stroke:var(--px-hint);stroke-width:1.5}
.pil-clean .e{stroke:var(--px-accent);stroke-width:1.5}.pil-clean .ef{fill:var(--px-accent)}.pil-clean .et{fill:var(--px-accent-text)}
.pil-clean .f1{fill:var(--px-mist)}.pil-clean .fc{fill:var(--px-card)}.pil-clean .fb{fill:var(--px-bg)}
.pil-clean .l2{fill:var(--px-fog);font-size:9px}.pil-clean .l3{fill:var(--px-hint);font-size:9px}.pil-clean .lt{fill:var(--px-text);font-size:10px}
.pil-clean .ttl{fill:var(--px-fog);font-size:15px;letter-spacing:.14em}
.pil-clean .rule{stroke:var(--px-line2);stroke-width:1}
</style>
<defs><linearGradient id="pil-clean-eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pil-clean-egv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pil-clean-egd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient></defs>
<g transform="scale(2)">
<line class="s1" x1="40" y1="40" x2="110" y2="60"/><line class="s1" x1="40" y1="80" x2="110" y2="60"/><line class="s1" x1="40" y1="120" x2="110" y2="100"/><line class="s1" x1="110" y1="60" x2="190" y2="80"/><line class="s1" x1="110" y1="100" x2="190" y2="80"/><line class="s1" x1="190" y1="80" x2="236" y2="80"/>
<circle class="s1 fc" cx="40" cy="40" r="5"/><circle class="s1 fc" cx="40" cy="80" r="5"/><circle class="s1 fc" cx="40" cy="120" r="5"/><circle class="s1 fc" cx="110" cy="60" r="5"/><circle class="s1 fc" cx="110" cy="100" r="5"/><circle class="s1 fc" cx="190" cy="80" r="5"/>
<g transform="translate(248 80)"><circle r="13" style="fill:none;stroke:var(--px-ok);stroke-width:1.5"/><path d="M -6 0 L -2 5 L 6 -5" style="stroke:var(--px-ok)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<line x1="40" y1="148" x2="248" y2="148" style="stroke:var(--px-line2)" stroke-width="1.5"/>
<line x1="40" y1="148" x2="248" y2="148" class="e" stroke-width="2"/>
<text class="m l2" x="40" y="140">score</text><text class="m l2" x="248" y="140" text-anchor="end">100</text></g>
<line class="rule" x1="40" y1="322" x2="520" y2="322"/>
<text class="m ttl" x="40" y="347">ALL CLEAN · 100 / 100</text>
</svg>
