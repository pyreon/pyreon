<svg xmlns="http://www.w3.org/2000/svg" class="pxa pil-blocked" viewBox="0 0 560 360" width="560" height="360" role="img" aria-labelledby="pil-blocked-t pil-blocked-d" fill="none">
<title id="pil-blocked-t">Blocked: missing permission</title>
<desc id="pil-blocked-d">A graph path runs from a public node into an ember wall labelled permission; the private node beyond it stays cold.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#6E6A7A;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#E40C70;--px-g2:#E84A0F;--px-g3:#E0A510;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#6E6A7A;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#E40C70;--px-g2:#E84A0F;--px-g3:#E0A510;--px-glow:rgba(232,74,15,.10)}
.pil-blocked{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pil-blocked .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pil-blocked .pil-blocked-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.pil-blocked *{animation:none!important;transition:none!important}.pil-blocked .pil-blocked-rm{opacity:1}.pil-blocked .pil-blocked-am{opacity:0}}

.pil-blocked .s1{stroke:var(--px-mist);stroke-width:1.5}.pil-blocked .s2{stroke:var(--px-fog);stroke-width:1.5}.pil-blocked .s3{stroke:var(--px-hint);stroke-width:1.5}
.pil-blocked .e{stroke:var(--px-accent);stroke-width:1.5}.pil-blocked .ef{fill:var(--px-accent)}.pil-blocked .et{fill:var(--px-accent-text)}
.pil-blocked .f1{fill:var(--px-mist)}.pil-blocked .fc{fill:var(--px-card)}.pil-blocked .fb{fill:var(--px-bg)}
.pil-blocked .l2{fill:var(--px-fog);font-size:9px}.pil-blocked .l3{fill:var(--px-hint);font-size:9px}.pil-blocked .lt{fill:var(--px-text);font-size:10px}
.pil-blocked .ttl{fill:var(--px-fog);font-size:15px;letter-spacing:.14em}
.pil-blocked .rule{stroke:var(--px-line2);stroke-width:1}
</style>
<defs><linearGradient id="pil-blocked-eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pil-blocked-egv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pil-blocked-egd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient></defs>
<g transform="scale(2)">
<circle class="f1" cx="40" cy="80" r="5"/><line class="s1" x1="46" y1="80" x2="110" y2="80"/>
<circle class="f1" cx="116" cy="80" r="5"/><line class="s1" x1="122" y1="80" x2="146" y2="80"/>
<line class="e" x1="150" y1="30" x2="150" y2="130" stroke-width="2"/>
<line class="e" x1="146" y1="35" x2="154" y2="30"/><line class="e" x1="146" y1="45" x2="154" y2="40"/><line class="e" x1="146" y1="55" x2="154" y2="50"/><line class="e" x1="146" y1="115" x2="154" y2="110"/><line class="e" x1="146" y1="125" x2="154" y2="120"/>
<line class="s3" x1="154" y1="80" x2="240" y2="80" stroke-dasharray="2 4"/>
<circle class="s3" cx="246" cy="80" r="5" fill="none"/>
<text class="m et" x="150" y="20" text-anchor="middle" font-size="9" letter-spacing=".1em">PERMISSION</text>
<text class="m l2" x="40" y="105" text-anchor="middle">public</text>
<text class="m l3" x="246" y="105" text-anchor="middle">private</text></g>
<line class="rule" x1="40" y1="322" x2="520" y2="322"/>
<text class="m ttl" x="40" y="347">BLOCKED · MISSING PERMISSION</text>
</svg>
