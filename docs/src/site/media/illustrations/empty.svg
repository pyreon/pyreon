<svg xmlns="http://www.w3.org/2000/svg" class="pxa pil-empty" viewBox="0 0 560 360" width="560" height="360" role="img" aria-labelledby="pil-empty-t pil-empty-d" fill="none">
<title id="pil-empty-t">Empty: no matches</title>
<desc id="pil-empty-d">A dotted baseline with a single unconnected node in the middle: nothing reads this yet.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}
.pil-empty{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pil-empty .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pil-empty .pil-empty-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.pil-empty *{animation:none!important;transition:none!important}.pil-empty .pil-empty-rm{opacity:1}.pil-empty .pil-empty-am{opacity:0}}

.pil-empty .s1{stroke:var(--px-mist);stroke-width:1.5}.pil-empty .s2{stroke:var(--px-fog);stroke-width:1.5}.pil-empty .s3{stroke:var(--px-hint);stroke-width:1.5}
.pil-empty .e{stroke:var(--px-accent);stroke-width:1.5}.pil-empty .ef{fill:var(--px-accent)}.pil-empty .et{fill:var(--px-accent-text)}
.pil-empty .f1{fill:var(--px-mist)}.pil-empty .fc{fill:var(--px-card)}.pil-empty .fb{fill:var(--px-bg)}
.pil-empty .l2{fill:var(--px-fog);font-size:9px}.pil-empty .l3{fill:var(--px-hint);font-size:9px}.pil-empty .lt{fill:var(--px-text);font-size:10px}
.pil-empty .ttl{fill:var(--px-fog);font-size:15px;letter-spacing:.14em}
.pil-empty .rule{stroke:var(--px-line2);stroke-width:1}
</style>
<defs><linearGradient id="pil-empty-eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pil-empty-egu" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="560" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pil-empty-egv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pil-empty-egd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient></defs>
<g transform="scale(2)">
<line class="s3" x1="20" y1="80" x2="260" y2="80" stroke-dasharray="3 6"/>
<circle class="s2" cx="140" cy="80" r="7" fill="none" stroke-dasharray="2 3"/>
<circle class="ef" cx="140" cy="80" r="2"/>
<text class="m l2" x="140" y="56" text-anchor="middle">no readers yet</text>
<text class="m l3" x="20" y="100">query</text>
<text class="m l3" x="260" y="100" text-anchor="end">results</text></g>
<line class="rule" x1="40" y1="322" x2="520" y2="322"/>
<text class="m ttl" x="40" y="347">EMPTY · NO MATCHES</text>
</svg>
