<svg xmlns="http://www.w3.org/2000/svg" class="pxa bc-cmp-react" viewBox="0 0 960 668" width="960" height="668" role="img" aria-labelledby="bc-cmp-react-t bc-cmp-react-d" fill="none">
<title id="bc-cmp-react-t">Pyreon vs React: measured</title>
<desc id="bc-cmp-react-d">Pyreon vs React, the measured rows from the page's table: Bundle, same keyed-table app (gzip): Pyreon 17.2 KB, React 69.6 KB (Pyreon ahead); Create 10,000 rows: Pyreon 72.6 ms, React 192.0 ms (2.6× slower) (Pyreon ahead); Swap two rows in 1,000: Pyreon 805 µs, React 6.06 ms (Pyreon ahead); Remove a row: Pyreon 5.70 ms, React 5.78 ms; confidence intervals overlap in both runs (tie); Mount a deep tree (2,047 components): Pyreon 3.59 / 3.58 ms, React 3.71 / 3.66 ms; a tie in both runs (tie); TodoMVC shape: toggle 1,000 / clear 1,000: Pyreon 4.60 ms / 320 µs, React 11.41 ms / 1.00 ms (2.48× / 3.14×; add-100 varies 1.14–1.99× day to day) (Pyreon ahead); Server rendering, 10 / 100 / 1,000 rows: Pyreon 1.80 / 11.64 / 109.9 µs, React 10.30 / 76.52 / 714.4 µs (5.7–6.6× slower) (Pyreon ahead); Hydration: 1,000-row table / 320-component page: Pyreon 6.07 ms / 4.02 ms, React 6.52 ms / 4.15 ms; both adopt every server node (Pyreon ahead); Retained heap after the row suite: Pyreon 3.08 MB, React 3.50 MB (one value per run, same in both runs) (Pyreon ahead).</desc>
<style>
