<svg xmlns="http://www.w3.org/2000/svg" class="pxa bc-cmp-svelte" viewBox="0 0 960 610" width="960" height="610" role="img" aria-labelledby="bc-cmp-svelte-t bc-cmp-svelte-d" fill="none">
<title id="bc-cmp-svelte-t">Pyreon vs Svelte: measured</title>
<desc id="bc-cmp-svelte-d">Pyreon vs Svelte, the measured rows from the page's table: Mount a deep tree (2,047 components): Pyreon 3.59 ms, Svelte 10.80 ms (Pyreon ahead); Compiled SSR, 10 / 100 / 1,000 rows: Pyreon 1.80 / 11.64 / 109.9 µs, Svelte 2.18 / 18.08 / 160.5 µs (one run) (Pyreon ahead); Create 10,000 rows: Pyreon 72.64 ms, Svelte 87.51 ms (Pyreon ahead); Swap two rows in 1,000: Pyreon 805 µs, Svelte 1.50 ms (Pyreon ahead); Memo wall: passthrough: Pyreon 450 / 451 µs, Svelte 487 / 487 µs (Svelte was the fastest rival); Pyreon 1.08× in both runs (Pyreon ahead); 12-field form, keystroke (blur mode): Pyreon 60 µs, Svelte 700 µs (Felte, one run) (Pyreon ahead); dbmon tick (every value changes): Pyreon 1.71 / 1.70 ms, Svelte 1.75 / 1.71 ms: a three-way tie with Octane (tie); Bundle, same keyed-table app (gzip): Pyreon 17.2 KB, Svelte 16.1 KB: Svelte is 1.1 KB smaller (Svelte ahead).</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
