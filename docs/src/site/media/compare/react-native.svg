<svg xmlns="http://www.w3.org/2000/svg" class="pxa pw-compare-react-native" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="pw-compare-react-native-t pw-compare-react-native-d" fill="none">
<title id="pw-compare-react-native-t">What runs on the phone: React Native and Pyreon</title>
<desc id="pw-compare-react-native-d">Two stacks. React Native: your JavaScript bundle runs on the phone in the Hermes JavaScript engine, and React Native's renderer drives the platform widgets. Pyreon: your .tsx is compiled on your machine by PMTC into SwiftUI and Jetpack Compose source, Xcode and Gradle build a native binary, and the phone runs SwiftUI and Compose views with no JavaScript engine under the UI. The Pyreon native targets are labelled experimental.</desc>
