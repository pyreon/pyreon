<svg xmlns="http://www.w3.org/2000/svg" class="pxa bc-cmp-vue" viewBox="0 0 960 552" width="960" height="552" role="img" aria-labelledby="bc-cmp-vue-t bc-cmp-vue-d" fill="none">
<title id="bc-cmp-vue-t">Pyreon vs Vue: measured</title>
<desc id="bc-cmp-vue-d">Pyreon vs Vue, the measured rows from the page's table: Bundle, same keyed-table app (gzip): Pyreon 17.2 KB, Vue 27.4 KB (Pyreon ahead); Compiled SSR, 10 / 100 / 1,000 rows: Pyreon 1.80 / 11.64 / 109.9 µs, Vue 3.03 / 15.66 / 124.9 µs (one run) (Pyreon ahead); Memo wall: blocked update: Pyreon 11 / 11 µs, Vue 16 / 16 µs (Vue was the fastest rival) (Pyreon ahead); Hydration, 320-component page: Pyreon 4.02 ms, Vue 4.47 ms; both adopt all 2,206 server nodes (one run) (Pyreon ahead); Row board vs Vue 3: partial update / clear rows: Pyreon 705 µs / 130 µs, Vue 1.04 ms / 255 µs (Pyreon ahead); 12-field form, keystroke with validation: Pyreon 460 µs, Vue 2,260 µs (vee-validate, one run) (Pyreon ahead); Hydration, 1,000-row keyed table: Pyreon 6.07 / 6.04 ms total; framework walk tied, Vue 6.02 / 5.99 ms: Vue has the faster median in both runs, 1.01× in run 2 (Vue ahead).</desc>
