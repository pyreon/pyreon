<svg xmlns="http://www.w3.org/2000/svg" class="pxa bc-cmp-solid" viewBox="0 0 960 610" width="960" height="610" role="img" aria-labelledby="bc-cmp-solid-t bc-cmp-solid-d" fill="none">
<title id="bc-cmp-solid-t">Pyreon vs Solid: measured</title>
<desc id="bc-cmp-solid-d">Pyreon vs Solid, the measured rows from the page's table: Clear 1,000 rows: Pyreon 130 µs, Solid 460 µs (Pyreon ahead); Create 10,000 rows: Pyreon 72.64 ms, Solid 78.75 ms (Pyreon ahead); 12-field form, four timed operations: Pyreon Fastest on all four (keystroke 60 µs), Solid Solid modular-forms: keystroke 100 µs (one run) (Pyreon ahead); Effect list: update 500: Pyreon 835 / 797 µs, Solid 870 / 880 µs; a tie in run 1, Pyreon 1.10× in run 2, so not claimed (tie); Mount a deep tree (2,047 components): Pyreon 3.59 / 3.58 ms, Solid 3.06 / 3.10 ms: Solid 1.15–1.18× faster in both runs (Solid ahead); Bundle, same keyed-table app (gzip): Pyreon 17.2 KB, Solid 7.5 KB: the smallest framework in the record (Solid ahead); Effect list: dispose 500: Pyreon 50 / 45 µs, Solid 45 / 40 µs: Solid 1.11–1.13× faster (one 5 µs clock quantum) (Solid ahead); Form memory: Pyreon 2.42 MB retained, Solid 2.33 MB retained (Solid modular-forms is lighter) (Solid ahead).</desc>
<style>
