.bc-cmp-solid .chip-win rect{fill:#FF5E1A;stroke:none} .bc-cmp-solid .chip-win text{fill:#0A0A0E}
.bc-cmp-solid .chip-tie rect{stroke:var(--px-link)} .bc-cmp-solid .chip-tie text{fill:var(--px-link)}
