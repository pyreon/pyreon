<svg xmlns="http://www.w3.org/2000/svg" class="pxa pq-migrate" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="pq-migrate-t pq-migrate-d" fill="none">
<title id="pq-migrate-t">A React component before, the Pyreon component after</title>
<desc id="pq-migrate-d">Top: a React Counter that runs unchanged on @pyreon/react-compat: useState, a derived const, setCount in the click handler. Bottom: the same component converted to Pyreon: signal(0), computed(() =&gt; count() * 2), count.update in the handler, props.step instead of a destructured prop, and {count()} in the markup. Each changed line pair lights up in turn.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}
.pq-migrate{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pq-migrate .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pq-migrate .pq-migrate-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.pq-migrate *{animation:none!important;transition:none!important}.pq-migrate .pq-migrate-rm{opacity:1}.pq-migrate .pq-migrate-am{opacity:0}}

.pq-migrate .ln{stroke:var(--px-hint);stroke-width:1.5;fill:none}
.pq-migrate .dash{stroke:var(--px-hint);stroke-width:1.5;stroke-dasharray:3 5;fill:none}
.pq-migrate .bx{fill:var(--px-card);stroke:var(--px-bar);stroke-width:1.5}
.pq-migrate .bx2{fill:var(--px-raised);stroke:var(--px-bar);stroke-width:1.5}
.pq-migrate .lab{fill:var(--px-fog);font-size:14px;letter-spacing:.04em}
.pq-migrate .eb{fill:var(--px-fog);font-size:13px;letter-spacing:.16em}
.pq-migrate .val{fill:var(--px-text);font-size:20px;font-weight:500}
.pq-migrate .big{fill:var(--px-strong);font-size:24px;font-weight:600;letter-spacing:-.02em}
.pq-migrate .code{fill:var(--px-text);font-size:15px}
.pq-migrate .kw{fill:var(--px-accent-text)} .pq-migrate .fn{fill:var(--px-link)} .pq-migrate .str{fill:var(--px-warm)} .pq-migrate .ty{fill:var(--px-violet)}
.pq-migrate .dim{fill:var(--px-fog)}
.pq-migrate .hint{fill:var(--px-hint);font-size:13px}
.pq-migrate .ember{stroke:url(#pq-migrate-egu);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:36 900;fill:none}
.pq-migrate .emberS{stroke:url(#pq-migrate-egu);stroke-width:2.5;stroke-linecap:round;fill:none}
.pq-migrate .ring{fill:none;stroke:var(--px-accent);stroke-width:2}
.pq-migrate .ok{fill:var(--px-ok)} .pq-migrate .warm{fill:var(--px-warm)} .pq-migrate .hot{fill:var(--px-accent)} .pq-migrate .errF{fill:var(--px-err)}
.pq-migrate .okT{fill:var(--px-ok)} .pq-migrate .warmT{fill:var(--px-warm)} .pq-migrate .hotT{fill:var(--px-accent-text)} .pq-migrate .errT{fill:var(--px-err)}
.pq-migrate .okS{stroke:var(--px-ok)} .pq-migrate .errS{stroke:var(--px-err)}
.pq-migrate .gfill{fill:url(#pq-migrate-eg)}
@media (prefers-reduced-motion: reduce){.pq-migrate .ember{opacity:0}}

.pq-migrate .bt{fill:var(--px-mist)}
.pq-migrate text{white-space:pre}
@keyframes pq-migrate-k0{0.0000%{opacity:0;animation-timing-function:step-end}9.3333%{opacity:1;animation-timing-function:step-end}24.0000%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-migrate-k1{0.0000%{opacity:0;animation-timing-function:step-end}25.3333%{opacity:1;animation-timing-function:step-end}40.0000%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-migrate-k2{0.0000%{opacity:0;animation-timing-function:step-end}41.3333%{opacity:1;animation-timing-function:step-end}56.0000%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-migrate-k3{0.0000%{opacity:0;animation-timing-function:step-end}57.3333%{opacity:1;animation-timing-function:step-end}72.0000%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-migrate-k4{0.0000%{opacity:0;animation-timing-function:step-end}73.3333%{opacity:1;animation-timing-function:step-end}88.0000%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
.pq-migrate .k0{animation:pq-migrate-k0 7500ms linear infinite}
.pq-migrate .k1{animation:pq-migrate-k1 7500ms linear infinite}
.pq-migrate .k2{animation:pq-migrate-k2 7500ms linear infinite}
.pq-migrate .k3{animation:pq-migrate-k3 7500ms linear infinite}
.pq-migrate .k4{animation:pq-migrate-k4 7500ms linear infinite}
</style>
<defs><linearGradient id="pq-migrate-eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pq-migrate-egu" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pq-migrate-egv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pq-migrate-egd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient></defs>

<text class="m eb" x="24" y="34">@PYREON/REACT-COMPAT · THEN ONE COMPONENT AT A TIME</text>
<rect class="bx2" x="24" y="52" width="592" height="146" rx="12"/>
<text class="m hint" x="40" y="74">React · runs as-is on react-compat</text><rect x="30" y="84" width="3" height="18" rx="1.5" style="fill:var(--px-line2)"/><rect class="hl k0" x="30" y="84" width="3" height="18" rx="1.5" style="fill:var(--px-fog)" opacity="0"/><text class="m code bt" x="44" y="98" font-size="13" xml:space="preserve">export <tspan class="kw">function</tspan> <tspan class="fn">Counter</tspan>({ step }: { step: <tspan class="ty">number</tspan> }) {</text><rect x="30" y="106" width="3" height="18" rx="1.5" style="fill:var(--px-line2)"/><rect class="hl k1" x="30" y="106" width="3" height="18" rx="1.5" style="fill:var(--px-fog)" opacity="0"/><text class="m code bt" x="44" y="120" font-size="13" xml:space="preserve">  <tspan class="kw">const</tspan> [count, setCount] = <tspan class="fn">useState</tspan>(<tspan class="str">0</tspan>)</text><rect x="30" y="128" width="3" height="18" rx="1.5" style="fill:var(--px-line2)"/><rect class="hl k2" x="30" y="128" width="3" height="18" rx="1.5" style="fill:var(--px-fog)" opacity="0"/><text class="m code bt" x="44" y="142" font-size="13" xml:space="preserve">  <tspan class="kw">const</tspan> doubled = count * <tspan class="str">2</tspan></text><rect x="30" y="150" width="3" height="18" rx="1.5" style="fill:var(--px-line2)"/><rect class="hl k3" x="30" y="150" width="3" height="18" rx="1.5" style="fill:var(--px-fog)" opacity="0"/><text class="m code bt" x="44" y="164" font-size="13" xml:space="preserve">  &lt;button onClick={() =&gt; <tspan class="fn">setCount</tspan>(count + step)}&gt;</text><rect x="30" y="172" width="3" height="18" rx="1.5" style="fill:var(--px-line2)"/><rect class="hl k4" x="30" y="172" width="3" height="18" rx="1.5" style="fill:var(--px-fog)" opacity="0"/><text class="m code bt" x="44" y="186" font-size="13" xml:space="preserve">    {count} / {doubled}</text>
<path class="ln" d="M320 200 L320 222"/><path d="M314 216 L320 224 L326 216" class="ln"/>
<rect class="bx" x="24" y="226" width="592" height="146" rx="12"/>
<text class="m hint" x="40" y="248">Pyreon · after conversion</text><rect x="30" y="258" width="3" height="18" rx="1.5" style="fill:var(--px-bar)"/><rect class="hl k0" x="30" y="258" width="3" height="18" rx="1.5" style="fill:var(--px-accent)" opacity="0"/><rect class="pq-migrate-rm" x="30" y="258" width="3" height="18" rx="1.5" style="fill:var(--px-accent)"/><text class="m code" x="44" y="272" font-size="13" xml:space="preserve">export <tspan class="kw">function</tspan> <tspan class="fn">Counter</tspan>(props: { step: <tspan class="ty">number</tspan> }) {</text><rect x="30" y="280" width="3" height="18" rx="1.5" style="fill:var(--px-bar)"/><rect class="hl k1" x="30" y="280" width="3" height="18" rx="1.5" style="fill:var(--px-accent)" opacity="0"/><rect class="pq-migrate-rm" x="30" y="280" width="3" height="18" rx="1.5" style="fill:var(--px-accent)"/><text class="m code" x="44" y="294" font-size="13" xml:space="preserve">  <tspan class="kw">const</tspan> count = <tspan class="fn">signal</tspan>(<tspan class="str">0</tspan>)</text><rect x="30" y="302" width="3" height="18" rx="1.5" style="fill:var(--px-bar)"/><rect class="hl k2" x="30" y="302" width="3" height="18" rx="1.5" style="fill:var(--px-accent)" opacity="0"/><rect class="pq-migrate-rm" x="30" y="302" width="3" height="18" rx="1.5" style="fill:var(--px-accent)"/><text class="m code" x="44" y="316" font-size="13" xml:space="preserve">  <tspan class="kw">const</tspan> doubled = <tspan class="fn">computed</tspan>(() =&gt; count() * <tspan class="str">2</tspan>)</text><rect x="30" y="324" width="3" height="18" rx="1.5" style="fill:var(--px-bar)"/><rect class="hl k3" x="30" y="324" width="3" height="18" rx="1.5" style="fill:var(--px-accent)" opacity="0"/><rect class="pq-migrate-rm" x="30" y="324" width="3" height="18" rx="1.5" style="fill:var(--px-accent)"/><text class="m code" x="44" y="338" font-size="13" xml:space="preserve">  &lt;button onClick={() =&gt; count.<tspan class="fn">update</tspan>((c) =&gt; c + props.step)}&gt;</text><rect x="30" y="346" width="3" height="18" rx="1.5" style="fill:var(--px-bar)"/><rect class="hl k4" x="30" y="346" width="3" height="18" rx="1.5" style="fill:var(--px-accent)" opacity="0"/><rect class="pq-migrate-rm" x="30" y="346" width="3" height="18" rx="1.5" style="fill:var(--px-accent)"/><text class="m code" x="44" y="360" font-size="13" xml:space="preserve">    {count()} / {doubled()}</text>
<text class="m hint" x="24" y="392">abridged · when the last component moves, switch compat off</text>
</svg>
