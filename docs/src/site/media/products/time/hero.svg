<svg xmlns="http://www.w3.org/2000/svg" class="pxa pq-time" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="pq-time-t pq-time-d" fill="none">
<title id="pq-time-t">Dates are strings, and the operations are plain functions</title>
<desc id="pq-time-d">Schematic: three calls cycle. add('2026-01-31', { months: 1 }) returns '2026-02-28', because the day clamps to the end of February. diff('2026-11-18', '2026-12-24', 'day') returns 36. toPlainDateTime at an instant for 09:00 in New York, read in Asia/Tokyo, returns '2026-11-18T23:00'. A panel lists the four value shapes: PlainDate, PlainTime, PlainDateTime and Instant, all strings or numbers.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}
.pq-time{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pq-time .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pq-time .pq-time-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.pq-time *{animation:none!important;transition:none!important}.pq-time .pq-time-rm{opacity:1}.pq-time .pq-time-am{opacity:0}}

.pq-time .ln{stroke:var(--px-hint);stroke-width:1.5}
.pq-time .dash{stroke:var(--px-hint);stroke-width:1.5;stroke-dasharray:4 6}
.pq-time .bx{fill:var(--px-card);stroke:var(--px-bar);stroke-width:1.5}
.pq-time .bx2{fill:var(--px-raised);stroke:var(--px-bar);stroke-width:1.5}
.pq-time .act{fill:none;stroke:var(--px-text);stroke-width:2}
.pq-time .lab{fill:var(--px-fog);font-size:14px;letter-spacing:.02em}
.pq-time .eb{fill:var(--px-fog);font-size:13px;letter-spacing:.16em}
.pq-time .val{fill:var(--px-text);font-size:20px;font-weight:500}
.pq-time .big{fill:var(--px-strong);font-size:30px;font-weight:600;letter-spacing:-.02em}
.pq-time .txt{fill:var(--px-text);font-size:16px}
.pq-time .mt{fill:var(--px-mist);font-size:14px}
.pq-time .hint{fill:var(--px-fog);font-size:13px}
.pq-time .ember{stroke:url(#pq-time-eg);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:36 2000;fill:none}
.pq-time .emS{stroke:url(#pq-time-eg);stroke-width:2.5;fill:none}
.pq-time .ring{fill:none;stroke:var(--px-accent);stroke-width:2}
.pq-time .ok{fill:var(--px-ok)} .pq-time .warm{fill:var(--px-warm)} .pq-time .hot{fill:var(--px-accent)} .pq-time .err{fill:var(--px-err)}
.pq-time .okT{fill:var(--px-ok)} .pq-time .warmT{fill:var(--px-warm)} .pq-time .hotT{fill:var(--px-accent-text)} .pq-time .errT{fill:var(--px-err)} .pq-time .linkT{fill:var(--px-link)}
.pq-time .focus{fill:none;stroke:var(--px-link);stroke-width:2;stroke-dasharray:3 3}
@keyframes pq-time-k0{0.0000%{opacity:1;animation-timing-function:step-end}33.3333%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-time-k1{0.0000%{opacity:0;animation-timing-function:step-end}33.3333%{opacity:1;animation-timing-function:step-end}66.6667%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-time-k2{0.0000%{opacity:0;animation-timing-function:step-end}66.6667%{opacity:1;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-time-k3{0%{opacity:0}33.3333%{opacity:0}34.2222%{opacity:1}35.5556%{opacity:0}66.6667%{opacity:0}67.5556%{opacity:1}68.8889%{opacity:0}100%{opacity:0}}
.pq-time .k0{animation:pq-time-k0 9000ms linear infinite}
.pq-time .k1{animation:pq-time-k1 9000ms linear infinite}
.pq-time .k2{animation:pq-time-k2 9000ms linear infinite}
.pq-time .k3{animation:pq-time-k3 9000ms linear infinite}
@media (prefers-reduced-motion: reduce){.pq-time .k0{opacity:1}.pq-time .k1{opacity:0}.pq-time .k2{opacity:0}.pq-time .k3{opacity:0}}
</style>
<defs><linearGradient id="pq-time-eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pq-time-egu" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pq-time-egv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pq-time-egd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient></defs>

<text class="m eb" x="24" y="34">A DATE IS A STRING · AN INSTANT IS A NUMBER</text>
<rect class="bx" x="24" y="92" width="352" height="222" rx="16"/>
<text class="m lab" x="48" y="118">call</text>
<g class="k0"><text class="m txt" x="48" y="140" style="font-size:13px">add('2026-01-31', { months: 1 })</text><text class="big" x="48" y="196">2026-02-28</text><text class="m hint" x="48" y="238">the day clamps to the end of February</text></g><g class="k1"><text class="m txt" x="48" y="140" style="font-size:13px">diff('2026-11-18', '2026-12-24', 'day')</text><text class="big" x="48" y="196">36</text><text class="m hint" x="48" y="238">whole days between two strings</text></g><g class="k2"><text class="m txt" x="48" y="140" style="font-size:13px">toPlainDateTime(at, 'Asia/Tokyo')</text><text class="big" x="48" y="196">2026-11-18T23:00</text><text class="m hint" x="48" y="238">at = 09:00 in New York, as an instant</text></g>
<rect class="ring k3" x="40" y="156" width="320" height="52" rx="12"/>
<rect class="bx2" x="48" y="274" width="96" height="30" rx="15"/><g class="k0"><rect class="act" x="48" y="274" width="96" height="30" rx="15"/></g><text class="m mt" x="96" y="294" text-anchor="middle">add</text><rect class="bx2" x="152" y="274" width="96" height="30" rx="15"/><g class="k1"><rect class="act" x="152" y="274" width="96" height="30" rx="15"/></g><text class="m mt" x="200" y="294" text-anchor="middle">diff</text><rect class="bx2" x="256" y="274" width="96" height="30" rx="15"/><g class="k2"><rect class="act" x="256" y="274" width="96" height="30" rx="15"/></g><text class="m mt" x="304" y="294" text-anchor="middle">zone</text>
<rect class="bx" x="392" y="92" width="232" height="262" rx="16"/>
<text class="m lab" x="416" y="150">PlainDate</text><text class="m txt" x="416" y="170" style="font-size:13px">'2026-11-18'</text><text class="m lab" x="416" y="194">PlainTime</text><text class="m txt" x="416" y="214" style="font-size:13px">'14:30'</text><text class="m lab" x="416" y="238">PlainDateTime</text><text class="m txt" x="416" y="258" style="font-size:13px">'2026-11-18T14:30'</text><text class="m lab" x="416" y="282">Instant</text><text class="m txt" x="416" y="302" style="font-size:13px">1795010400000</text>
<text class="m hint" x="24" y="390">plain functions, no Date object on the calendar path</text>
</svg>
