<svg xmlns="http://www.w3.org/2000/svg" class="pxa pq-a11y" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="pq-a11y-t pq-a11y-d" fill="none">
<title id="pq-a11y-t">announce() speaks to screen-reader users from anywhere</title>
<desc id="pq-a11y-d">Schematic: clicking Save calls announce('Settings saved'). The message passes through a polite live region that sighted users never see, and the screen reader speaks “Settings saved”. Later, navigating to /billing is announced as “Billing” by the router integration.</desc>
