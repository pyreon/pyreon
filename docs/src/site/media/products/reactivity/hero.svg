<svg xmlns="http://www.w3.org/2000/svg" class="pxa pq-reactivity" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="pq-reactivity-t pq-reactivity-d" fill="none">
<title id="pq-reactivity-t">A signal write reaches only the nodes that read it</title>
<desc id="pq-reactivity-d">Schematic signal graph: count.set(2) travels from the count signal to the computed double and on to the two places that read it, a Badge text node and a document.title effect. A separate theme signal and the class it feeds stay grey: they do not depend on count, so they never run.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}
.pq-reactivity{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pq-reactivity .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pq-reactivity .pq-reactivity-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.pq-reactivity *{animation:none!important;transition:none!important}.pq-reactivity .pq-reactivity-rm{opacity:1}.pq-reactivity .pq-reactivity-am{opacity:0}}

.pq-reactivity .ln{stroke:var(--px-hint);stroke-width:1.5;fill:none}
.pq-reactivity .dash{stroke:var(--px-hint);stroke-width:1.5;stroke-dasharray:3 5;fill:none}
.pq-reactivity .bx{fill:var(--px-card);stroke:var(--px-bar);stroke-width:1.5}
.pq-reactivity .bx2{fill:var(--px-raised);stroke:var(--px-bar);stroke-width:1.5}
.pq-reactivity .lab{fill:var(--px-fog);font-size:14px;letter-spacing:.04em}
.pq-reactivity .eb{fill:var(--px-fog);font-size:13px;letter-spacing:.16em}
.pq-reactivity .val{fill:var(--px-text);font-size:20px;font-weight:500}
.pq-reactivity .big{fill:var(--px-strong);font-size:24px;font-weight:600;letter-spacing:-.02em}
.pq-reactivity .code{fill:var(--px-text);font-size:15px}
.pq-reactivity .kw{fill:var(--px-accent-text)} .pq-reactivity .fn{fill:var(--px-link)} .pq-reactivity .str{fill:var(--px-warm)} .pq-reactivity .ty{fill:var(--px-violet)}
.pq-reactivity .dim{fill:var(--px-fog)}
.pq-reactivity .hint{fill:var(--px-hint);font-size:13px}
.pq-reactivity .ember{stroke:url(#pq-reactivity-egu);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:36 900;fill:none}
.pq-reactivity .emberS{stroke:url(#pq-reactivity-egu);stroke-width:2.5;stroke-linecap:round;fill:none}
.pq-reactivity .ring{fill:none;stroke:var(--px-accent);stroke-width:2}
.pq-reactivity .ok{fill:var(--px-ok)} .pq-reactivity .warm{fill:var(--px-warm)} .pq-reactivity .hot{fill:var(--px-accent)} .pq-reactivity .errF{fill:var(--px-err)}
.pq-reactivity .okT{fill:var(--px-ok)} .pq-reactivity .warmT{fill:var(--px-warm)} .pq-reactivity .hotT{fill:var(--px-accent-text)} .pq-reactivity .errT{fill:var(--px-err)}
.pq-reactivity .okS{stroke:var(--px-ok)} .pq-reactivity .errS{stroke:var(--px-err)}
.pq-reactivity .gfill{fill:url(#pq-reactivity-eg)}
@media (prefers-reduced-motion: reduce){.pq-reactivity .ember{opacity:0}}

.pq-reactivity .node{fill:var(--px-card);stroke:var(--px-fog);stroke-width:1.5}
.pq-reactivity .cold{fill:var(--px-card);stroke:var(--px-bar);stroke-width:1.5}
.pq-reactivity .nl{fill:var(--px-text);font-size:17px}
.pq-reactivity .nv{fill:var(--px-fog);font-size:14px}
.pq-reactivity .sk{fill:var(--px-hint);font-size:13px}
