@keyframes pq-reactivity-ca{0.0000%{opacity:0;animation-timing-function:step-end}14.2857%{opacity:1;animation-timing-function:step-end}64.2857%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-reactivity-cb{0.0000%{opacity:1;animation-timing-function:step-end}14.2857%{opacity:0;animation-timing-function:step-end}64.2857%{opacity:1;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-reactivity-f0{0%{opacity:0}14.2857%{opacity:0}15.4286%{opacity:1}17.1429%{opacity:0}64.2857%{opacity:0}65.4286%{opacity:1}67.1429%{opacity:0}100%{opacity:0}}
@keyframes pq-reactivity-f1{0%{opacity:0}17.1429%{opacity:0}18.2857%{opacity:1}20.0000%{opacity:0}67.1429%{opacity:0}68.2857%{opacity:1}70.0000%{opacity:0}100%{opacity:0}}
@keyframes pq-reactivity-f2{0%{opacity:0}20.0000%{opacity:0}21.1429%{opacity:1}22.8571%{opacity:0}70.0000%{opacity:0}71.1429%{opacity:1}72.8571%{opacity:0}100%{opacity:0}}
@keyframes pq-reactivity-e1{0%{stroke-dashoffset:36;opacity:0}14.2857%{stroke-dashoffset:36;opacity:1}17.1429%{stroke-dashoffset:-210;opacity:1}17.1571%{stroke-dashoffset:36;opacity:0}64.2857%{stroke-dashoffset:36;opacity:1}67.1429%{stroke-dashoffset:-210;opacity:1}67.1571%{stroke-dashoffset:36;opacity:0}100%{stroke-dashoffset:36;opacity:0}}
