@media (prefers-reduced-motion: reduce){.pq-reactivity .a,.pq-reactivity .da,.pq-reactivity .ra,.pq-reactivity .cb{opacity:0}.pq-reactivity .b,.pq-reactivity .db,.pq-reactivity .rb,.pq-reactivity .ca{opacity:1}}
</style>
