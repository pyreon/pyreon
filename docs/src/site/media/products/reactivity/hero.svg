@keyframes pq-reactivity-da{0.0000%{opacity:1;animation-timing-function:step-end}17.1429%{opacity:0;animation-timing-function:step-end}67.1429%{opacity:1;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-reactivity-db{0.0000%{opacity:0;animation-timing-function:step-end}17.1429%{opacity:1;animation-timing-function:step-end}67.1429%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-reactivity-ra{0.0000%{opacity:1;animation-timing-function:step-end}20.0000%{opacity:0;animation-timing-function:step-end}70.0000%{opacity:1;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
