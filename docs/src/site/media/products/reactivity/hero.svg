.pq-reactivity .a{animation:pq-reactivity-a 7000ms linear infinite}
.pq-reactivity .b{animation:pq-reactivity-b 7000ms linear infinite}
.pq-reactivity .da{animation:pq-reactivity-da 7000ms linear infinite}
.pq-reactivity .db{animation:pq-reactivity-db 7000ms linear infinite}
.pq-reactivity .ra{animation:pq-reactivity-ra 7000ms linear infinite}
