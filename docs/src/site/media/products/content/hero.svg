<defs><linearGradient id="pq-content-eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pq-content-egu" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pq-content-egv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pq-content-egd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient></defs>

<text class="m eb" x="24" y="34">ZERO-CONTENT · TYPED COLLECTIONS</text>
<!-- markdown file -->
<rect class="bx" x="24" y="58" width="250" height="176" rx="12"/>
<text class="m hint" x="40" y="84">src/content/blog/hello.md</text>
<text class="m code dim" x="40" y="118">---</text>
<g class="typo"><text class="m code" x="40" y="146"><tspan class="kw">titel</tspan>: Hello, Pyreon</text>
<line x1="40" y1="152" x2="85" y2="152" class="emberS"/></g>
<text class="m code fixed" x="40" y="146" opacity="0"><tspan class="fn">title</tspan>: Hello, Pyreon</text>
<text class="m code" x="40" y="174"><tspan class="fn">date</tspan>: <tspan class="str">2026-11-16</tspan></text>
<text class="m code dim" x="40" y="202">---</text>
<text class="m hint" x="40" y="224"># Hello…</text>
<!-- schema -->
<path class="ln" d="M274 146 L334 146"/>
<path class="ember t1" d="M274 146 L334 146"/>
<rect class="bx" x="334" y="58" width="282" height="176" rx="12"/>
<text class="m hint" x="350" y="84">content.config.ts</text>
<text class="m code" x="350" y="114">blog: <tspan class="fn">defineCollection</tspan>({</text>
<text class="m code" x="366" y="140">schema: z.<tspan class="fn">object</tspan>({</text>
<text class="m code" x="382" y="166">title: z.<tspan class="fn">string</tspan>(),</text>
<text class="m code" x="382" y="192">date: z.<tspan class="fn">date</tspan>(),</text>
<text class="m code" x="350" y="218">})})</text>
<rect class="ring chk" x="374" y="148" width="190" height="26" rx="6" opacity="0"/>
<rect class="ring pq-content-rm" x="374" y="148" width="190" height="26" rx="6"/>
<!-- build -->
<path class="ln" d="M475 234 L475 266"/>
<path class="ember t2" d="M475 234 L475 266"/>
<rect class="bx2" x="24" y="266" width="592" height="96" rx="12"/>
<text class="m hint" x="40" y="292">$ zero build</text>
<text class="m lab idle" x="40" y="324">checking frontmatter…</text>
<g class="err" opacity="0">
<text class="m errT" x="40" y="322" font-size="14">✗ hello.md: frontmatter does not match collection "blog"</text>
<text class="m lab" x="40" y="346" font-size="14">  schema (1 issue): - title: expected string</text>
</g>
<g class="ok" opacity="0">
<text class="m okT" x="40" y="322" font-size="14">✓ built</text>
<text class="m lab" x="40" y="346" font-size="14">pages · search index · sitemap · RSS · llms.txt</text>
</g>
<text class="m hint" x="24" y="390">the build stops; readers never see a broken page</text>
</svg>
