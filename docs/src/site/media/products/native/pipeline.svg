<svg xmlns="http://www.w3.org/2000/svg" class="pxa pq-native" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="pq-native-t pq-native-d" fill="none">
<title id="pq-native-t">One .tsx lowered by PMTC to the web, SwiftUI and Jetpack Compose</title>
<desc id="pq-native-d">A table of how one .tsx source lowers through the PMTC compiler: signal becomes a DOM binding on the web, @State in SwiftUI and mutableStateOf in Compose; &lt;Stack&gt; becomes a flex column div, VStack and Column; &lt;Inline&gt; a flex row, HStack and Row; &lt;Field&gt; an input, TextField and TextField; &lt;Toggle&gt; a switch input, Toggle and Switch; &lt;Scroll&gt; with &lt;For&gt; a keyed list, LazyVStack and LazyColumn. Rows light up one at a time. iOS and Android targets are experimental.</desc>
