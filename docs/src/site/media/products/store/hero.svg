.pq-store .eb{fill:var(--px-fog);font-size:13px;letter-spacing:.16em}
.pq-store .val{fill:var(--px-text);font-size:20px;font-weight:500}
.pq-store .big{fill:var(--px-strong);font-size:24px;font-weight:600;letter-spacing:-.02em}
.pq-store .code{fill:var(--px-text);font-size:15px}
.pq-store .kw{fill:var(--px-accent-text)} .pq-store .fn{fill:var(--px-link)} .pq-store .str{fill:var(--px-warm)} .pq-store .ty{fill:var(--px-violet)}
.pq-store .dim{fill:var(--px-fog)}
.pq-store .hint{fill:var(--px-hint);font-size:13px}
.pq-store .ember{stroke:url(#pq-store-egu);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:36 900;fill:none}
.pq-store .emberS{stroke:url(#pq-store-egu);stroke-width:2.5;stroke-linecap:round;fill:none}
.pq-store .ring{fill:none;stroke:var(--px-accent);stroke-width:2}
.pq-store .ok{fill:var(--px-ok)} .pq-store .warm{fill:var(--px-warm)} .pq-store .hot{fill:var(--px-accent)} .pq-store .errF{fill:var(--px-err)}
.pq-store .okT{fill:var(--px-ok)} .pq-store .warmT{fill:var(--px-warm)} .pq-store .hotT{fill:var(--px-accent-text)} .pq-store .errT{fill:var(--px-err)}
.pq-store .okS{stroke:var(--px-ok)} .pq-store .errS{stroke:var(--px-err)}
.pq-store .gfill{fill:url(#pq-store-eg)}
@media (prefers-reduced-motion: reduce){.pq-store .ember{opacity:0}}

