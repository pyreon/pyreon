@keyframes pq-store-e1{0%{stroke-dashoffset:36;opacity:0}11.9048%{stroke-dashoffset:36;opacity:1}14.2857%{stroke-dashoffset:-120;opacity:1}14.2976%{stroke-dashoffset:36;opacity:0}61.9048%{stroke-dashoffset:36;opacity:1}64.2857%{stroke-dashoffset:-120;opacity:1}64.2976%{stroke-dashoffset:36;opacity:0}100%{stroke-dashoffset:36;opacity:0}}
