<text class="m eb" x="24" y="34">@PYREON/STORE · NO SELECTORS</text>
<rect class="bx" x="24" y="56" width="300" height="218" rx="12"/>
<text class="m code" x="40" y="88"><tspan class="fn">defineStore</tspan>(<tspan class="str">'cart'</tspan>, () =&gt; {</text>
<text class="m code" x="56" y="118">items = <tspan class="fn">signal</tspan>([…])</text>
<text class="m code" x="56" y="148">discount = <tspan class="fn">signal</tspan>(</text><text class="m code d0" x="218" y="148"><tspan class="str">0</tspan>)</text><text class="m code d1" x="218" y="148" opacity="0"><tspan class="str">0.1</tspan>)</text>
<text class="m code" x="56" y="178">total = <tspan class="fn">computed</tspan>(…)</text>
<text class="m code" x="56" y="208">count = <tspan class="fn">computed</tspan>(…)</text>
<text class="m code" x="56" y="236"><tspan class="fn">applyCoupon</tspan>, …</text>
<text class="m code" x="40" y="260">})</text>
