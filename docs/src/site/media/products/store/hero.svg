<svg xmlns="http://www.w3.org/2000/svg" class="pxa pq-store" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="pq-store-t pq-store-d" fill="none">
<title id="pq-store-t">A store action updates only the text that reads what changed</title>
<desc id="pq-store-d">A cart store defined with defineStore holds items, discount and a computed total. store.applyCoupon('TEN') sets discount; total recomputes and only the &lt;Total&gt; text in the page updates, from $120 to $108. The &lt;CartBadge&gt; reading count and the &lt;UserMenu&gt; reading another store stay untouched, and onAction logs the call with its name and arguments. Later store.removeCoupon() puts it back.</desc>
<style>
