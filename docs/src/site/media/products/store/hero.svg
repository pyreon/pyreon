@keyframes pq-store-l0{0.0000%{opacity:0;animation-timing-function:step-end}11.9048%{opacity:1;animation-timing-function:step-end}61.9048%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-store-l1{0.0000%{opacity:0;animation-timing-function:step-end}61.9048%{opacity:1;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
