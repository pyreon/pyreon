<svg xmlns="http://www.w3.org/2000/svg" class="pxa pq-query" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="pq-query-t pq-query-d" fill="none">
<title id="pq-query-t">A query refetches; only the field that changed updates</title>
<desc id="pq-query-d">Schematic: a cached query for ['user', 7] goes stale, refetches from the server, and the new name flows to the one reader of data().name. The isFetching reader blinks while loading; the error reader never runs.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}
.pq-query{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pq-query .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pq-query .pq-query-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.pq-query *{animation:none!important;transition:none!important}.pq-query .pq-query-rm{opacity:1}.pq-query .pq-query-am{opacity:0}}

.pq-query .ln{stroke:var(--px-hint);stroke-width:1.5}
.pq-query .bx{fill:var(--px-card);stroke:var(--px-bar);stroke-width:1.5}
.pq-query .lab{fill:var(--px-fog);font-size:14px;letter-spacing:.04em}
.pq-query .eb{fill:var(--px-fog);font-size:13px;letter-spacing:.16em}
.pq-query .val{fill:var(--px-text);font-size:20px;font-weight:500}
.pq-query .hint{fill:var(--px-hint);font-size:13px}
.pq-query .ember{stroke:url(#pq-query-egu);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:36 600}
.pq-query .ring{fill:none;stroke:var(--px-accent);stroke-width:2}
.pq-query .ok{fill:var(--px-ok)} .pq-query .warm{fill:var(--px-warm)} .pq-query .hot{fill:var(--px-accent)}
.pq-query .okT{fill:var(--px-ok)} .pq-query .warmT{fill:var(--px-warm)} .pq-query .hotT{fill:var(--px-accent-text)}
@keyframes pq-query-fresh{0.0000%{opacity:1;animation-timing-function:step-end}15.0000%{opacity:0;animation-timing-function:step-end}32.5000%{opacity:1;animation-timing-function:step-end}65.0000%{opacity:0;animation-timing-function:step-end}82.5000%{opacity:1;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-query-stale{0.0000%{opacity:0;animation-timing-function:step-end}15.0000%{opacity:1;animation-timing-function:step-end}25.0000%{opacity:0;animation-timing-function:step-end}65.0000%{opacity:1;animation-timing-function:step-end}75.0000%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-query-fetch{0.0000%{opacity:0;animation-timing-function:step-end}25.0000%{opacity:1;animation-timing-function:step-end}32.5000%{opacity:0;animation-timing-function:step-end}75.0000%{opacity:1;animation-timing-function:step-end}82.5000%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-query-nameA{0.0000%{opacity:1;animation-timing-function:step-end}32.5000%{opacity:0;animation-timing-function:step-end}82.5000%{opacity:1;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-query-nameB{0.0000%{opacity:0;animation-timing-function:step-end}32.5000%{opacity:1;animation-timing-function:step-end}82.5000%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-query-ftrue{0.0000%{opacity:0;animation-timing-function:step-end}25.0000%{opacity:1;animation-timing-function:step-end}32.5000%{opacity:0;animation-timing-function:step-end}75.0000%{opacity:1;animation-timing-function:step-end}82.5000%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-query-ffalse{0.0000%{opacity:1;animation-timing-function:step-end}25.0000%{opacity:0;animation-timing-function:step-end}32.5000%{opacity:1;animation-timing-function:step-end}75.0000%{opacity:0;animation-timing-function:step-end}82.5000%{opacity:1;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-query-srv{0%{stroke-dashoffset:36;opacity:0}25.0000%{stroke-dashoffset:36;opacity:1}27.5000%{stroke-dashoffset:-150;opacity:1}27.5125%{stroke-dashoffset:36;opacity:0}75.0000%{stroke-dashoffset:36;opacity:1}77.5000%{stroke-dashoffset:-150;opacity:1}77.5125%{stroke-dashoffset:36;opacity:0}100%{stroke-dashoffset:36;opacity:0}}
@keyframes pq-query-toName{0%{stroke-dashoffset:36;opacity:0}32.5000%{stroke-dashoffset:36;opacity:1}35.0000%{stroke-dashoffset:-190;opacity:1}35.0125%{stroke-dashoffset:36;opacity:0}82.5000%{stroke-dashoffset:36;opacity:1}85.0000%{stroke-dashoffset:-190;opacity:1}85.0125%{stroke-dashoffset:36;opacity:0}100%{stroke-dashoffset:36;opacity:0}}
@keyframes pq-query-toFetch{0%{stroke-dashoffset:36;opacity:0}25.0000%{stroke-dashoffset:36;opacity:1}27.5000%{stroke-dashoffset:-150;opacity:1}27.5125%{stroke-dashoffset:36;opacity:0}32.5000%{stroke-dashoffset:36;opacity:1}35.0000%{stroke-dashoffset:-150;opacity:1}35.0125%{stroke-dashoffset:36;opacity:0}75.0000%{stroke-dashoffset:36;opacity:1}77.5000%{stroke-dashoffset:-150;opacity:1}77.5125%{stroke-dashoffset:36;opacity:0}82.5000%{stroke-dashoffset:36;opacity:1}85.0000%{stroke-dashoffset:-150;opacity:1}85.0125%{stroke-dashoffset:36;opacity:0}100%{stroke-dashoffset:36;opacity:0}}
@keyframes pq-query-nameRing{0%{opacity:0}34.3750%{opacity:0}35.3750%{opacity:1}36.8750%{opacity:0}84.3750%{opacity:0}85.3750%{opacity:1}86.8750%{opacity:0}100%{opacity:0}}
@keyframes pq-query-fRing{0%{opacity:0}26.5000%{opacity:0}27.5000%{opacity:1}29.0000%{opacity:0}34.0000%{opacity:0}35.0000%{opacity:1}36.5000%{opacity:0}76.5000%{opacity:0}77.5000%{opacity:1}79.0000%{opacity:0}84.0000%{opacity:0}85.0000%{opacity:1}86.5000%{opacity:0}100%{opacity:0}}
@keyframes pq-query-focus{0.0000%{opacity:0;animation-timing-function:step-end}18.7500%{opacity:1;animation-timing-function:step-end}33.7500%{opacity:0;animation-timing-function:step-end}68.7500%{opacity:1;animation-timing-function:step-end}83.7500%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
.pq-query .fresh{animation:pq-query-fresh 8000ms linear infinite} .pq-query .stale{animation:pq-query-stale 8000ms linear infinite} .pq-query .fetch{animation:pq-query-fetch 8000ms linear infinite}
.pq-query .nameA{animation:pq-query-nameA 8000ms linear infinite} .pq-query .nameB{animation:pq-query-nameB 8000ms linear infinite}
.pq-query .ftrue{animation:pq-query-ftrue 8000ms linear infinite} .pq-query .ffalse{animation:pq-query-ffalse 8000ms linear infinite}
.pq-query .srv{animation:pq-query-srv 8000ms linear infinite} .pq-query .toName{animation:pq-query-toName 8000ms linear infinite} .pq-query .toFetch{animation:pq-query-toFetch 8000ms linear infinite}
.pq-query .nameRing{animation:pq-query-nameRing 8000ms linear infinite} .pq-query .fRing{animation:pq-query-fRing 8000ms linear infinite} .pq-query .focus{animation:pq-query-focus 8000ms linear infinite}
@media (prefers-reduced-motion: reduce){.pq-query .ember{opacity:0}.pq-query .nameB,.pq-query .stale,.pq-query .fetch,.pq-query .ftrue,.pq-query .focus{opacity:0}.pq-query .nameA,.pq-query .fresh,.pq-query .ffalse{opacity:1}}
</style>
<defs><linearGradient id="pq-query-eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pq-query-egu" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pq-query-egv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pq-query-egd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient></defs>

<text class="m eb" x="24" y="34">USEQUERY · ONE CACHE · THREE READERS</text>
<!-- server -->
<rect class="bx" x="24" y="164" width="104" height="72" rx="12"/>
<text class="m lab" x="76" y="196" text-anchor="middle">server</text>
<text class="m hint" x="76" y="218" text-anchor="middle">GET /users/7</text>
<line class="ln" x1="128" y1="200" x2="278" y2="200"/>
<line class="ember srv" x1="128" y1="200" x2="278" y2="200"/>
<text class="m hint focus" x="203" y="186" text-anchor="middle">window focus</text>
<!-- cache -->
<rect class="bx" x="278" y="136" width="162" height="128" rx="14"/>
<text class="m lab" x="294" y="164">['user', 7]</text>
<g class="fresh"><circle class="ok" cx="300" cy="190" r="5"/><text class="m okT" x="314" y="195" font-size="15">fresh</text></g>
<g class="stale" opacity="0"><circle class="warm" cx="300" cy="190" r="5"/><text class="m warmT" x="314" y="195" font-size="15">stale</text></g>
<g class="fetch" opacity="0"><circle class="hot" cx="300" cy="190" r="5"/><text class="m hotT" x="314" y="195" font-size="15">fetching</text></g>
<text class="m hint" x="294" y="226">staleTime: 30s</text>
<text class="m hint" x="294" y="248">dedupes · retries</text>
<!-- edges to readers -->
<path class="ln" d="M440 180 C 476 180, 470 92, 492 92"/>
<path class="ln" d="M440 200 C 476 200, 470 200, 492 200"/>
<path class="ln" d="M440 220 C 476 220, 470 308, 492 308"/>
<path class="ember toName" d="M440 180 C 476 180, 470 92, 492 92"/>
<path class="ember toFetch" d="M440 200 C 476 200, 470 200, 492 200"/>
<path class="pq-query-rm" d="M440 180 C 476 180, 470 92, 492 92" stroke="url(#pq-query-egu)" stroke-width="2.5"/>
<!-- readers -->
<rect class="bx" x="492" y="58" width="128" height="68" rx="12"/>
<text class="m lab" x="506" y="82">data().name</text>
<text class="val nameA" x="506" y="110">Ada</text>
<text class="val nameB" x="506" y="110" opacity="0">Ada L.</text>
<rect class="ring nameRing" x="488" y="54" width="136" height="76" rx="15" opacity="0"/>
<rect class="ring pq-query-rm" x="488" y="54" width="136" height="76" rx="15"/>
<rect class="bx" x="492" y="166" width="128" height="68" rx="12"/>
<text class="m lab" x="506" y="190">isFetching()</text>
<text class="val m ffalse" x="506" y="218" font-size="18">false</text>
<text class="val m ftrue" x="506" y="218" font-size="18" opacity="0">true</text>
<rect class="ring fRing" x="488" y="162" width="136" height="76" rx="15" opacity="0"/>
<rect class="bx" x="492" y="274" width="128" height="68" rx="12"/>
<text class="m lab" x="506" y="298">error()</text>
<text class="val m" x="506" y="326" font-size="18" style="fill:var(--px-fog)">null</text>
<text class="m hint" x="556" y="364" text-anchor="middle">never re-runs</text>
<text class="m hint" x="24" y="392">each reader subscribes to one field · the component body never re-runs</text>
</svg>
