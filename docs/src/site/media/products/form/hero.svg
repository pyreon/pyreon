@keyframes pq-form-ty5{0.0000%{opacity:0;animation-timing-function:step-end}30.0000%{opacity:1;animation-timing-function:step-end}33.7500%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-form-ty6{0.0000%{opacity:0;animation-timing-function:step-end}33.7500%{opacity:1;animation-timing-function:step-end}82.5000%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-form-bad{0.0000%{opacity:0;animation-timing-function:step-end}11.2500%{opacity:1;animation-timing-function:step-end}33.7500%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-form-good{0.0000%{opacity:0;animation-timing-function:step-end}33.7500%{opacity:1;animation-timing-function:step-end}82.5000%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-form-kf{0%{opacity:0}11.2500%{opacity:0}12.1500%{opacity:1}13.5000%{opacity:0}15.0000%{opacity:0}15.9000%{opacity:1}17.2500%{opacity:0}18.7500%{opacity:0}19.6500%{opacity:1}21.0000%{opacity:0}22.5000%{opacity:0}23.4000%{opacity:1}24.7500%{opacity:0}26.2500%{opacity:0}27.1500%{opacity:1}28.5000%{opacity:0}30.0000%{opacity:0}30.9000%{opacity:1}32.2500%{opacity:0}33.7500%{opacity:0}34.6500%{opacity:1}36.0000%{opacity:0}100%{opacity:0}}
@keyframes pq-form-c0{0.0000%{opacity:1;animation-timing-function:step-end}11.2500%{opacity:0;animation-timing-function:step-end}82.5000%{opacity:1;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-form-c1{0.0000%{opacity:0;animation-timing-function:step-end}11.2500%{opacity:1;animation-timing-function:step-end}82.5000%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
.pq-form .ty0{animation:pq-form-ty0 8000ms linear infinite}
.pq-form .ty1{animation:pq-form-ty1 8000ms linear infinite}
.pq-form .ty2{animation:pq-form-ty2 8000ms linear infinite}
.pq-form .ty3{animation:pq-form-ty3 8000ms linear infinite}
.pq-form .ty4{animation:pq-form-ty4 8000ms linear infinite}
.pq-form .ty5{animation:pq-form-ty5 8000ms linear infinite}
.pq-form .ty6{animation:pq-form-ty6 8000ms linear infinite}
.pq-form .bad{animation:pq-form-bad 8000ms linear infinite}
.pq-form .good{animation:pq-form-good 8000ms linear infinite}
.pq-form .kf{animation:pq-form-kf 8000ms linear infinite}
.pq-form .c0{animation:pq-form-c0 8000ms linear infinite}
.pq-form .c1{animation:pq-form-c1 8000ms linear infinite}
@media (prefers-reduced-motion: reduce){.pq-form [class*="ty"],.pq-form .bad,.pq-form .c0{opacity:0}.pq-form .ty6,.pq-form .good,.pq-form .c1{opacity:1}}
</style>
