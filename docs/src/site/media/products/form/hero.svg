<svg xmlns="http://www.w3.org/2000/svg" class="pxa pq-form" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="pq-form-t pq-form-d" fill="none">
<title id="pq-form-t">Type in one field; the other eleven never update</title>
<desc id="pq-form-d">A twelve-field form. Letters are typed into the email field one keystroke at a time; each keystroke pulses only the email input and its message, which reads "invalid" until the address is complete and then shows a check mark. The other eleven fields stay still and a counter reads 0 updates for them.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}
.pq-form{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pq-form .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pq-form .pq-form-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.pq-form *{animation:none!important;transition:none!important}.pq-form .pq-form-rm{opacity:1}.pq-form .pq-form-am{opacity:0}}

.pq-form .ln{stroke:var(--px-hint);stroke-width:1.5;fill:none}
.pq-form .dash{stroke:var(--px-hint);stroke-width:1.5;stroke-dasharray:3 5;fill:none}
.pq-form .bx{fill:var(--px-card);stroke:var(--px-bar);stroke-width:1.5}
.pq-form .bx2{fill:var(--px-raised);stroke:var(--px-bar);stroke-width:1.5}
.pq-form .lab{fill:var(--px-fog);font-size:14px;letter-spacing:.04em}
.pq-form .eb{fill:var(--px-fog);font-size:13px;letter-spacing:.16em}
.pq-form .val{fill:var(--px-text);font-size:20px;font-weight:500}
.pq-form .big{fill:var(--px-strong);font-size:24px;font-weight:600;letter-spacing:-.02em}
.pq-form .code{fill:var(--px-text);font-size:15px}
.pq-form .kw{fill:var(--px-accent-text)} .pq-form .fn{fill:var(--px-link)} .pq-form .str{fill:var(--px-warm)} .pq-form .ty{fill:var(--px-violet)}
.pq-form .dim{fill:var(--px-fog)}
.pq-form .hint{fill:var(--px-hint);font-size:13px}
.pq-form .ember{stroke:url(#pq-form-egu);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:36 900;fill:none}
.pq-form .emberS{stroke:url(#pq-form-egu);stroke-width:2.5;stroke-linecap:round;fill:none}
.pq-form .ring{fill:none;stroke:var(--px-accent);stroke-width:2}
.pq-form .ok{fill:var(--px-ok)} .pq-form .warm{fill:var(--px-warm)} .pq-form .hot{fill:var(--px-accent)} .pq-form .errF{fill:var(--px-err)}
.pq-form .okT{fill:var(--px-ok)} .pq-form .warmT{fill:var(--px-warm)} .pq-form .hotT{fill:var(--px-accent-text)} .pq-form .errT{fill:var(--px-err)}
.pq-form .okS{stroke:var(--px-ok)} .pq-form .errS{stroke:var(--px-err)}
.pq-form .gfill{fill:url(#pq-form-eg)}
@media (prefers-reduced-motion: reduce){.pq-form .ember{opacity:0}}

@keyframes pq-form-ty0{0.0000%{opacity:0;animation-timing-function:step-end}11.2500%{opacity:1;animation-timing-function:step-end}15.0000%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-form-ty1{0.0000%{opacity:0;animation-timing-function:step-end}15.0000%{opacity:1;animation-timing-function:step-end}18.7500%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
