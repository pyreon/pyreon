<svg xmlns="http://www.w3.org/2000/svg" class="pxa pq-kinetic" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="pq-kinetic-t pq-kinetic-d" fill="none">
<title id="pq-kinetic-t">A presence animation in one line, run by the compositor</title>
<desc id="pq-kinetic-d">Code: const FadeUp = kinetic('div').preset(fadeUp), used as &lt;FadeUp show={() =&gt; open()}&gt;. When open() turns true a card fades and slides up into a list; later it fades out before unmounting. A timeline underneath shows the main thread doing two small steps (apply styles across a double requestAnimationFrame, then transitionend) while the compositor runs the transform and opacity transition.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}
.pq-kinetic{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pq-kinetic .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pq-kinetic .pq-kinetic-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.pq-kinetic *{animation:none!important;transition:none!important}.pq-kinetic .pq-kinetic-rm{opacity:1}.pq-kinetic .pq-kinetic-am{opacity:0}}

.pq-kinetic .ln{stroke:var(--px-hint);stroke-width:1.5;fill:none}
.pq-kinetic .dash{stroke:var(--px-hint);stroke-width:1.5;stroke-dasharray:3 5;fill:none}
.pq-kinetic .bx{fill:var(--px-card);stroke:var(--px-bar);stroke-width:1.5}
.pq-kinetic .bx2{fill:var(--px-raised);stroke:var(--px-bar);stroke-width:1.5}
.pq-kinetic .lab{fill:var(--px-fog);font-size:14px;letter-spacing:.04em}
.pq-kinetic .eb{fill:var(--px-fog);font-size:13px;letter-spacing:.16em}
.pq-kinetic .val{fill:var(--px-text);font-size:20px;font-weight:500}
.pq-kinetic .big{fill:var(--px-strong);font-size:24px;font-weight:600;letter-spacing:-.02em}
.pq-kinetic .code{fill:var(--px-text);font-size:15px}
.pq-kinetic .kw{fill:var(--px-accent-text)} .pq-kinetic .fn{fill:var(--px-link)} .pq-kinetic .str{fill:var(--px-warm)} .pq-kinetic .ty{fill:var(--px-violet)}
.pq-kinetic .dim{fill:var(--px-fog)}
.pq-kinetic .hint{fill:var(--px-hint);font-size:13px}
.pq-kinetic .ember{stroke:url(#pq-kinetic-egu);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:36 900;fill:none}
.pq-kinetic .emberS{stroke:url(#pq-kinetic-egu);stroke-width:2.5;stroke-linecap:round;fill:none}
.pq-kinetic .ring{fill:none;stroke:var(--px-accent);stroke-width:2}
.pq-kinetic .ok{fill:var(--px-ok)} .pq-kinetic .warm{fill:var(--px-warm)} .pq-kinetic .hot{fill:var(--px-accent)} .pq-kinetic .errF{fill:var(--px-err)}
.pq-kinetic .okT{fill:var(--px-ok)} .pq-kinetic .warmT{fill:var(--px-warm)} .pq-kinetic .hotT{fill:var(--px-accent-text)} .pq-kinetic .errT{fill:var(--px-err)}
.pq-kinetic .okS{stroke:var(--px-ok)} .pq-kinetic .errS{stroke:var(--px-err)}
.pq-kinetic .gfill{fill:url(#pq-kinetic-eg)}
@media (prefers-reduced-motion: reduce){.pq-kinetic .ember{opacity:0}}

@keyframes pq-kinetic-card{0%{opacity:0;transform:translateY(18px)}15.000%{opacity:0;transform:translateY(18px)}20.250%{opacity:1;transform:translateY(0)}62.500%{opacity:1;transform:translateY(0)}66.500%{opacity:0;transform:translateY(-10px)}100%{opacity:0;transform:translateY(18px)}}
.pq-kinetic .card{animation:pq-kinetic-card 8000ms cubic-bezier(.2,.7,.3,1) infinite}
@keyframes pq-kinetic-ph{0%{transform:translateX(0);opacity:0}13.112%{transform:translateX(0);opacity:0}13.125%{transform:translateX(0);opacity:1}23.375%{transform:translateX(450px);opacity:1}30.875%{transform:translateX(450px);opacity:1}30.888%{opacity:0}100%{opacity:0}}
.pq-kinetic .ph{animation:pq-kinetic-ph 8000ms linear infinite}
@keyframes pq-kinetic-t{0.0000%{opacity:0;animation-timing-function:step-end}15.0000%{opacity:1;animation-timing-function:step-end}62.5000%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-kinetic-f{0.0000%{opacity:1;animation-timing-function:step-end}15.0000%{opacity:0;animation-timing-function:step-end}62.5000%{opacity:1;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-kinetic-b1{0%{opacity:0}15.0000%{opacity:0}16.0000%{opacity:1}17.5000%{opacity:0}100%{opacity:0}}
.pq-kinetic .vt{animation:pq-kinetic-t 8000ms linear infinite}
.pq-kinetic .vf{animation:pq-kinetic-f 8000ms linear infinite}
.pq-kinetic .b1{animation:pq-kinetic-b1 8000ms linear infinite}
@media (prefers-reduced-motion: reduce){.pq-kinetic .card{opacity:1;transform:none}.pq-kinetic .vf,.pq-kinetic .ph{opacity:0}.pq-kinetic .vt{opacity:1}}
</style>
<defs><linearGradient id="pq-kinetic-eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pq-kinetic-egu" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pq-kinetic-egv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pq-kinetic-egd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient></defs>

<text class="m eb" x="24" y="34">@PYREON/KINETIC · PRESENCE</text>
<rect class="bx" x="24" y="58" width="296" height="184" rx="12"/>
<text class="m hint" x="40" y="84">Panel.tsx</text>
<text class="m code" x="40" y="118"><tspan class="kw">const</tspan> FadeUp =</text>
<text class="m code" x="56" y="144"><tspan class="fn">kinetic</tspan>(<tspan class="str">'div'</tspan>)</text>
<text class="m code" x="56" y="170">.<tspan class="fn">preset</tspan>(fadeUp)</text>
<text class="m code" x="40" y="208">&lt;<tspan class="ty">FadeUp</tspan> show={() =&gt; open()}&gt;</text>
<text class="m lab vf" x="40" y="230">open() → false</text>
<text class="m lab vt" x="40" y="230" opacity="0" style="fill:var(--px-text)">open() → true</text>
<!-- preview -->
<rect class="bx2" x="330" y="58" width="286" height="184" rx="12"/>
<rect class="bx" x="344" y="72" width="258" height="36" rx="9"/><rect x="358" y="86" width="120" height="8" rx="4" style="fill:var(--px-line2)"/><rect class="bx" x="344" y="116" width="258" height="36" rx="9"/><rect x="358" y="130" width="90" height="8" rx="4" style="fill:var(--px-line2)"/>
<g class="card"><rect class="bx" x="344" y="160" width="258" height="64" rx="10" style="stroke:var(--px-fog)"/>
<text class="m lab" x="360" y="186" style="fill:var(--px-text)">Saved draft</text>
<rect x="360" y="200" width="150" height="8" rx="4" style="fill:var(--px-line2)"/></g>
<rect class="ring pq-kinetic-rm" x="340" y="156" width="266" height="72" rx="13"/>
<!-- lanes -->
<text class="m lab" x="24" y="292">main thread</text>
<text class="m lab" x="24" y="338">compositor</text>
<line x1="150" y1="288" x2="600" y2="288" class="dash"/>
<line x1="150" y1="334" x2="600" y2="334" class="dash"/>
<rect x="210.4" y="279" width="22.0" height="18" rx="2" style="fill:var(--px-fog)"/>
<rect x="462.8" y="279" width="6" height="18" rx="2" style="fill:var(--px-fog)"/>
<rect class="gfill" x="232.3" y="327" width="230.5" height="14" rx="3" opacity=".35"/>
<rect class="gfill b1" x="232.3" y="327" width="230.5" height="14" rx="3" opacity="0"/>
<text class="m hint" x="210.4" y="314" text-anchor="end">2× rAF</text>
<text class="m hint" x="474.8" y="270">transitionend</text>
<text class="m hint" x="232.3" y="362">transform + opacity</text>
<text class="m hint" x="24" y="268">the enter, zoomed in</text>
<line class="ph" x1="150" y1="262" x2="150" y2="350" style="stroke:var(--px-mist)" stroke-width="1"/>
<text class="m hint" x="24" y="392">no JavaScript animation loop · reduced motion jumps to the end state</text>
</svg>
