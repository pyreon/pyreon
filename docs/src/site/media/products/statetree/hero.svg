</style>
<defs><linearGradient id="pq-statetree-eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pq-statetree-egu" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pq-statetree-egv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pq-statetree-egd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient></defs>

<text class="m eb" x="24" y="34">@PYREON/STATE-TREE · PATCHES AND SNAPSHOTS</text>
<rect class="bx" x="24" y="56" width="300" height="168" rx="12"/>
<text class="m code" x="40" y="88"><tspan class="kw">const</tspan> Counter = <tspan class="fn">model</tspan>({</text>
<text class="m code" x="56" y="114">state: { count: <tspan class="str">0</tspan> } })</text>
<text class="m code" x="56" y="140">.<tspan class="fn">actions</tspan>((self) =&gt; ({</text>
<text class="m code" x="72" y="166"><tspan class="fn">increment</tspan>: … }))</text>
<text class="m lab" x="40" y="204">counter.count()</text>
<text class="m val v5" x="300" y="206" text-anchor="end">5</text>
<text class="m val v6" x="300" y="206" text-anchor="end" opacity="0">6</text>
<!-- patch log -->
<path class="ln" d="M324 140 L352 140"/><path class="ember tp" d="M324 140 L352 140"/>
<rect class="bx2" x="352" y="56" width="264" height="168" rx="12"/>
<text class="m hint" x="368" y="82">onPatch</text>
<text class="m lab p0" x="368" y="130">waiting for an action…</text>
<g class="p6" opacity="0"><text class="m code" x="368" y="118" font-size="14">{ op: <tspan class="str">'replace'</tspan>,</text><text class="m code" x="384" y="142" font-size="14">path: <tspan class="str">'/count'</tspan>,</text><text class="m code" x="384" y="166" font-size="14">value: <tspan class="str">6</tspan> }</text></g>
<g class="p5" opacity="0"><text class="m code" x="368" y="118" font-size="14">{ op: <tspan class="str">'replace'</tspan>,</text><text class="m code" x="384" y="142" font-size="14">path: <tspan class="str">'/count'</tspan>,</text><text class="m code" x="384" y="166" font-size="14">value: <tspan class="str">5</tspan> }</text></g>
<text class="m hint" x="368" y="206">send it, log it, applyPatch it</text>
<rect class="ring fp" x="348" y="52" width="272" height="176" rx="15" opacity="0"/>
<!-- snapshots -->
<text class="m hint" x="24" y="262">onSnapshot · history</text>
<line class="ln" x1="40" y1="300" x2="600" y2="300"/>
<path class="ember ts" d="M300 224 C 300 270, 400 262, 400 292"/>
<circle class="dot" cx="80" cy="300" r="8"/><text class="m lab" x="80" y="332" text-anchor="middle">{ count: 4 }</text>
<circle class="dot" cx="240" cy="300" r="8"/><text class="m lab" x="240" y="332" text-anchor="middle">{ count: 5 }</text>
<g class="s2" opacity="0"><circle class="dot" cx="400" cy="300" r="8"/><text class="m lab" x="400" y="332" text-anchor="middle">{ count: 6 }</text></g>
<circle class="ring at1" cx="240" cy="300" r="14"/>
<circle class="ring at2" cx="400" cy="300" r="14" opacity="0"/>
<circle class="ring pq-statetree-rm" cx="400" cy="300" r="14"/>
<text class="m code c1" x="24" y="380" font-size="14">counter.<tspan class="fn">increment</tspan>()</text>
<text class="m code c2" x="24" y="380" font-size="14" opacity="0"><tspan class="fn">applySnapshot</tspan>(counter, { count: <tspan class="str">5</tspan> })</text>
<text class="m hint" x="616" y="380" text-anchor="end">undo is a snapshot</text>
