<svg xmlns="http://www.w3.org/2000/svg" class="pxa pq-statetree" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="pq-statetree-t pq-statetree-d" fill="none">
<title id="pq-statetree-t">Every action emits a patch and a snapshot; undo applies one back</title>
<desc id="pq-statetree-d">A Counter model created with count 5. counter.increment() sets count to 6; onPatch receives { op: 'replace', path: '/count', value: 6 } and onSnapshot adds { count: 6 } to the history. Undo calls applySnapshot(counter, { count: 5 }): the count returns to 5 and a new patch with value 5 is emitted.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}
.pq-statetree{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pq-statetree .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pq-statetree .pq-statetree-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.pq-statetree *{animation:none!important;transition:none!important}.pq-statetree .pq-statetree-rm{opacity:1}.pq-statetree .pq-statetree-am{opacity:0}}

.pq-statetree .ln{stroke:var(--px-hint);stroke-width:1.5;fill:none}
.pq-statetree .dash{stroke:var(--px-hint);stroke-width:1.5;stroke-dasharray:3 5;fill:none}
.pq-statetree .bx{fill:var(--px-card);stroke:var(--px-bar);stroke-width:1.5}
.pq-statetree .bx2{fill:var(--px-raised);stroke:var(--px-bar);stroke-width:1.5}
.pq-statetree .lab{fill:var(--px-fog);font-size:14px;letter-spacing:.04em}
.pq-statetree .eb{fill:var(--px-fog);font-size:13px;letter-spacing:.16em}
.pq-statetree .val{fill:var(--px-text);font-size:20px;font-weight:500}
.pq-statetree .big{fill:var(--px-strong);font-size:24px;font-weight:600;letter-spacing:-.02em}
.pq-statetree .code{fill:var(--px-text);font-size:15px}
.pq-statetree .kw{fill:var(--px-accent-text)} .pq-statetree .fn{fill:var(--px-link)} .pq-statetree .str{fill:var(--px-warm)} .pq-statetree .ty{fill:var(--px-violet)}
.pq-statetree .dim{fill:var(--px-fog)}
.pq-statetree .hint{fill:var(--px-hint);font-size:13px}
.pq-statetree .ember{stroke:url(#pq-statetree-egu);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:36 900;fill:none}
.pq-statetree .emberS{stroke:url(#pq-statetree-egu);stroke-width:2.5;stroke-linecap:round;fill:none}
.pq-statetree .ring{fill:none;stroke:var(--px-accent);stroke-width:2}
.pq-statetree .ok{fill:var(--px-ok)} .pq-statetree .warm{fill:var(--px-warm)} .pq-statetree .hot{fill:var(--px-accent)} .pq-statetree .errF{fill:var(--px-err)}
.pq-statetree .okT{fill:var(--px-ok)} .pq-statetree .warmT{fill:var(--px-warm)} .pq-statetree .hotT{fill:var(--px-accent-text)} .pq-statetree .errT{fill:var(--px-err)}
.pq-statetree .okS{stroke:var(--px-ok)} .pq-statetree .errS{stroke:var(--px-err)}
.pq-statetree .gfill{fill:url(#pq-statetree-eg)}
@media (prefers-reduced-motion: reduce){.pq-statetree .ember{opacity:0}}

.pq-statetree .dot{fill:var(--px-card);stroke:var(--px-fog);stroke-width:1.5}
