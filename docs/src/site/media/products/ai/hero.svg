<svg xmlns="http://www.w3.org/2000/svg" class="pxa pq-ai" viewBox="0 0 640 336" width="640" height="336" role="img" aria-labelledby="pq-ai-t pq-ai-d" fill="none">
<title id="pq-ai-t">The Pyreon MCP server catches a destructured-props bug and confirms the fix</title>
<desc id="pq-ai-d">A real transcript of the Pyreon MCP validate tool: on a todo component it finds 1 issue, props-destructured on line 6, explains that destructuring props captures the values once, shows the current signature and the fix (read props.x directly); after the fix, validate reports no issues found.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}
.pq-ai{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pq-ai .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pq-ai .pq-ai-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.pq-ai *{animation:none!important;transition:none!important}.pq-ai .pq-ai-rm{opacity:1}.pq-ai .pq-ai-am{opacity:0}}

.pq-ai .tw{fill:var(--px-card);stroke:var(--px-bar);stroke-width:1.5}
.pq-ai .tb{fill:var(--px-raised)}
.pq-ai .tt{fill:var(--px-fog);font-size:12px;letter-spacing:.06em}
.pq-ai .ln{font-size:13px;white-space:pre}
.pq-ai .c-cmd{fill:var(--px-strong)} .pq-ai .c-dim{fill:var(--px-fog)} .pq-ai .c-txt{fill:var(--px-mist)}
.pq-ai .c-ok{fill:var(--px-ok)} .pq-ai .c-hot{fill:var(--px-accent-text)} .pq-ai .c-warm{fill:var(--px-warm)} .pq-ai .c-link{fill:var(--px-link)}
.pq-ai .c-pr{fill:var(--px-link)}
@keyframes pq-ai-in{from{opacity:0}to{opacity:1}}
@keyframes pq-ai-ul{0%{stroke-dashoffset:var(--len);opacity:0}1%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
@keyframes pq-ai-pulse{0%{opacity:0}40%{opacity:.9}100%{opacity:0}}
.pq-ai .rv{animation:pq-ai-in 160ms ease-out both}
.pq-ai .ul{stroke:var(--px-accent);stroke-width:2.5;stroke-linecap:round}
.pq-ai .ulA{animation:pq-ai-ul 200ms cubic-bezier(.2,.7,.3,1) 1075ms both}
.pq-ai .glow{fill:var(--px-accent);animation:pq-ai-pulse 200ms ease-out 1075ms both;opacity:0}
.pq-ai .cap{fill:var(--px-hint);font-size:12.5px}
</style>
<defs><linearGradient id="pq-ai-eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pq-ai-egu" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pq-ai-egv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pq-ai-egd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient></defs>
<rect class="tw" x="16" y="14" width="608" height="288" rx="14"/>
<path class="tb" d="M17 48 V28 a13 13 0 0 1 13 -13 H610 a13 13 0 0 1 13 13 V48 Z"/>
<circle cx="36" cy="32" r="4.5" style="fill:var(--px-bar)"/><circle cx="51" cy="32" r="4.5" style="fill:var(--px-bar)"/><circle cx="66" cy="32" r="4.5" style="fill:var(--px-bar)"/>
<text class="m tt" x="320" y="36" text-anchor="middle">assistant ↔ pyreon MCP</text>
<text class="m ln rv" x="34" y="66" style="animation-delay:150ms"><tspan class="c-pr">→ </tspan><tspan class="c-cmd">validate</tspan><tspan class="c-dim">  pyreon MCP · Todos.tsx</tspan></text>
<text class="m ln rv" x="34" y="87" style="animation-delay:225ms"><tspan class="c-txt">Found 1 issue:</tspan></text>
<text class="m ln rv" x="34" y="108" style="animation-delay:300ms"><tspan class="c-txt">1. </tspan><tspan class="c-hot">props-destructured</tspan><tspan class="c-txt"> (line 6)</tspan></text>
<rect class="glow" x="51.4" y="92" width="152.4" height="23" rx="5"/>
<line class="ul ulA" x1="57.4" y1="113" x2="197.8" y2="113" style="--len:140.4;stroke-dasharray:140.4"/>
<text class="m ln rv" x="34" y="129" style="animation-delay:375ms"><tspan class="c-dim">   Destructuring props at the component signature captures</tspan></text>
<text class="m ln rv" x="34" y="150" style="animation-delay:450ms"><tspan class="c-dim">   the values ONCE during setup …</tspan></text>
<text class="m ln rv" x="34" y="171" style="animation-delay:525ms"><tspan class="c-dim">   Current: </tspan><tspan class="c-txt">{ todo, onToggle, onRemove }: { … }</tspan></text>
<text class="m ln rv" x="34" y="192" style="animation-delay:600ms"><tspan class="c-dim">   Fix: </tspan><tspan class="c-ok">(props: Props) =&gt; /* read props.x directly */</tspan></text>
<text class="m ln rv" x="34" y="213" style="animation-delay:675ms"><tspan class="c-dim">   Auto-fixable: no</tspan></text>
<text class="m ln rv" x="34" y="234" style="animation-delay:750ms"><tspan class="c-txt"></tspan></text>
<text class="m ln rv" x="34" y="255" style="animation-delay:825ms"><tspan class="c-pr">→ </tspan><tspan class="c-cmd">validate</tspan><tspan class="c-dim">  pyreon MCP · Todos.tsx (fixed)</tspan></text>
<text class="m ln rv" x="34" y="276" style="animation-delay:900ms"><tspan class="c-ok">✓ </tspan><tspan class="c-txt">No issues found. The code follows Pyreon patterns correctly.</tspan></text>
<text class="m cap" x="20" y="326">real tool output · the server makes no network calls</text>
</svg>
