<svg xmlns="http://www.w3.org/2000/svg" class="pxa pq-auth" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="pq-auth-t pq-auth-d" fill="none">
<title id="pq-auth-t">useOidc signs in through PKCE, state, nonce and token checks</title>
<desc id="pq-auth-d">auth.signIn() runs five steps: authorization request with S256 PKCE, state and nonce; the provider sign-in; the callback, where the code is scrubbed from the address bar and state is checked; the code exchange; and ID-token verification of signature, nonce and issuer. auth.status() moves from signedOut to signingIn to signedIn only after the last check. A side panel lists what is not offered at all: the implicit flow, the password grant and PKCE plain.</desc>
<style>
