<svg xmlns="http://www.w3.org/2000/svg" class="pxa pq-router" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="pq-router-t pq-router-d" fill="none">
<title id="pq-router-t">A navigation passes guard and loader before the view renders</title>
<desc id="pq-router-d">The address bar changes from / to /user/42. The route /user/:id matches, its beforeEnter guard passes, its loader runs, and the view renders with useParams() typed as { id: string } holding '42' and its loader data ready. Then the address returns to / and the home route renders.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}
.pq-router{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pq-router .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pq-router .pq-router-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.pq-router *{animation:none!important;transition:none!important}.pq-router .pq-router-rm{opacity:1}.pq-router .pq-router-am{opacity:0}}

.pq-router .ln{stroke:var(--px-hint);stroke-width:1.5;fill:none}
.pq-router .dash{stroke:var(--px-hint);stroke-width:1.5;stroke-dasharray:3 5;fill:none}
.pq-router .bx{fill:var(--px-card);stroke:var(--px-bar);stroke-width:1.5}
.pq-router .bx2{fill:var(--px-raised);stroke:var(--px-bar);stroke-width:1.5}
.pq-router .lab{fill:var(--px-fog);font-size:14px;letter-spacing:.04em}
.pq-router .eb{fill:var(--px-fog);font-size:13px;letter-spacing:.16em}
.pq-router .val{fill:var(--px-text);font-size:20px;font-weight:500}
.pq-router .big{fill:var(--px-strong);font-size:24px;font-weight:600;letter-spacing:-.02em}
.pq-router .code{fill:var(--px-text);font-size:15px}
.pq-router .kw{fill:var(--px-accent-text)} .pq-router .fn{fill:var(--px-link)} .pq-router .str{fill:var(--px-warm)} .pq-router .ty{fill:var(--px-violet)}
.pq-router .dim{fill:var(--px-fog)}
.pq-router .hint{fill:var(--px-hint);font-size:13px}
.pq-router .ember{stroke:url(#pq-router-egu);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:36 900;fill:none}
.pq-router .emberS{stroke:url(#pq-router-egu);stroke-width:2.5;stroke-linecap:round;fill:none}
.pq-router .ring{fill:none;stroke:var(--px-accent);stroke-width:2}
.pq-router .ok{fill:var(--px-ok)} .pq-router .warm{fill:var(--px-warm)} .pq-router .hot{fill:var(--px-accent)} .pq-router .errF{fill:var(--px-err)}
.pq-router .okT{fill:var(--px-ok)} .pq-router .warmT{fill:var(--px-warm)} .pq-router .hotT{fill:var(--px-accent-text)} .pq-router .errT{fill:var(--px-err)}
.pq-router .okS{stroke:var(--px-ok)} .pq-router .errS{stroke:var(--px-err)}
.pq-router .gfill{fill:url(#pq-router-eg)}
@media (prefers-reduced-motion: reduce){.pq-router .ember{opacity:0}}

@keyframes pq-router-u1{0.0000%{opacity:1;animation-timing-function:step-end}11.9048%{opacity:0;animation-timing-function:step-end}61.9048%{opacity:1;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-router-u2{0.0000%{opacity:0;animation-timing-function:step-end}11.9048%{opacity:1;animation-timing-function:step-end}61.9048%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-router-m2{0.0000%{opacity:0;animation-timing-function:step-end}14.8810%{opacity:1;animation-timing-function:step-end}61.9048%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-router-m1{0.0000%{opacity:1;animation-timing-function:step-end}14.8810%{opacity:0;animation-timing-function:step-end}64.2857%{opacity:1;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-router-ok{0.0000%{opacity:0;animation-timing-function:step-end}19.2857%{opacity:1;animation-timing-function:step-end}61.9048%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-router-ld{0.0000%{opacity:0;animation-timing-function:step-end}22.7381%{opacity:1;animation-timing-function:step-end}61.9048%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-router-v2{0.0000%{opacity:0;animation-timing-function:step-end}24.4048%{opacity:1;animation-timing-function:step-end}61.9048%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-router-v1{0.0000%{opacity:1;animation-timing-function:step-end}24.4048%{opacity:0;animation-timing-function:step-end}64.2857%{opacity:1;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-router-e1{0%{stroke-dashoffset:36;opacity:0}11.9048%{stroke-dashoffset:36;opacity:1}14.2857%{stroke-dashoffset:-120;opacity:1}14.2976%{stroke-dashoffset:36;opacity:0}100%{stroke-dashoffset:36;opacity:0}}
@keyframes pq-router-e2{0%{stroke-dashoffset:36;opacity:0}15.1190%{stroke-dashoffset:36;opacity:1}17.5000%{stroke-dashoffset:-120;opacity:1}17.5119%{stroke-dashoffset:36;opacity:0}100%{stroke-dashoffset:36;opacity:0}}
@keyframes pq-router-e3{0%{stroke-dashoffset:36;opacity:0}18.0952%{stroke-dashoffset:36;opacity:1}20.4762%{stroke-dashoffset:-80;opacity:1}20.4881%{stroke-dashoffset:36;opacity:0}100%{stroke-dashoffset:36;opacity:0}}
@keyframes pq-router-e4{0%{stroke-dashoffset:36;opacity:0}21.3095%{stroke-dashoffset:36;opacity:1}23.6905%{stroke-dashoffset:-80;opacity:1}23.7024%{stroke-dashoffset:36;opacity:0}100%{stroke-dashoffset:36;opacity:0}}
@keyframes pq-router-fv{0%{opacity:0}24.4048%{opacity:0}25.3571%{opacity:1}26.7857%{opacity:0}100%{opacity:0}}
.pq-router .u1{animation:pq-router-u1 8400ms linear infinite}
.pq-router .u2{animation:pq-router-u2 8400ms linear infinite}
.pq-router .m1{animation:pq-router-m1 8400ms linear infinite}
.pq-router .m2{animation:pq-router-m2 8400ms linear infinite}
.pq-router .okk{animation:pq-router-ok 8400ms linear infinite}
.pq-router .ld{animation:pq-router-ld 8400ms linear infinite}
.pq-router .v1{animation:pq-router-v1 8400ms linear infinite}
.pq-router .v2{animation:pq-router-v2 8400ms linear infinite}
.pq-router .e1{animation:pq-router-e1 8400ms linear infinite}
.pq-router .e2{animation:pq-router-e2 8400ms linear infinite}
.pq-router .e3{animation:pq-router-e3 8400ms linear infinite}
.pq-router .e4{animation:pq-router-e4 8400ms linear infinite}
.pq-router .fv{animation:pq-router-fv 8400ms linear infinite}
@media (prefers-reduced-motion: reduce){.pq-router .u1,.pq-router .m1,.pq-router .v1{opacity:0}.pq-router .u2,.pq-router .m2,.pq-router .okk,.pq-router .ld,.pq-router .v2{opacity:1}}
</style>
<defs><linearGradient id="pq-router-eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pq-router-egu" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pq-router-egv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pq-router-egd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient></defs>

<text class="m eb" x="24" y="34">@PYREON/ROUTER · ONE NAVIGATION</text>
<!-- address bar -->
<rect class="bx2" x="24" y="52" width="592" height="40" rx="20"/>
<circle cx="46" cy="72" r="5" style="fill:var(--px-hint)"/>
<text class="m code u1" x="62" y="77">example.com/</text>
<text class="m code u2" x="62" y="77" opacity="0">example.com/user/<tspan class="str">42</tspan></text>
<text class="m hint" x="600" y="77" text-anchor="end">router.push()</text>
<path class="ln" d="M150 92 L150 120"/><path class="ember e1" d="M150 92 L150 120"/>
<!-- route table -->
<rect class="bx" x="24" y="120" width="246" height="186" rx="12"/>
<text class="m hint" x="40" y="146">routes</text>
<text class="m code m1" x="40" y="180" style="fill:var(--px-text)">'/'</text><text class="m code m2" x="40" y="180" opacity="0" style="fill:var(--px-fog)">'/'</text>
<text class="m code m1" x="40" y="214" style="fill:var(--px-fog)">'/user/:id'</text><text class="m code m2" x="40" y="214" opacity="0" style="fill:var(--px-text)">'/user/:id'</text>
<text class="m code dim" x="40" y="248">'/settings'</text>
<text class="m code dim" x="40" y="282">'*' notFound</text>
<rect class="ring m2" x="32" y="194" width="140" height="28" rx="6" opacity="0"/>
<rect class="ring pq-router-rm" x="32" y="194" width="140" height="28" rx="6"/>
<!-- pipeline -->
<path class="ln" d="M172 208 C 236 208, 236 148, 300 148"/><path class="ember e2" d="M172 208 C 236 208, 236 148, 300 148"/>
<rect class="bx" x="300" y="120" width="150" height="56" rx="10"/>
<text class="m lab" x="314" y="143" style="fill:var(--px-text)">beforeEnter</text><text class="m hint" x="314" y="163">guard</text>
<text class="m okT okk" x="436" y="143" text-anchor="end" opacity="0">✓</text>
<path class="ln" d="M375 176 L375 196"/><path class="ember e3" d="M375 176 L375 196"/>
<rect class="bx" x="300" y="196" width="150" height="56" rx="10"/>
<text class="m lab" x="314" y="219" style="fill:var(--px-text)">loader</text><text class="m hint" x="314" y="239">before render</text>
<text class="m okT ld" x="436" y="219" text-anchor="end" opacity="0">✓</text>
<path class="ln" d="M375 252 L375 272"/><path class="ember e4" d="M375 252 L375 272"/>
<path class="emberS pq-router-rm" d="M172 208 C 236 208, 236 148, 300 148 M375 176 L375 196 M375 252 L375 272"/>
<rect class="bx" x="300" y="272" width="150" height="34" rx="10"/>
<text class="m lab" x="314" y="294" style="fill:var(--px-text)">view transition</text>
<path class="ln" d="M450 289 L476 289"/>
<!-- view -->
<rect class="bx" x="476" y="120" width="140" height="186" rx="12"/>
<rect class="ring fv" x="472" y="116" width="148" height="194" rx="15" opacity="0"/>
<g class="v1"><text class="m hint" x="490" y="146">&lt;Home /&gt;</text>
<rect x="490" y="168" width="96" height="10" rx="5" style="fill:var(--px-line2)"/><rect x="490" y="190" width="70" height="10" rx="5" style="fill:var(--px-line2)"/></g>
<g class="v2" opacity="0"><text class="m hint" x="490" y="146">&lt;User /&gt;</text>
<text class="m lab" x="488" y="178" font-size="13">useParams()</text>
<text class="m code" x="490" y="202" font-size="14">{ id: <tspan class="str">'42'</tspan> }</text>
<text class="m lab" x="488" y="236" font-size="12">useLoaderData()</text>
<text class="m code" x="490" y="260" font-size="14">{ name: … }</text></g>
<text class="m hint" x="24" y="344">'/user/:id' → params: { id: string }, typed from the path</text>
<text class="m hint" x="24" y="372">await router.push() resolves once the new view is in place</text>
</svg>
