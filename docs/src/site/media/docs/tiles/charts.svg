<svg xmlns="http://www.w3.org/2000/svg" class="pxa pdt-charts" viewBox="0 0 320 180" width="320" height="180" role="img" aria-labelledby="pdt-charts-t pdt-charts-d" fill="none">
<title id="pdt-charts-t">Charts: illustration</title>
<desc id="pdt-charts-d">A line chart with axes and a dense series drawn in the ember gradient; one point is ringed.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#6E6A7A;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#E40C70;--px-g2:#E84A0F;--px-g3:#E0A510;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#6E6A7A;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#E40C70;--px-g2:#E84A0F;--px-g3:#E0A510;--px-glow:rgba(232,74,15,.10)}
.pdt-charts{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pdt-charts .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pdt-charts .pdt-charts-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.pdt-charts *{animation:none!important;transition:none!important}.pdt-charts .pdt-charts-rm{opacity:1}.pdt-charts .pdt-charts-am{opacity:0}}

.pdt-charts .s1{stroke:var(--px-mist);stroke-width:1.5}.pdt-charts .s2{stroke:var(--px-fog);stroke-width:1.5}.pdt-charts .s3{stroke:var(--px-hint);stroke-width:1.5}
.pdt-charts .bx{fill:var(--px-card);stroke:var(--px-bar);stroke-width:1.5}
.pdt-charts .e{stroke:var(--px-accent);stroke-width:1.75}.pdt-charts .eg{stroke:url(#pdt-charts-eg);stroke-width:2.25}.pdt-charts .ef{fill:var(--px-accent)}.pdt-charts .et{fill:var(--px-accent-text);font-size:11px}.pdt-charts .eh{stroke:var(--px-accent);stroke-width:2.25}
.pdt-charts .t1{fill:var(--px-text);font-size:12px}.pdt-charts .t2{fill:var(--px-fog);font-size:11px}.pdt-charts .t3{fill:var(--px-hint);font-size:11px}
.pdt-charts .fc{fill:var(--px-card)}.pdt-charts .fb{fill:var(--px-bg)}
</style>
<defs><linearGradient id="pdt-charts-eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pdt-charts-egv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pdt-charts-egd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient></defs>
<path class="s3" d="M40 20V140H300"/><line x1="40" y1="50" x2="300" y2="50" style="stroke:var(--px-line2)" stroke-width="1"/><line x1="40" y1="80" x2="300" y2="80" style="stroke:var(--px-line2)" stroke-width="1"/><line x1="40" y1="110" x2="300" y2="110" style="stroke:var(--px-line2)" stroke-width="1"/>
