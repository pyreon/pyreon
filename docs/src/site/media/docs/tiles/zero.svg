<svg xmlns="http://www.w3.org/2000/svg" class="pxa pdt-zero" viewBox="0 0 320 180" width="320" height="180" role="img" aria-labelledby="pdt-zero-t pdt-zero-d" fill="none">
<title id="pdt-zero-t">Zero: illustration</title>
<desc id="pdt-zero-d">A route table: four routes each with its render mode chip, SSG, ISR, SSR and SPA; the SSR row is lit in ember.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#6E6A7A;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#E40C70;--px-g2:#E84A0F;--px-g3:#E0A510;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#6E6A7A;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#E40C70;--px-g2:#E84A0F;--px-g3:#E0A510;--px-glow:rgba(232,74,15,.10)}
.pdt-zero{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pdt-zero .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pdt-zero .pdt-zero-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.pdt-zero *{animation:none!important;transition:none!important}.pdt-zero .pdt-zero-rm{opacity:1}.pdt-zero .pdt-zero-am{opacity:0}}

.pdt-zero .s1{stroke:var(--px-mist);stroke-width:1.5}.pdt-zero .s2{stroke:var(--px-fog);stroke-width:1.5}.pdt-zero .s3{stroke:var(--px-hint);stroke-width:1.5}
.pdt-zero .bx{fill:var(--px-card);stroke:var(--px-bar);stroke-width:1.5}
.pdt-zero .e{stroke:var(--px-accent);stroke-width:1.75}.pdt-zero .eg{stroke:url(#pdt-zero-eg);stroke-width:2.25}.pdt-zero .ef{fill:var(--px-accent)}.pdt-zero .et{fill:var(--px-accent-text);font-size:11px}.pdt-zero .eh{stroke:var(--px-accent);stroke-width:2.25}
.pdt-zero .t1{fill:var(--px-text);font-size:12px}.pdt-zero .t2{fill:var(--px-fog);font-size:11px}.pdt-zero .t3{fill:var(--px-hint);font-size:11px}
.pdt-zero .fc{fill:var(--px-card)}.pdt-zero .fb{fill:var(--px-bg)}
</style>
<defs><linearGradient id="pdt-zero-eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pdt-zero-egv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pdt-zero-egd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient></defs>
<rect class="bx" x="24" y="22" width="272" height="30" rx="8"/>
<text class="m t1" x="40" y="42">/</text>
<rect x="232" y="29" width="50" height="16" rx="8" style="fill:none;stroke:var(--px-bar);stroke-width:1.25"/>
<text class="m t2" x="257" y="41" text-anchor="middle" font-size="10">SSG</text><rect class="bx" x="24" y="60" width="272" height="30" rx="8"/>
<text class="m t1" x="40" y="80">/blog/[slug]</text>
<rect x="232" y="67" width="50" height="16" rx="8" style="fill:none;stroke:var(--px-bar);stroke-width:1.25"/>
<text class="m t2" x="257" y="79" text-anchor="middle" font-size="10">ISR</text><rect class="bx" x="24" y="98" width="272" height="30" rx="8" style="stroke:var(--px-accent)"/>
<text class="m t1" x="40" y="118">/account</text>
<rect x="232" y="105" width="50" height="16" rx="8" style="fill:none;stroke:var(--px-accent);stroke-width:1.25"/>
<text class="m et" x="257" y="117" text-anchor="middle" font-size="10">SSR</text><rect class="bx" x="24" y="136" width="272" height="30" rx="8"/>
<text class="m t1" x="40" y="156">/app/*</text>
<rect x="232" y="143" width="50" height="16" rx="8" style="fill:none;stroke:var(--px-bar);stroke-width:1.25"/>
<text class="m t2" x="257" y="155" text-anchor="middle" font-size="10">SPA</text>
</svg>
