<svg xmlns="http://www.w3.org/2000/svg" class="pxa pdt-i18n" viewBox="0 0 320 180" width="320" height="180" role="img" aria-labelledby="pdt-i18n-t pdt-i18n-d" fill="none">
<title id="pdt-i18n-t">i18n: illustration</title>
<desc id="pdt-i18n-d">One t('items', { count }) call resolving in English and Czech plural forms; the Czech row, the active locale, has an ember underline.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#6E6A7A;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#E40C70;--px-g2:#E84A0F;--px-g3:#E0A510;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#6E6A7A;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#E40C70;--px-g2:#E84A0F;--px-g3:#E0A510;--px-glow:rgba(232,74,15,.10)}
.pdt-i18n{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pdt-i18n .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pdt-i18n .pdt-i18n-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.pdt-i18n *{animation:none!important;transition:none!important}.pdt-i18n .pdt-i18n-rm{opacity:1}.pdt-i18n .pdt-i18n-am{opacity:0}}

.pdt-i18n .s1{stroke:var(--px-mist);stroke-width:1.5}.pdt-i18n .s2{stroke:var(--px-fog);stroke-width:1.5}.pdt-i18n .s3{stroke:var(--px-hint);stroke-width:1.5}
.pdt-i18n .bx{fill:var(--px-card);stroke:var(--px-bar);stroke-width:1.5}
.pdt-i18n .e{stroke:var(--px-accent);stroke-width:1.75}.pdt-i18n .eg{stroke:url(#pdt-i18n-eg);stroke-width:2.25}.pdt-i18n .ef{fill:var(--px-accent)}.pdt-i18n .et{fill:var(--px-accent-text);font-size:11px}.pdt-i18n .eh{stroke:var(--px-accent);stroke-width:2.25}
.pdt-i18n .t1{fill:var(--px-text);font-size:12px}.pdt-i18n .t2{fill:var(--px-fog);font-size:11px}.pdt-i18n .t3{fill:var(--px-hint);font-size:11px}
.pdt-i18n .fc{fill:var(--px-card)}.pdt-i18n .fb{fill:var(--px-bg)}
</style>
<defs><linearGradient id="pdt-i18n-eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pdt-i18n-egv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pdt-i18n-egd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient></defs>
<text class="m t1" x="24" y="34">t('items', { count })</text><text class="m t2" x="24" y="74">en</text><text class="t2" x="62" y="74" font-size="13">1 item</text><text class="t2" x="148" y="74" font-size="13">2 items</text><text class="t2" x="234" y="74" font-size="13">5 items</text><text class="m t2" x="24" y="120">cs</text><text class="t1" x="62" y="120" font-size="13">1 položka</text><text class="t1" x="148" y="120" font-size="13">2 položky</text><text class="t1" x="234" y="120" font-size="13">5 položek</text><line class="eh" x1="62" y1="130" x2="300" y2="130"/><text class="m t3" x="24" y="166">one, few, many: per language</text>
</svg>
