<svg xmlns="http://www.w3.org/2000/svg" class="pxa pdt-reactivity" viewBox="0 0 320 180" width="320" height="180" role="img" aria-labelledby="pdt-reactivity-t pdt-reactivity-d" fill="none">
<title id="pdt-reactivity-t">Reactivity: illustration</title>
<desc id="pdt-reactivity-d">A signal graph: count feeds double and class, both feed Badge; the path count to double to Badge is lit in ember, class is skipped.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}
.pdt-reactivity{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pdt-reactivity .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pdt-reactivity .pdt-reactivity-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.pdt-reactivity *{animation:none!important;transition:none!important}.pdt-reactivity .pdt-reactivity-rm{opacity:1}.pdt-reactivity .pdt-reactivity-am{opacity:0}}

.pdt-reactivity .s1{stroke:var(--px-mist);stroke-width:1.5}.pdt-reactivity .s2{stroke:var(--px-fog);stroke-width:1.5}.pdt-reactivity .s3{stroke:var(--px-hint);stroke-width:1.5}
.pdt-reactivity .bx{fill:var(--px-card);stroke:var(--px-bar);stroke-width:1.5}
.pdt-reactivity .e{stroke:var(--px-accent);stroke-width:1.75}.pdt-reactivity .eg{stroke:url(#pdt-reactivity-eg);stroke-width:2.25}.pdt-reactivity .ef{fill:var(--px-accent)}.pdt-reactivity .et{fill:var(--px-accent-text);font-size:11px}.pdt-reactivity .eh{stroke:var(--px-accent);stroke-width:2.25}
.pdt-reactivity .t1{fill:var(--px-text);font-size:12px}.pdt-reactivity .t2{fill:var(--px-fog);font-size:11px}.pdt-reactivity .t3{fill:var(--px-hint);font-size:11px}
.pdt-reactivity .fc{fill:var(--px-card)}.pdt-reactivity .fb{fill:var(--px-bg)}
</style>
<defs><linearGradient id="pdt-reactivity-eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pdt-reactivity-egu" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="320" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pdt-reactivity-egv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pdt-reactivity-egd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient></defs>
<line class="s3" x1="52" y1="80" x2="160" y2="124"/><line class="s3" x1="160" y1="124" x2="268" y2="80"/><line class="eg" x1="52" y1="80" x2="160" y2="40"/><line class="eg" x1="160" y1="40" x2="268" y2="80"/><circle cx="52" cy="80" r="8" class="ef"/><text class="m t1" x="52" y="106" text-anchor="middle">count</text><circle cx="160" cy="40" r="8" class="ef"/><text class="m t1" x="160" y="24" text-anchor="middle">double</text><circle cx="160" cy="124" r="8" class="s3 fc"/><text class="m t3" x="160" y="150" text-anchor="middle">class</text><circle cx="268" cy="80" r="8" class="ef"/><text class="m t1" x="268" y="106" text-anchor="middle">&lt;Badge&gt;</text>
<text class="m t3" x="160" y="166" text-anchor="middle">skipped: class does not read count</text>
</svg>
