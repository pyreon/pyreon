<svg xmlns="http://www.w3.org/2000/svg" class="pxa pdt-validation" viewBox="0 0 320 180" width="320" height="180" role="img" aria-labelledby="pdt-validation-t pdt-validation-d" fill="none">
<title id="pdt-validation-t">Validation: illustration</title>
<desc id="pdt-validation-d">A value passes through a schema chain of string, email and min-length checks, each marked passed, and comes out typed.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#6E6A7A;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#E40C70;--px-g2:#E84A0F;--px-g3:#E0A510;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#6E6A7A;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#E40C70;--px-g2:#E84A0F;--px-g3:#E0A510;--px-glow:rgba(232,74,15,.10)}
.pdt-validation{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pdt-validation .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pdt-validation .pdt-validation-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.pdt-validation *{animation:none!important;transition:none!important}.pdt-validation .pdt-validation-rm{opacity:1}.pdt-validation .pdt-validation-am{opacity:0}}

.pdt-validation .s1{stroke:var(--px-mist);stroke-width:1.5}.pdt-validation .s2{stroke:var(--px-fog);stroke-width:1.5}.pdt-validation .s3{stroke:var(--px-hint);stroke-width:1.5}
.pdt-validation .bx{fill:var(--px-card);stroke:var(--px-bar);stroke-width:1.5}
.pdt-validation .e{stroke:var(--px-accent);stroke-width:1.75}.pdt-validation .eg{stroke:url(#pdt-validation-eg);stroke-width:2.25}.pdt-validation .ef{fill:var(--px-accent)}.pdt-validation .et{fill:var(--px-accent-text);font-size:11px}.pdt-validation .eh{stroke:var(--px-accent);stroke-width:2.25}
.pdt-validation .t1{fill:var(--px-text);font-size:12px}.pdt-validation .t2{fill:var(--px-fog);font-size:11px}.pdt-validation .t3{fill:var(--px-hint);font-size:11px}
.pdt-validation .fc{fill:var(--px-card)}.pdt-validation .fb{fill:var(--px-bg)}
</style>
<defs><linearGradient id="pdt-validation-eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pdt-validation-egv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pdt-validation-egd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient></defs>
<line class="s2" x1="34" y1="80" x2="256" y2="80"/><circle class="s1 fc" cx="34" cy="80" r="7"/><text class="m t2" x="34" y="62" text-anchor="middle">input</text><rect class="bx" x="78" y="64" width="60" height="32" rx="8"/><path d="M102 80L106 84L114 75" style="stroke:var(--px-ok)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><text class="m t2" x="108" y="116" text-anchor="middle">string()</text><rect class="bx" x="152" y="64" width="60" height="32" rx="8"/><path d="M176 80L180 84L188 75" style="stroke:var(--px-ok)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><text class="m t2" x="182" y="116" text-anchor="middle">.email()</text><rect class="bx" x="226" y="64" width="60" height="32" rx="8"/><path d="M250 80L254 84L262 75" style="stroke:var(--px-ok)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><text class="m t2" x="256" y="116" text-anchor="middle">.min(8)</text><line class="eh" x1="286" y1="80" x2="300" y2="80"/><circle class="ef" cx="300" cy="80" r="4"/><text class="m t1" x="294" y="146" text-anchor="end">typed: Email</text>
</svg>
