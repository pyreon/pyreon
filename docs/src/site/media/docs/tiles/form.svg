<svg xmlns="http://www.w3.org/2000/svg" class="pxa pdt-form" viewBox="0 0 320 180" width="320" height="180" role="img" aria-labelledby="pdt-form-t pdt-form-d" fill="none">
<title id="pdt-form-t">Forms: illustration</title>
<desc id="pdt-form-d">Twelve form fields in a grid; one field has an ember underline and a caret where someone is typing, the other eleven stay unlit.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}
.pdt-form{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pdt-form .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pdt-form .pdt-form-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.pdt-form *{animation:none!important;transition:none!important}.pdt-form .pdt-form-rm{opacity:1}.pdt-form .pdt-form-am{opacity:0}}

.pdt-form .s1{stroke:var(--px-mist);stroke-width:1.5}.pdt-form .s2{stroke:var(--px-fog);stroke-width:1.5}.pdt-form .s3{stroke:var(--px-hint);stroke-width:1.5}
.pdt-form .bx{fill:var(--px-card);stroke:var(--px-bar);stroke-width:1.5}
.pdt-form .e{stroke:var(--px-accent);stroke-width:1.75}.pdt-form .eg{stroke:url(#pdt-form-eg);stroke-width:2.25}.pdt-form .ef{fill:var(--px-accent)}.pdt-form .et{fill:var(--px-accent-text);font-size:11px}.pdt-form .eh{stroke:var(--px-accent);stroke-width:2.25}
.pdt-form .t1{fill:var(--px-text);font-size:12px}.pdt-form .t2{fill:var(--px-fog);font-size:11px}.pdt-form .t3{fill:var(--px-hint);font-size:11px}
.pdt-form .fc{fill:var(--px-card)}.pdt-form .fb{fill:var(--px-bg)}
</style>
<defs><linearGradient id="pdt-form-eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pdt-form-egu" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="320" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pdt-form-egv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pdt-form-egd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient></defs>
<rect class="bx" x="24" y="18" width="84" height="28" rx="6"/><line class="s3" x1="34" y1="32" x2="62" y2="32"/><rect class="bx" x="118" y="18" width="84" height="28" rx="6"/><line class="s3" x1="128" y1="32" x2="156" y2="32"/><rect class="bx" x="212" y="18" width="84" height="28" rx="6"/><line class="s3" x1="222" y1="32" x2="250" y2="32"/><rect class="bx" x="24" y="56" width="84" height="28" rx="6"/><line class="s3" x1="34" y1="70" x2="62" y2="70"/><rect class="bx" x="118" y="56" width="84" height="28" rx="6"/><line class="s3" x1="128" y1="70" x2="156" y2="70"/><line class="eh" x1="122" y1="83" x2="198" y2="83"/><line x1="164" y1="64" x2="164" y2="76" style="stroke:var(--px-text);stroke-width:1.5"/><rect class="bx" x="212" y="56" width="84" height="28" rx="6"/><line class="s3" x1="222" y1="70" x2="250" y2="70"/><rect class="bx" x="24" y="94" width="84" height="28" rx="6"/><line class="s3" x1="34" y1="108" x2="62" y2="108"/><rect class="bx" x="118" y="94" width="84" height="28" rx="6"/><line class="s3" x1="128" y1="108" x2="156" y2="108"/><rect class="bx" x="212" y="94" width="84" height="28" rx="6"/><line class="s3" x1="222" y1="108" x2="250" y2="108"/><rect class="bx" x="24" y="132" width="84" height="28" rx="6"/><line class="s3" x1="34" y1="146" x2="62" y2="146"/><rect class="bx" x="118" y="132" width="84" height="28" rx="6"/><line class="s3" x1="128" y1="146" x2="156" y2="146"/><rect class="bx" x="212" y="132" width="84" height="28" rx="6"/><line class="s3" x1="222" y1="146" x2="250" y2="146"/>
</svg>
