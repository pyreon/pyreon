<svg xmlns="http://www.w3.org/2000/svg" class="pxa pdt-machine" viewBox="0 0 320 180" width="320" height="180" role="img" aria-labelledby="pdt-machine-t pdt-machine-d" fill="none">
<title id="pdt-machine-t">State Machines: illustration</title>
<desc id="pdt-machine-d">A state machine: idle, loading, success and error; the path idle to loading to success is lit, with success as the current state.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#6E6A7A;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#E40C70;--px-g2:#E84A0F;--px-g3:#E0A510;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#6E6A7A;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#E40C70;--px-g2:#E84A0F;--px-g3:#E0A510;--px-glow:rgba(232,74,15,.10)}
.pdt-machine{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pdt-machine .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pdt-machine .pdt-machine-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.pdt-machine *{animation:none!important;transition:none!important}.pdt-machine .pdt-machine-rm{opacity:1}.pdt-machine .pdt-machine-am{opacity:0}}

.pdt-machine .s1{stroke:var(--px-mist);stroke-width:1.5}.pdt-machine .s2{stroke:var(--px-fog);stroke-width:1.5}.pdt-machine .s3{stroke:var(--px-hint);stroke-width:1.5}
.pdt-machine .bx{fill:var(--px-card);stroke:var(--px-bar);stroke-width:1.5}
.pdt-machine .e{stroke:var(--px-accent);stroke-width:1.75}.pdt-machine .eg{stroke:url(#pdt-machine-eg);stroke-width:2.25}.pdt-machine .ef{fill:var(--px-accent)}.pdt-machine .et{fill:var(--px-accent-text);font-size:11px}.pdt-machine .eh{stroke:var(--px-accent);stroke-width:2.25}
.pdt-machine .t1{fill:var(--px-text);font-size:12px}.pdt-machine .t2{fill:var(--px-fog);font-size:11px}.pdt-machine .t3{fill:var(--px-hint);font-size:11px}
.pdt-machine .fc{fill:var(--px-card)}.pdt-machine .fb{fill:var(--px-bg)}
</style>
<defs><linearGradient id="pdt-machine-eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pdt-machine-egv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pdt-machine-egd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient></defs>
<path class="s2" d="M88 70H112"/><path class="eg" d="M188 64C205 60 210 46 224 42"/><path class="s3" d="M188 76C205 80 210 112 224 118" stroke-dasharray="3 3"/>
<path class="eh" d="M88 70H112"/><path d="M106 66L112 70L106 74" class="e"/><path d="M218 39L224 42L219 47" class="e"/>
<rect class="bx" x="12" y="55" width="76" height="30" rx="15"/><text class="m t2" x="50" y="74" text-anchor="middle">idle</text><rect class="bx" x="112" y="55" width="76" height="30" rx="15"/><text class="m t2" x="150" y="74" text-anchor="middle">loading</text><rect class="bx" x="224" y="25" width="76" height="30" rx="15" style="stroke:var(--px-accent)"/><text class="m et" x="262" y="44" text-anchor="middle">success</text><rect class="bx" x="224" y="105" width="76" height="30" rx="15"/><text class="m t2" x="262" y="124" text-anchor="middle">error</text>
<text class="m t3" x="100" y="58" text-anchor="middle">FETCH</text><text class="m t3" x="160" y="160">no edge, no transition</text>
</svg>
