<svg xmlns="http://www.w3.org/2000/svg" class="pxa pdt-flow" viewBox="0 0 320 180" width="320" height="180" role="img" aria-labelledby="pdt-flow-t pdt-flow-d" fill="none">
<title id="pdt-flow-t">Flow: illustration</title>
<desc id="pdt-flow-d">A node graph of four nodes joined by curved edges; one node has just been dragged and carries an ember ring, the rest stay still.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#6E6A7A;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#E40C70;--px-g2:#E84A0F;--px-g3:#E0A510;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#6E6A7A;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#E40C70;--px-g2:#E84A0F;--px-g3:#E0A510;--px-glow:rgba(232,74,15,.10)}
.pdt-flow{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pdt-flow .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pdt-flow .pdt-flow-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.pdt-flow *{animation:none!important;transition:none!important}.pdt-flow .pdt-flow-rm{opacity:1}.pdt-flow .pdt-flow-am{opacity:0}}

.pdt-flow .s1{stroke:var(--px-mist);stroke-width:1.5}.pdt-flow .s2{stroke:var(--px-fog);stroke-width:1.5}.pdt-flow .s3{stroke:var(--px-hint);stroke-width:1.5}
.pdt-flow .bx{fill:var(--px-card);stroke:var(--px-bar);stroke-width:1.5}
.pdt-flow .e{stroke:var(--px-accent);stroke-width:1.75}.pdt-flow .eg{stroke:url(#pdt-flow-eg);stroke-width:2.25}.pdt-flow .ef{fill:var(--px-accent)}.pdt-flow .et{fill:var(--px-accent-text);font-size:11px}.pdt-flow .eh{stroke:var(--px-accent);stroke-width:2.25}
.pdt-flow .t1{fill:var(--px-text);font-size:12px}.pdt-flow .t2{fill:var(--px-fog);font-size:11px}.pdt-flow .t3{fill:var(--px-hint);font-size:11px}
.pdt-flow .fc{fill:var(--px-card)}.pdt-flow .fb{fill:var(--px-bg)}
</style>
<defs><linearGradient id="pdt-flow-eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pdt-flow-egv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pdt-flow-egd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient></defs>
<path class="s2" d="M94 84C124 84,96 40,126 40"/><path class="s2" d="M94 84C124 84,96 124,126 124"/><path class="s2" d="M190 40C220 40,196 84,226 84"/><rect class="bx" x="30" y="70" width="64" height="28" rx="7"/><text class="m t2" x="62" y="88" text-anchor="middle">webhook</text><rect class="bx" x="126" y="26" width="64" height="28" rx="7"/><text class="m t2" x="158" y="44" text-anchor="middle">enrich</text><rect class="bx" x="126" y="110" width="64" height="28" rx="7" style="stroke:var(--px-accent)"/><text class="m t1" x="158" y="128" text-anchor="middle">archive</text><rect class="bx" x="226" y="70" width="64" height="28" rx="7"/><text class="m t2" x="258" y="88" text-anchor="middle">crm</text><rect x="122" y="106" width="72" height="36" rx="10" class="e" fill="none" stroke-dasharray="3 3"/><text class="m t3" x="160" y="170" text-anchor="middle">drag one node · nothing else re-renders</text>
</svg>
