.pw-ai-ready .val{fill:var(--px-text);font-size:20px;font-weight:500}
.pw-ai-ready .big{fill:var(--px-strong);font-size:24px;font-weight:600;letter-spacing:-.02em}
.pw-ai-ready .code{fill:var(--px-text);font-size:15px}
.pw-ai-ready .kw{fill:var(--px-accent-text)} .pw-ai-ready .fn{fill:var(--px-link)} .pw-ai-ready .str{fill:var(--px-warm)} .pw-ai-ready .ty{fill:var(--px-violet)}
.pw-ai-ready .dim{fill:var(--px-fog)}
.pw-ai-ready .hint{fill:var(--px-hint);font-size:13px}
.pw-ai-ready .ember{stroke:url(#pw-ai-ready-egu);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:36 900;fill:none}
.pw-ai-ready .emberS{stroke:url(#pw-ai-ready-egu);stroke-width:2.5;stroke-linecap:round;fill:none}
.pw-ai-ready .ring{fill:none;stroke:var(--px-accent);stroke-width:2}
.pw-ai-ready .ok{fill:var(--px-ok)} .pw-ai-ready .warm{fill:var(--px-warm)} .pw-ai-ready .hot{fill:var(--px-accent)} .pw-ai-ready .errF{fill:var(--px-err)}
.pw-ai-ready .okT{fill:var(--px-ok)} .pw-ai-ready .warmT{fill:var(--px-warm)} .pw-ai-ready .hotT{fill:var(--px-accent-text)} .pw-ai-ready .errT{fill:var(--px-err)}
.pw-ai-ready .okS{stroke:var(--px-ok)} .pw-ai-ready .errS{stroke:var(--px-err)}
.pw-ai-ready .gfill{fill:url(#pw-ai-ready-eg)}
@media (prefers-reduced-motion: reduce){.pw-ai-ready .ember{opacity:0}}

.pw-ai-ready .ln2{fill:var(--px-hint);font-size:13px}
.pw-ai-ready .bad{fill:var(--px-err)}
@keyframes pw-ai-ready-find{0.0000%{opacity:0;animation-timing-function:step-end}11.2500%{opacity:1;animation-timing-function:step-end}81.2500%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pw-ai-ready-wait{0.0000%{opacity:1;animation-timing-function:step-end}11.2500%{opacity:0;animation-timing-function:step-end}81.2500%{opacity:1;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pw-ai-ready-fixd{0.0000%{opacity:0;animation-timing-function:step-end}36.2500%{opacity:1;animation-timing-function:step-end}81.2500%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pw-ai-ready-fixw{0.0000%{opacity:1;animation-timing-function:step-end}36.2500%{opacity:0;animation-timing-function:step-end}81.2500%{opacity:1;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pw-ai-ready-ok{0.0000%{opacity:0;animation-timing-function:step-end}58.7500%{opacity:1;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pw-ai-ready-okw{0.0000%{opacity:1;animation-timing-function:step-end}58.7500%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pw-ai-ready-a{0%{stroke-dashoffset:40;opacity:0}7.5000%{stroke-dashoffset:40;opacity:1}11.2500%{stroke-dashoffset:-72;opacity:1}11.2625%{stroke-dashoffset:40;opacity:0}100%{stroke-dashoffset:40;opacity:0}}
@keyframes pw-ai-ready-b{0%{stroke-dashoffset:40;opacity:0}32.5000%{stroke-dashoffset:40;opacity:1}36.2500%{stroke-dashoffset:-54;opacity:1}36.2625%{stroke-dashoffset:40;opacity:0}100%{stroke-dashoffset:40;opacity:0}}
@keyframes pw-ai-ready-c{0%{stroke-dashoffset:40;opacity:0}55.0000%{stroke-dashoffset:40;opacity:1}58.7500%{stroke-dashoffset:-72;opacity:1}58.7625%{stroke-dashoffset:40;opacity:0}100%{stroke-dashoffset:40;opacity:0}}
@keyframes pw-ai-ready-d{0%{stroke-dashoffset:40;opacity:0}77.5000%{stroke-dashoffset:40;opacity:1}81.2500%{stroke-dashoffset:-54;opacity:1}81.2625%{stroke-dashoffset:40;opacity:0}100%{stroke-dashoffset:40;opacity:0}}
@keyframes pw-ai-ready-f2{0%{opacity:0}11.2500%{opacity:0}12.2500%{opacity:1}13.7500%{opacity:0}100%{opacity:0}}
