<defs><linearGradient id="pw-ai-ready-eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pw-ai-ready-egu" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="960" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pw-ai-ready-egv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pw-ai-ready-egd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient></defs>

<text class="m eb" x="24" y="34">WRITE · VALIDATE · FIX · CHECK</text>
<rect class="bx" x="24" y="52" width="420" height="180" rx="14"/>
<text class="m hint" x="40" y="78"><tspan style="fill:var(--px-accent-text)">1</tspan>  your assistant writes a draft</text>
<rect class="ring f1" x="20" y="48" width="428" height="188" rx="17" opacity="0"/>
<text class="m ln2" x="40" y="106">8</text><text class="m code" x="70" y="106" font-size="14">&lt;div&gt;</text>
<text class="m ln2" x="40" y="134">9</text><text class="m code" x="70" y="134" font-size="13">&lt;button onClick={() =&gt; <tspan class="bad">count(count() + 1)</tspan>}&gt;</text>
<text class="m ln2" x="40" y="162">10</text><text class="m code" x="70" y="162" font-size="13">&lt;<tspan class="ty">For</tspan> each={items} <tspan class="bad">key={(i) =&gt; i.id}</tspan>&gt;</text>
<text class="m hint" x="40" y="212">renders once, then never updates</text>
<rect class="bx" x="516" y="52" width="420" height="180" rx="14"/>
<text class="m hint" x="532" y="78"><tspan style="fill:var(--px-accent-text)">2</tspan>  MCP validate</text>
<rect class="ring f2" x="512" y="48" width="428" height="188" rx="17" opacity="0"/>
<text class="m lab wait" x="532" y="116">…</text>
<g class="find" opacity="0">
<text class="m lab" x="532" y="108" style="fill:var(--px-text)">Found 2 issues:</text>
<text class="m code" x="532" y="136" font-size="14"><tspan class="bad">signal-write-as-call</tspan> (line 9)</text>
<text class="m code" x="532" y="162" font-size="14"><tspan class="bad">for-with-key</tspan> (line 10)</text>
<text class="m hint" x="532" y="192">each: current, fix, auto-fixable: yes</text>
<text class="m hint" x="532" y="216">no network calls</text></g>
<rect class="bx" x="516" y="276" width="420" height="180" rx="14"/>
<text class="m hint" x="532" y="302"><tspan style="fill:var(--px-accent-text)">3</tspan>  the fix is applied</text>
<rect class="ring f3" x="512" y="272" width="428" height="188" rx="17" opacity="0"/>
<text class="m lab fixw" x="532" y="340">…</text>
<g class="fixd" opacity="0">
<text class="m ln2" x="532" y="320">9</text><text class="m code" x="562" y="320" font-size="14">count.<tspan class="fn">set</tspan>(count() + 1)</text>
<text class="m ln2" x="532" y="350">10</text><text class="m code" x="562" y="350" font-size="14"><tspan class="fn">by</tspan>={(i) =&gt; i.id}</text>
<text class="m hint" x="532" y="404">the same Fix: line the finding printed</text></g>
<rect class="bx" x="24" y="276" width="420" height="180" rx="14"/>
<text class="m hint" x="40" y="302"><tspan style="fill:var(--px-accent-text)">4</tspan>  pyreon check</text>
<rect class="ring f4" x="20" y="272" width="428" height="188" rx="17" opacity="0"/>
<text class="m code" x="40" y="320" font-size="14"><tspan class="fn">$</tspan> pyreon check</text>
<text class="m lab okw" x="40" y="352">…</text>
<text class="m okT okk" x="40" y="352" font-size="15" opacity="0">✓ no Pyreon anti-patterns in 1 file</text>
<text class="m hint" x="40" y="404">exits non-zero on any finding</text>
<rect class="ring pw-ai-ready-rm" x="512" y="48" width="428" height="188" rx="17"/>
