<line class="ln" x1="150" y1="352" x2="226" y2="402"/>
<line class="ln" x1="150" y1="352" x2="356" y2="402"/>
<rect class="node" x="118" y="330" width="64" height="30" rx="8"/><text class="m lab" x="150" y="350" text-anchor="middle">div</text>
<rect class="node" x="60" y="402" width="72" height="34" rx="8"/><text class="m code" x="96" y="424" text-anchor="middle">−</text>
<rect class="ring fm" x="56" y="398" width="80" height="42" rx="11" opacity="0"/>
