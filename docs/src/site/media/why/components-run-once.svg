<svg xmlns="http://www.w3.org/2000/svg" class="pxa pw-components-run-once" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="pw-components-run-once-t pw-components-run-once-d" fill="none">
<title id="pw-components-run-once-t">How a component runs once: one binding from the signal to one text node</title>
<desc id="pw-components-run-once-d">Left, the Counter you write: const count = signal(0), a span showing {count()} and two buttons. Middle, transformJSX. Right, what the compiler emits: a cached template string and one binding, _bindText(count, __t2). Below, the runtime wiring: clicking + calls count.update, the count signal notifies the one text node bound to it, and the number changes from 3 to 4; clicking - takes it back. A counter beside it reads Counter() ran 1×, and it never changes.</desc>
<style>
