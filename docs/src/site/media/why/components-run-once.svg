<text class="m eb" x="24" y="34">COMPONENTS RUN ONCE · HOW</text>
<!-- you write -->
<rect class="bx" x="24" y="52" width="306" height="212" rx="14"/>
<text class="m hint" x="40" y="78">You write · Counter.tsx</text>
<text class="m code" x="40" y="110"><tspan class="kw">function</tspan> <tspan class="fn">Counter</tspan>() {</text>
<text class="m code" x="56" y="136"><tspan class="kw">const</tspan> count = <tspan class="fn">signal</tspan>(<tspan class="str">0</tspan>)</text>
<text class="m code" x="56" y="162"><tspan class="kw">return</tspan> &lt;div&gt;</text>
<text class="m code" x="72" y="188">&lt;button&gt;-&lt;/button&gt;</text>
<text class="m code" x="72" y="214">&lt;span&gt;{count()}&lt;/span&gt;</text>
<text class="m code" x="72" y="240">&lt;button&gt;+&lt;/button&gt;&lt;/div&gt; }</text>
<rect class="ring pw-components-run-once-rm" x="66" y="196" width="196" height="26" rx="6"/>
<!-- compiler -->
<path class="ln" d="M330 158 L434 158"/><path d="M426 151 L435 158 L426 165" class="ln"/>
<text class="m hint" x="382" y="146" text-anchor="middle" font-size="12">transformJSX</text>
<!-- emitted -->
<rect class="bx2" x="440" y="52" width="496" height="212" rx="14"/>
<text class="m hint" x="456" y="78">The compiler emits (excerpt)</text>
<text class="m code" x="456" y="110" font-size="14"><tspan class="fn">_tpl</tspan>(<tspan class="str">"&lt;div&gt;&lt;button&gt;-&lt;/button&gt;&lt;span&gt; &lt;/span&gt;…"</tspan>,</text>
<text class="m code" x="472" y="136" font-size="14">(__root) =&gt; {</text>
<text class="m code dim" x="488" y="162" font-size="14">const __t2 = __e1.firstChild</text>
<text class="m code dim" x="488" y="188" font-size="14">__e3.__ev_click = () =&gt; count.<tspan class="fn">update</tspan>(…)</text>
<rect class="hlb" x="480" y="198" width="380" height="26" rx="6"/>
<text class="m code" x="488" y="216" font-size="14"><tspan class="kw">const</tspan> __d0 = <tspan class="fn">_bindText</tspan>(count, __t2)</text>
<text class="m code dim" x="472" y="244" font-size="14">})</text>
<rect class="ring pw-components-run-once-rm" x="480" y="198" width="380" height="26" rx="6"/>
<text class="m hint" x="920" y="244" text-anchor="end">the only dynamic line</text>
