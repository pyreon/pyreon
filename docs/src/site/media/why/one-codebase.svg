<svg xmlns="http://www.w3.org/2000/svg" class="pxa pw-one-codebase" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="pw-one-codebase-t pw-one-codebase-d" fill="none">
<title id="pw-one-codebase-t">One App.tsx, three build lanes: web, iOS and Android</title>
<desc id="pw-one-codebase-d">One src/App.tsx feeds three lanes. Web: Vite builds it against @pyreon/runtime-dom into the DOM, with SSR and hydration. iOS: pyreon-native emits SwiftUI .swift files that Xcode builds into the app. Android: pyreon-native emits Compose .kt files that Gradle builds into the app. The iOS and Android lanes are labelled experimental. A trace runs down each lane in turn. A note says CI runs XCUITest on a Simulator and Compose tests on an emulator.</desc>
<style>
