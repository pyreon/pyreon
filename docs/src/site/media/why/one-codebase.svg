.pw-one-codebase .okT{fill:var(--px-ok)} .pw-one-codebase .warmT{fill:var(--px-warm)} .pw-one-codebase .hotT{fill:var(--px-accent-text)} .pw-one-codebase .errT{fill:var(--px-err)}
