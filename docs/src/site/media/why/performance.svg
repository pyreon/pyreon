<svg xmlns="http://www.w3.org/2000/svg" class="pxa bc-why-perf" viewBox="0 0 960 508" width="960" height="508" role="img" aria-labelledby="bc-why-perf-t bc-why-perf-d" fill="none">
<title id="bc-why-perf-t">Create 10,000 rows, ten arms</title>
<desc id="bc-why-perf-d">Create 10,000 rows, ten arms. Lower is better. Vanilla: 68.75 ms; Pyreon: 74.33 ms; Vue 3: 75.94 ms; Vue 3.6 Vapor (RC): 76.31 ms; Octane 0.19: 76.41 ms; Solid 1.9: 80.45 ms; Solid 2.0: 82.08 ms; Svelte 5: 89.92 ms; React 19: 198.6 ms; Preact: 288.1 ms. synthetic · author-run · two runs (run 1 figures) · M3 Max · real Chromium · record re-measured 2026-11-26.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}
.bc-why-perf{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.bc-why-perf .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.bc-why-perf .bc-why-perf-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.bc-why-perf *{animation:none!important;transition:none!important}.bc-why-perf .bc-why-perf-rm{opacity:1}.bc-why-perf .bc-why-perf-am{opacity:0}}

.bc-why-perf .ttl{fill:var(--px-strong);font-size:22px;font-weight:600;letter-spacing:-.015em}
.bc-why-perf .eb{fill:var(--px-fog);font-size:12px;letter-spacing:.14em}
.bc-why-perf .lab{fill:var(--px-mist);font-size:14px}
.bc-why-perf .labP{fill:var(--px-strong);font-weight:600}
.bc-why-perf .val{fill:var(--px-mist);font-size:13.5px}
.bc-why-perf .valP{fill:var(--px-strong);font-weight:600}
.bc-why-perf .bar{fill:var(--px-bar)}
.bc-why-perf .ref{fill:none;stroke:var(--px-fog);stroke-width:1.2;stroke-dasharray:3 3}
.bc-why-perf .cav{fill:var(--px-fog);font-size:12px}
.bc-why-perf .note{fill:var(--px-mist);font-size:13px}
.bc-why-perf .grid{stroke:var(--px-line);stroke-width:1}

.bc-why-perf .chip rect{fill:none;stroke-width:1.2}
.bc-why-perf .chip text{font-size:11px;letter-spacing:.12em;font-weight:600}
.bc-why-perf .chip-win rect{fill:#FF5E1A;stroke:none} .bc-why-perf .chip-win text{fill:#0A0A0E}
.bc-why-perf .chip-tie rect{stroke:var(--px-link)} .bc-why-perf .chip-tie text{fill:var(--px-link)}
.bc-why-perf .chip-split rect{stroke:var(--px-mist)} .bc-why-perf .chip-split text{fill:var(--px-mist)}
.bc-why-perf .chip-loss rect{stroke:var(--px-err)} .bc-why-perf .chip-loss text{fill:var(--px-err)}
.bc-why-perf .chip-info rect{stroke:var(--px-fog)} .bc-why-perf .chip-info text{fill:var(--px-fog)}
</style>
<defs><linearGradient id="bc-why-perf-eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="bc-why-perf-egu" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="960" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="bc-why-perf-egv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="bc-why-perf-egd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient></defs>
<text class="m eb" x="0" y="20">LOWER IS BETTER · ms</text>
<text class="ttl" x="0" y="56">Create 10,000 rows, ten arms</text><text class="m lab" x="0" y="107">Vanilla</text><rect class="ref" x="210" y="92.6" width="147.9" height="18.8" rx="4"/><text class="m val" x="365.9315610467134" y="107">68.75 ms</text><text class="m lab labP" x="0" y="141">Pyreon</text><rect x="210" y="126" width="159.9" height="20" rx="4" fill="url(#bc-why-perf-egu)"/><text class="m val valP" x="377.93822447421394" y="141">74.33 ms</text><text class="m lab" x="0" y="175">Vue 3</text><rect x="210" y="160" width="163.4" height="20" rx="4" class="bar"/><text class="m val" x="381.4025126674534" y="175">75.94 ms</text><text class="m lab" x="0" y="209">Vue 3.6 Vapor (RC)</text><rect x="210" y="194" width="164.2" height="20" rx="4" class="bar"/><text class="m val" x="382.19865343235927" y="209">76.31 ms</text><text class="m lab" x="0" y="243">Octane 0.19</text><rect x="210" y="228" width="164.4" height="20" rx="4" class="bar"/><text class="m val" x="382.4138266120636" y="243">76.41 ms</text><text class="m lab" x="0" y="277">Solid 1.9</text><rect x="210" y="262" width="173.1" height="20" rx="4" class="bar"/><text class="m val" x="391.1068230721178" y="277">80.45 ms</text><text class="m lab" x="0" y="311">Solid 2.0</text><rect x="210" y="296" width="176.6" height="20" rx="4" class="bar"/><text class="m val" x="394.614145901298" y="311">82.08 ms</text><text class="m lab" x="0" y="345">Svelte 5</text><rect x="210" y="330" width="193.5" height="20" rx="4" class="bar"/><text class="m val" x="411.48372319011594" y="345">89.92 ms</text><text class="m lab" x="0" y="379">React 19</text><rect x="210" y="364" width="427.4" height="20" rx="4" class="bar"/><text class="m val" x="645.3984868466719" y="379">198.6 ms</text><text class="m lab" x="0" y="413">Preact</text><rect x="210" y="398" width="620.0" height="20" rx="4" class="bar"/><text class="m val" x="838" y="413">288.1 ms</text><text class="m note" x="0" y="450">2.7× faster than React 19, 3.9× than Preact. Against Vue 3, Vapor and Octane: ahead in run 1, level in run 2, so not claimed.</text><text class="m cav" x="0" y="492">synthetic · author-run · two runs (run 1 figures) · M3 Max · real Chromium · record re-measured 2026-11-26</text>
</svg>
