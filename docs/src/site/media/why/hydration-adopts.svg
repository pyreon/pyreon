<svg xmlns="http://www.w3.org/2000/svg" class="pxa pw-hydration-adopts" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="pw-hydration-adopts-t pw-hydration-adopts-d" fill="none">
<title id="pw-hydration-adopts-t">Hydration adopts the server DOM and keeps what you typed</title>
<desc id="pw-hydration-adopts-d">Three browser frames. 1, the server-rendered HTML arrives with an empty email input; the JavaScript has not loaded. 2, the user types ada@pyreon before the JavaScript lands. 3, hydration adopts the existing nodes instead of replacing them: the typed text, the focus and the caret are all still there. Below, a dashed ghost frame shows the alternative, a hydration that rebuilds the DOM, where the input comes back empty and focus is lost.</desc>
<style>
