.pw-full-stack .kw{fill:var(--px-accent-text)} .pw-full-stack .fn{fill:var(--px-link)} .pw-full-stack .str{fill:var(--px-warm)} .pw-full-stack .ty{fill:var(--px-violet)}
.pw-full-stack .dim{fill:var(--px-fog)}
