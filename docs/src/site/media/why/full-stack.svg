@keyframes pw-full-stack-hit2{0%{opacity:0}53.1250%{opacity:0}54.1250%{opacity:1}55.6250%{opacity:0}100%{opacity:0}}
@keyframes pw-full-stack-on2{0.0000%{opacity:0;animation-timing-function:step-end}53.1250%{opacity:1;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
.pw-full-stack .tr2{stroke-dasharray:40 900}
@keyframes pw-full-stack-tr3{0%{stroke-dashoffset:40;opacity:0}67.5000%{stroke-dashoffset:40;opacity:1}73.1250%{stroke-dashoffset:-284;opacity:1}73.1375%{stroke-dashoffset:40;opacity:0}100%{stroke-dashoffset:40;opacity:0}}
