.pw-full-stack .emberS{stroke:url(#pw-full-stack-egu);stroke-width:2.5;stroke-linecap:round;fill:none}
.pw-full-stack .ring{fill:none;stroke:var(--px-accent);stroke-width:2}
.pw-full-stack .ok{fill:var(--px-ok)} .pw-full-stack .warm{fill:var(--px-warm)} .pw-full-stack .hot{fill:var(--px-accent)} .pw-full-stack .errF{fill:var(--px-err)}
.pw-full-stack .okT{fill:var(--px-ok)} .pw-full-stack .warmT{fill:var(--px-warm)} .pw-full-stack .hotT{fill:var(--px-accent-text)} .pw-full-stack .errT{fill:var(--px-err)}
.pw-full-stack .okS{stroke:var(--px-ok)} .pw-full-stack .errS{stroke:var(--px-err)}
.pw-full-stack .gfill{fill:url(#pw-full-stack-eg)}
@media (prefers-reduced-motion: reduce){.pw-full-stack .ember{opacity:0}}

