.bc-ssr{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.bc-ssr .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.bc-ssr .bc-ssr-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.bc-ssr *{animation:none!important;transition:none!important}.bc-ssr .bc-ssr-rm{opacity:1}.bc-ssr .bc-ssr-am{opacity:0}}

.bc-ssr .ttl{fill:var(--px-strong);font-size:22px;font-weight:600;letter-spacing:-.015em}
.bc-ssr .eb{fill:var(--px-fog);font-size:12px;letter-spacing:.14em}
.bc-ssr .lab{fill:var(--px-mist);font-size:14px}
.bc-ssr .labP{fill:var(--px-strong);font-weight:600}
.bc-ssr .val{fill:var(--px-mist);font-size:13.5px}
.bc-ssr .valP{fill:var(--px-strong);font-weight:600}
.bc-ssr .bar{fill:var(--px-bar)}
.bc-ssr .ref{fill:none;stroke:var(--px-fog);stroke-width:1.2;stroke-dasharray:3 3}
.bc-ssr .cav{fill:var(--px-fog);font-size:12px}
.bc-ssr .note{fill:var(--px-mist);font-size:13px}
.bc-ssr .grid{stroke:var(--px-line);stroke-width:1}

.bc-ssr .chip rect{fill:none;stroke-width:1.2}
.bc-ssr .chip text{font-size:11px;letter-spacing:.12em;font-weight:600}
.bc-ssr .chip-win rect{fill:#FF5E1A;stroke:none} .bc-ssr .chip-win text{fill:#0A0A0E}
.bc-ssr .chip-tie rect{stroke:var(--px-link)} .bc-ssr .chip-tie text{fill:var(--px-link)}
.bc-ssr .chip-split rect{stroke:var(--px-mist)} .bc-ssr .chip-split text{fill:var(--px-mist)}
.bc-ssr .chip-loss rect{stroke:var(--px-err)} .bc-ssr .chip-loss text{fill:var(--px-err)}
.bc-ssr .chip-info rect{stroke:var(--px-fog)} .bc-ssr .chip-info text{fill:var(--px-fog)}
