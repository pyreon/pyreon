<title id="bc-todo-t">TodoMVC shape against React 19</title>
<desc id="bc-todo-d">TodoMVC shape against React 19. add 100 todos (varies by day) · 1.14–1.99×: Pyreon 765 µs, React 19 1.53 ms; toggle 1,000 · 2.48×: Pyreon 4.60 ms, React 19 11.41 ms; clear 1,000 · 3.14×: Pyreon 320 µs, React 19 1.00 ms. synthetic · author-run · one run · M3 Max · record of 2026-11-05.</desc>
<style>
