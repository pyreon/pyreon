.bc-todo{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.bc-todo .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.bc-todo .bc-todo-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.bc-todo *{animation:none!important;transition:none!important}.bc-todo .bc-todo-rm{opacity:1}.bc-todo .bc-todo-am{opacity:0}}

.bc-todo .ttl{fill:var(--px-strong);font-size:22px;font-weight:600;letter-spacing:-.015em}
.bc-todo .eb{fill:var(--px-fog);font-size:12px;letter-spacing:.14em}
.bc-todo .lab{fill:var(--px-mist);font-size:14px}
.bc-todo .labP{fill:var(--px-strong);font-weight:600}
.bc-todo .val{fill:var(--px-mist);font-size:13.5px}
.bc-todo .valP{fill:var(--px-strong);font-weight:600}
.bc-todo .bar{fill:var(--px-bar)}
.bc-todo .ref{fill:none;stroke:var(--px-fog);stroke-width:1.2;stroke-dasharray:3 3}
.bc-todo .cav{fill:var(--px-fog);font-size:12px}
.bc-todo .note{fill:var(--px-mist);font-size:13px}
.bc-todo .grid{stroke:var(--px-line);stroke-width:1}

.bc-todo .chip rect{fill:none;stroke-width:1.2}
.bc-todo .chip text{font-size:11px;letter-spacing:.12em;font-weight:600}
.bc-todo .chip-win rect{fill:#FF5E1A;stroke:none} .bc-todo .chip-win text{fill:#0A0A0E}
.bc-todo .chip-tie rect{stroke:var(--px-link)} .bc-todo .chip-tie text{fill:var(--px-link)}
.bc-todo .chip-split rect{stroke:var(--px-mist)} .bc-todo .chip-split text{fill:var(--px-mist)}
.bc-todo .chip-loss rect{stroke:var(--px-err)} .bc-todo .chip-loss text{fill:var(--px-err)}
.bc-todo .chip-info rect{stroke:var(--px-fog)} .bc-todo .chip-info text{fill:var(--px-fog)}
</style>
