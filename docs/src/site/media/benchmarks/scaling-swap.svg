@media (prefers-reduced-motion: reduce){.bc-sc-swap *{animation:none!important;transition:none!important}.bc-sc-swap .bc-sc-swap-rm{opacity:1}.bc-sc-swap .bc-sc-swap-am{opacity:0}}

.bc-sc-swap .ttl{fill:var(--px-strong);font-size:22px;font-weight:600;letter-spacing:-.015em}
.bc-sc-swap .eb{fill:var(--px-fog);font-size:12px;letter-spacing:.14em}
