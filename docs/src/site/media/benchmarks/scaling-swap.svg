.bc-sc-swap .bar{fill:var(--px-bar)}
.bc-sc-swap .ref{fill:none;stroke:var(--px-fog);stroke-width:1.2;stroke-dasharray:3 3}
.bc-sc-swap .cav{fill:var(--px-fog);font-size:12px}
.bc-sc-swap .note{fill:var(--px-mist);font-size:13px}
.bc-sc-swap .grid{stroke:var(--px-line);stroke-width:1}

.bc-sc-swap .chip rect{fill:none;stroke-width:1.2}
.bc-sc-swap .chip text{font-size:11px;letter-spacing:.12em;font-weight:600}
.bc-sc-swap .chip-win rect{fill:#FF5E1A;stroke:none} .bc-sc-swap .chip-win text{fill:#0A0A0E}
.bc-sc-swap .chip-tie rect{stroke:var(--px-link)} .bc-sc-swap .chip-tie text{fill:var(--px-link)}
.bc-sc-swap .chip-split rect{stroke:var(--px-mist)} .bc-sc-swap .chip-split text{fill:var(--px-mist)}
.bc-sc-swap .chip-loss rect{stroke:var(--px-err)} .bc-sc-swap .chip-loss text{fill:var(--px-err)}
.bc-sc-swap .chip-info rect{stroke:var(--px-fog)} .bc-sc-swap .chip-info text{fill:var(--px-fog)}
