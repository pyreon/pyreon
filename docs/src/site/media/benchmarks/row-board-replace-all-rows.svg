.bc-rb-replace-all-rows{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.bc-rb-replace-all-rows .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.bc-rb-replace-all-rows .bc-rb-replace-all-rows-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.bc-rb-replace-all-rows *{animation:none!important;transition:none!important}.bc-rb-replace-all-rows .bc-rb-replace-all-rows-rm{opacity:1}.bc-rb-replace-all-rows .bc-rb-replace-all-rows-am{opacity:0}}

.bc-rb-replace-all-rows .ttl{fill:var(--px-strong);font-size:22px;font-weight:600;letter-spacing:-.015em}
.bc-rb-replace-all-rows .eb{fill:var(--px-fog);font-size:12px;letter-spacing:.14em}
.bc-rb-replace-all-rows .lab{fill:var(--px-mist);font-size:14px}
.bc-rb-replace-all-rows .labP{fill:var(--px-strong);font-weight:600}
.bc-rb-replace-all-rows .val{fill:var(--px-mist);font-size:13.5px}
.bc-rb-replace-all-rows .valP{fill:var(--px-strong);font-weight:600}
.bc-rb-replace-all-rows .bar{fill:var(--px-bar)}
.bc-rb-replace-all-rows .ref{fill:none;stroke:var(--px-fog);stroke-width:1.2;stroke-dasharray:3 3}
.bc-rb-replace-all-rows .cav{fill:var(--px-fog);font-size:12px}
.bc-rb-replace-all-rows .note{fill:var(--px-mist);font-size:13px}
.bc-rb-replace-all-rows .grid{stroke:var(--px-line);stroke-width:1}

.bc-rb-replace-all-rows .chip rect{fill:none;stroke-width:1.2}
.bc-rb-replace-all-rows .chip text{font-size:11px;letter-spacing:.12em;font-weight:600}
.bc-rb-replace-all-rows .chip-win rect{fill:#FF5E1A;stroke:none} .bc-rb-replace-all-rows .chip-win text{fill:#0A0A0E}
.bc-rb-replace-all-rows .chip-tie rect{stroke:var(--px-link)} .bc-rb-replace-all-rows .chip-tie text{fill:var(--px-link)}
.bc-rb-replace-all-rows .chip-split rect{stroke:var(--px-mist)} .bc-rb-replace-all-rows .chip-split text{fill:var(--px-mist)}
.bc-rb-replace-all-rows .chip-loss rect{stroke:var(--px-err)} .bc-rb-replace-all-rows .chip-loss text{fill:var(--px-err)}
.bc-rb-replace-all-rows .chip-info rect{stroke:var(--px-fog)} .bc-rb-replace-all-rows .chip-info text{fill:var(--px-fog)}
