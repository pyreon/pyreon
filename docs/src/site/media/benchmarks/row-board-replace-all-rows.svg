<svg xmlns="http://www.w3.org/2000/svg" class="pxa bc-rb-replace-all-rows" viewBox="0 0 960 508" width="960" height="508" role="img" aria-labelledby="bc-rb-replace-all-rows-t bc-rb-replace-all-rows-d" fill="none">
<title id="bc-rb-replace-all-rows-t">Row board: replace all rows</title>
<desc id="bc-rb-replace-all-rows-d">Row board: replace all rows. Lower is better. Vanilla: 6.69 ms; Vue 3.6 Vapor (RC): 7.11 ms; Pyreon: 7.13 ms; Octane 0.16: 7.29 ms; Vue 3: 7.38 ms; Solid: 7.83 ms; Svelte 5: 8.02 ms; Solid 2.0 (RC): 8.24 ms; React 19: 8.89 ms; Preact: 9.8 ms. synthetic · author-run · two runs (run 1 figures) · M3 Max · real Chromium · record of 2026-11-05.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
