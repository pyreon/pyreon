<svg xmlns="http://www.w3.org/2000/svg" class="pxa bc-forms" viewBox="0 0 960 484" width="960" height="484" role="img" aria-labelledby="bc-forms-t bc-forms-d" fill="none">
<title id="bc-forms-t">12-field form against six libraries</title>
<desc id="bc-forms-d">12-field form against six libraries. mount 12 fields: Pyreon 210 µs, Solid modular-forms 305 µs, Formik 340 µs, vee-validate 570 µs, Felte 575 µs, React Hook Form 640 µs, TanStack Form 680 µs; keystroke, validating: Pyreon 460 µs, Solid modular-forms 570 µs, React Hook Form 830 µs, Felte 1,150 µs, Formik 1,320 µs, vee-validate 2,260 µs, TanStack Form 2,380 µs. synthetic · author-run · one run · M3 Max · record of 2026-11-05 · real Chromium.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}
.bc-forms{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.bc-forms .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.bc-forms .bc-forms-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.bc-forms *{animation:none!important;transition:none!important}.bc-forms .bc-forms-rm{opacity:1}.bc-forms .bc-forms-am{opacity:0}}

.bc-forms .ttl{fill:var(--px-strong);font-size:22px;font-weight:600;letter-spacing:-.015em}
.bc-forms .eb{fill:var(--px-fog);font-size:12px;letter-spacing:.14em}
.bc-forms .lab{fill:var(--px-mist);font-size:14px}
.bc-forms .labP{fill:var(--px-strong);font-weight:600}
.bc-forms .val{fill:var(--px-mist);font-size:13.5px}
.bc-forms .valP{fill:var(--px-strong);font-weight:600}
.bc-forms .bar{fill:var(--px-bar)}
.bc-forms .ref{fill:none;stroke:var(--px-fog);stroke-width:1.2;stroke-dasharray:3 3}
.bc-forms .cav{fill:var(--px-fog);font-size:12px}
.bc-forms .note{fill:var(--px-mist);font-size:13px}
.bc-forms .grid{stroke:var(--px-line);stroke-width:1}

.bc-forms .chip rect{fill:none;stroke-width:1.2}
.bc-forms .chip text{font-size:11px;letter-spacing:.12em;font-weight:600}
.bc-forms .chip-win rect{fill:#FF5E1A;stroke:none} .bc-forms .chip-win text{fill:#0A0A0E}
.bc-forms .chip-tie rect{stroke:var(--px-link)} .bc-forms .chip-tie text{fill:var(--px-link)}
.bc-forms .chip-split rect{stroke:var(--px-mist)} .bc-forms .chip-split text{fill:var(--px-mist)}
.bc-forms .chip-loss rect{stroke:var(--px-err)} .bc-forms .chip-loss text{fill:var(--px-err)}
.bc-forms .chip-info rect{stroke:var(--px-fog)} .bc-forms .chip-info text{fill:var(--px-fog)}
</style>
<defs><linearGradient id="bc-forms-eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="bc-forms-egu" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="960" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="bc-forms-egv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="bc-forms-egd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient></defs>
