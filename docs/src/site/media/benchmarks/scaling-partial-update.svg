<title id="bc-sc-partial-update-t">Scaling: partial update, 100 to 20,000 rows</title>
<desc id="bc-sc-partial-update-d">Scaling: partial update, 100 to 20,000 rows, log scale, µs. Pyreon: 100 rows 60.1, 1,000 rows 518, 5,000 rows 3,210, 10,000 rows 6,830, 20,000 rows 15,980; Octane: 100 rows 64.8, 1,000 rows 578, 5,000 rows 3,370, 10,000 rows 7,320, 20,000 rows 16,930; Solid: 100 rows 62.5, 1,000 rows 555, 5,000 rows 3,320, 10,000 rows 7,290, 20,000 rows 16,910. synthetic · author-run · one run · M3 Max · record of 2026-11-05 · batch instrument.</desc>
<style>
