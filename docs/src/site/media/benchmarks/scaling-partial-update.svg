.bc-sc-partial-update{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.bc-sc-partial-update .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.bc-sc-partial-update .bc-sc-partial-update-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.bc-sc-partial-update *{animation:none!important;transition:none!important}.bc-sc-partial-update .bc-sc-partial-update-rm{opacity:1}.bc-sc-partial-update .bc-sc-partial-update-am{opacity:0}}

.bc-sc-partial-update .ttl{fill:var(--px-strong);font-size:22px;font-weight:600;letter-spacing:-.015em}
.bc-sc-partial-update .eb{fill:var(--px-fog);font-size:12px;letter-spacing:.14em}
.bc-sc-partial-update .lab{fill:var(--px-mist);font-size:14px}
.bc-sc-partial-update .labP{fill:var(--px-strong);font-weight:600}
.bc-sc-partial-update .val{fill:var(--px-mist);font-size:13.5px}
.bc-sc-partial-update .valP{fill:var(--px-strong);font-weight:600}
.bc-sc-partial-update .bar{fill:var(--px-bar)}
.bc-sc-partial-update .ref{fill:none;stroke:var(--px-fog);stroke-width:1.2;stroke-dasharray:3 3}
.bc-sc-partial-update .cav{fill:var(--px-fog);font-size:12px}
.bc-sc-partial-update .note{fill:var(--px-mist);font-size:13px}
.bc-sc-partial-update .grid{stroke:var(--px-line);stroke-width:1}

.bc-sc-partial-update .chip rect{fill:none;stroke-width:1.2}
.bc-sc-partial-update .chip text{font-size:11px;letter-spacing:.12em;font-weight:600}
.bc-sc-partial-update .chip-win rect{fill:url(#bc-sc-partial-update-eg);stroke:none} .bc-sc-partial-update .chip-win text{fill:#0A0A0E}
.bc-sc-partial-update .chip-tie rect{stroke:var(--px-link)} .bc-sc-partial-update .chip-tie text{fill:var(--px-link)}
.bc-sc-partial-update .chip-split rect{stroke:var(--px-mist)} .bc-sc-partial-update .chip-split text{fill:var(--px-mist)}
.bc-sc-partial-update .chip-loss rect{stroke:var(--px-err)} .bc-sc-partial-update .chip-loss text{fill:var(--px-err)}
.bc-sc-partial-update .chip-info rect{stroke:var(--px-fog)} .bc-sc-partial-update .chip-info text{fill:var(--px-fog)}
