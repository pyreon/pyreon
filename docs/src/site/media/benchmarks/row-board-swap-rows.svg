.bc-rb-swap-rows .chip text{font-size:11px;letter-spacing:.12em;font-weight:600}
.bc-rb-swap-rows .chip-win rect{fill:#FF5E1A;stroke:none} .bc-rb-swap-rows .chip-win text{fill:#0A0A0E}
.bc-rb-swap-rows .chip-tie rect{stroke:var(--px-link)} .bc-rb-swap-rows .chip-tie text{fill:var(--px-link)}
.bc-rb-swap-rows .chip-split rect{stroke:var(--px-mist)} .bc-rb-swap-rows .chip-split text{fill:var(--px-mist)}
.bc-rb-swap-rows .chip-loss rect{stroke:var(--px-err)} .bc-rb-swap-rows .chip-loss text{fill:var(--px-err)}
.bc-rb-swap-rows .chip-info rect{stroke:var(--px-fog)} .bc-rb-swap-rows .chip-info text{fill:var(--px-fog)}
