@media (prefers-reduced-motion: reduce){.bc-rb-swap-rows *{animation:none!important;transition:none!important}.bc-rb-swap-rows .bc-rb-swap-rows-rm{opacity:1}.bc-rb-swap-rows .bc-rb-swap-rows-am{opacity:0}}

