<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Cascade-layer order, declared before any stylesheet: the hand-written
         CSS (vite-plugins/legacy-css-layer.ts) sits below @pyreon/styler's
         `elements` and `rocketstyle` layers, so the kit's styles win over the
         docs' global resets. -->
    <style>@layer docs, elements, rocketstyle, site;</style>

    <!-- Title, description, Open Graph and Twitter tags come from
         @pyreon/head: site defaults in src/routes/_layout.tsx, which a page
         overrides by key (a blog post sets its own og:image, og:url and
         canonical). They are rendered at the pyreon-head slot below.
         A static tag here could not be overridden — social scrapers read the
         first og:image, so every page would share the generic card. -->

    <!-- Pre-paint theme: sets data-theme on <html> BEFORE first paint so
         the CSS-variables theme (src/site/ui-init.ts) and tokens.css resolve
         the right palette with no flash. A stored choice ("pyreon-theme",
         shared with the tool apps; the VitePress-era key is honoured once)
         wins, else the OS preference. MUST stay byte-identical to
         PRE_PAINT_SCRIPT in src/site/color-mode.ts — the color-mode test
         reads this file and fails on drift. -->
    <script>(function(){var d=document.documentElement,m;try{var s=localStorage.getItem("pyreon-theme");if(s!=="light"&&s!=="dark"){var l=localStorage.getItem("vitepress-theme-appearance");s=l==="light"||l==="dark"?l:null}m=s||(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}catch(e){m="dark"}d.setAttribute("data-theme",m);d.style.colorScheme=m})()</script>

    <!-- Brand fonts — Space Grotesk (sans) + JetBrains Mono (mono/accent),
         from brand handoff §4. Now self-hosted by @pyreon/zero's
         `fontPlugin` (wired via `zero({ font })` in vite.config.ts):

           • selfHost: woff2 emitted under /assets/fonts (same-origin,
             immutable) — eliminates the fonts.googleapis.com +
             fonts.gstatic.com cross-origin connection setup AND Google's
             10-minute-cached CSS that Lighthouse flagged.
           • subsets: ['latin'] — trims the unused subset woff2 files.
           • fallbackAdjust: emits size-adjusted "<Family> Fallback"
             @font-face declarations (the next/font technique) so the
             system fallback's metrics MATCH the web font — zero
             font-swap CLS — plus the `--pyreon-font-*` vars that
             tokens.css points `--font-sans` / `--font-mono` at.

         The plugin injects the self-host `<style>` + a primary-subset
         `<link rel=preload as=font>` at build time. In `vite dev` it
         falls back to the Google CDN `<link>` (build-only self-host),
         so local dev keeps working with no extra wiring. -->

    <!-- Favicons, the web app manifest and theme-color come from the root
         layout's head defaults (src/routes/_layout.tsx), from the brand
         icon set in public/brand. -->

    <!--pyreon-head-->
  </head>
  <body>
    <div id="app"><!--pyreon-app--></div>
    <!--pyreon-scripts-->
  </body>
</html>
