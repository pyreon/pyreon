<svg data-theme="dark" xmlns="http://www.w3.org/2000/svg" class="pxa pq-dnd" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="pq-dnd-t pq-dnd-d" fill="none">
<title id="pq-dnd-t">A sortable list that keyboard users can reorder too</title>
<desc id="pq-dnd-d">Schematic: a sortable list of four tasks. With the keyboard, the third task is focused, picked up with Space, moved up with the arrow key and dropped with Space, and a screen reader hears each step. Then a pointer drags it back down to its place.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}
.pq-dnd{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pq-dnd .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pq-dnd .pq-dnd-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.pq-dnd *{animation:none!important;transition:none!important}.pq-dnd .pq-dnd-rm{opacity:1}.pq-dnd .pq-dnd-am{opacity:0}}

.pq-dnd .ln{stroke:var(--px-hint);stroke-width:1.5}
.pq-dnd .dash{stroke:var(--px-hint);stroke-width:1.5;stroke-dasharray:4 6}
.pq-dnd .bx{fill:var(--px-card);stroke:var(--px-bar);stroke-width:1.5}
.pq-dnd .bx2{fill:var(--px-raised);stroke:var(--px-bar);stroke-width:1.5}
.pq-dnd .act{fill:none;stroke:var(--px-text);stroke-width:2}
.pq-dnd .lab{fill:var(--px-fog);font-size:14px;letter-spacing:.02em}
.pq-dnd .eb{fill:var(--px-fog);font-size:13px;letter-spacing:.16em}
.pq-dnd .val{fill:var(--px-text);font-size:20px;font-weight:500}
.pq-dnd .big{fill:var(--px-strong);font-size:30px;font-weight:600;letter-spacing:-.02em}
.pq-dnd .txt{fill:var(--px-text);font-size:16px}
.pq-dnd .mt{fill:var(--px-mist);font-size:14px}
.pq-dnd .hint{fill:var(--px-fog);font-size:13px}
.pq-dnd .ember{stroke:url(#pq-dnd-eg);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:36 2000;fill:none}
.pq-dnd .emS{stroke:url(#pq-dnd-eg);stroke-width:2.5;fill:none}
.pq-dnd .ring{fill:none;stroke:var(--px-accent);stroke-width:2}
.pq-dnd .ok{fill:var(--px-ok)} .pq-dnd .warm{fill:var(--px-warm)} .pq-dnd .hot{fill:var(--px-accent)} .pq-dnd .err{fill:var(--px-err)}
.pq-dnd .okT{fill:var(--px-ok)} .pq-dnd .warmT{fill:var(--px-warm)} .pq-dnd .hotT{fill:var(--px-accent-text)} .pq-dnd .errT{fill:var(--px-err)} .pq-dnd .linkT{fill:var(--px-link)}
.pq-dnd .focus{fill:none;stroke:var(--px-link);stroke-width:2;stroke-dasharray:3 3}
