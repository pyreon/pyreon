<svg data-theme="light" xmlns="http://www.w3.org/2000/svg" class="pxa pq-lathe" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="pq-lathe-t pq-lathe-d" fill="none">
<title id="pq-lathe-t">lathe generate turns one OpenAPI spec into 29 typed files</title>
<desc id="pq-lathe-d">Terminal output of a real lathe generate run on the Bookshelf API (4 models, 4 operations, multiplatform target): it writes schemas, a typed client, query hooks, mocks, native screens and docs, 29 of 29 files, and reports 3 of 4 operations reaching native with the Swift and Kotlin builds compiled.</desc>
