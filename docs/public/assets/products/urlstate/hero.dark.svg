<svg data-theme="dark" xmlns="http://www.w3.org/2000/svg" class="pxa pq-urlstate" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="pq-urlstate-t pq-urlstate-d" fill="none">
<title id="pq-urlstate-t">A signal that lives in the address bar</title>
<desc id="pq-urlstate-d">Schematic: a browser address bar reads /products?q=lamp. Clicking Next sets the page signal to 2 and the URL becomes /products?q=lamp&amp;page=2. The back button restores the URL, and the page signal reads 1 again; the default value never appears in the URL.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}
.pq-urlstate{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pq-urlstate .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pq-urlstate .pq-urlstate-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.pq-urlstate *{animation:none!important;transition:none!important}.pq-urlstate .pq-urlstate-rm{opacity:1}.pq-urlstate .pq-urlstate-am{opacity:0}}

.pq-urlstate .ln{stroke:var(--px-hint);stroke-width:1.5}
.pq-urlstate .dash{stroke:var(--px-hint);stroke-width:1.5;stroke-dasharray:4 6}
.pq-urlstate .bx{fill:var(--px-card);stroke:var(--px-bar);stroke-width:1.5}
.pq-urlstate .bx2{fill:var(--px-raised);stroke:var(--px-bar);stroke-width:1.5}
.pq-urlstate .act{fill:none;stroke:var(--px-text);stroke-width:2}
.pq-urlstate .lab{fill:var(--px-fog);font-size:14px;letter-spacing:.02em}
.pq-urlstate .eb{fill:var(--px-fog);font-size:13px;letter-spacing:.16em}
.pq-urlstate .val{fill:var(--px-text);font-size:20px;font-weight:500}
.pq-urlstate .big{fill:var(--px-strong);font-size:30px;font-weight:600;letter-spacing:-.02em}
.pq-urlstate .txt{fill:var(--px-text);font-size:16px}
.pq-urlstate .mt{fill:var(--px-mist);font-size:14px}
.pq-urlstate .hint{fill:var(--px-fog);font-size:13px}
.pq-urlstate .ember{stroke:url(#pq-urlstate-eg);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:36 2000;fill:none}
.pq-urlstate .emS{stroke:url(#pq-urlstate-eg);stroke-width:2.5;fill:none}
.pq-urlstate .ring{fill:none;stroke:var(--px-accent);stroke-width:2}
.pq-urlstate .ok{fill:var(--px-ok)} .pq-urlstate .warm{fill:var(--px-warm)} .pq-urlstate .hot{fill:var(--px-accent)} .pq-urlstate .err{fill:var(--px-err)}
.pq-urlstate .okT{fill:var(--px-ok)} .pq-urlstate .warmT{fill:var(--px-warm)} .pq-urlstate .hotT{fill:var(--px-accent-text)} .pq-urlstate .errT{fill:var(--px-err)} .pq-urlstate .linkT{fill:var(--px-link)}
.pq-urlstate .focus{fill:none;stroke:var(--px-link);stroke-width:2;stroke-dasharray:3 3}
@keyframes pq-urlstate-k0{0.0000%{opacity:0;animation-timing-function:step-end}15.0000%{opacity:1;animation-timing-function:step-end}62.5000%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-urlstate-k1{0.0000%{opacity:1;animation-timing-function:step-end}15.0000%{opacity:0;animation-timing-function:step-end}62.5000%{opacity:1;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-urlstate-k2{0.0000%{opacity:1;animation-timing-function:step-end}15.0000%{opacity:0;animation-timing-function:step-end}62.5000%{opacity:1;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-urlstate-k3{0.0000%{opacity:0;animation-timing-function:step-end}15.0000%{opacity:1;animation-timing-function:step-end}62.5000%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-urlstate-k4{0.0000%{opacity:1;animation-timing-function:step-end}15.0000%{opacity:0;animation-timing-function:step-end}62.5000%{opacity:1;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-urlstate-k5{0.0000%{opacity:0;animation-timing-function:step-end}15.0000%{opacity:1;animation-timing-function:step-end}62.5000%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-urlstate-k6{0%{opacity:0}13.5000%{opacity:0}14.5000%{opacity:1}16.0000%{opacity:0}100%{opacity:0}}
@keyframes pq-urlstate-k7{0%{stroke-dashoffset:36;opacity:0}15.0000%{stroke-dashoffset:36;opacity:1}17.5000%{stroke-dashoffset:-70;opacity:1}17.5125%{stroke-dashoffset:36;opacity:0}62.5000%{stroke-dashoffset:36;opacity:1}65.0000%{stroke-dashoffset:-70;opacity:1}65.0125%{stroke-dashoffset:36;opacity:0}100%{stroke-dashoffset:36;opacity:0}}
@keyframes pq-urlstate-k8{0%{opacity:0}16.8750%{opacity:0}17.8750%{opacity:1}19.3750%{opacity:0}64.3750%{opacity:0}65.3750%{opacity:1}66.8750%{opacity:0}100%{opacity:0}}
@keyframes pq-urlstate-k9{0%{opacity:0}61.5000%{opacity:0}62.5000%{opacity:1}64.0000%{opacity:0}100%{opacity:0}}
.pq-urlstate .k0{animation:pq-urlstate-k0 8000ms linear infinite}
.pq-urlstate .k1{animation:pq-urlstate-k1 8000ms linear infinite}
.pq-urlstate .k2{animation:pq-urlstate-k2 8000ms linear infinite}
.pq-urlstate .k3{animation:pq-urlstate-k3 8000ms linear infinite}
.pq-urlstate .k4{animation:pq-urlstate-k4 8000ms linear infinite}
.pq-urlstate .k5{animation:pq-urlstate-k5 8000ms linear infinite}
.pq-urlstate .k6{animation:pq-urlstate-k6 8000ms linear infinite}
.pq-urlstate .k7{animation:pq-urlstate-k7 8000ms linear infinite}
.pq-urlstate .k8{animation:pq-urlstate-k8 8000ms linear infinite}
.pq-urlstate .k9{animation:pq-urlstate-k9 8000ms linear infinite}
@media (prefers-reduced-motion: reduce){.pq-urlstate .k0{opacity:1}.pq-urlstate .k1{opacity:0}.pq-urlstate .k2{opacity:0}.pq-urlstate .k3{opacity:1}.pq-urlstate .k4{opacity:0}.pq-urlstate .k5{opacity:1}.pq-urlstate .k6{opacity:0}.pq-urlstate .k7{opacity:0}.pq-urlstate .k8{opacity:0}.pq-urlstate .k9{opacity:0}}
</style>
<defs><linearGradient id="pq-urlstate-eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pq-urlstate-egu" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pq-urlstate-egv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pq-urlstate-egd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient></defs>

<text class="m eb" x="24" y="34">USEURLSTATE('PAGE', 1) · TYPED FROM ITS DEFAULT</text>
<!-- browser chrome -->
<rect class="bx" x="24" y="64" width="592" height="268" rx="16"/>
<line class="ln" x1="24" y1="116" x2="616" y2="116"/>
<g class="k0"><path d="M52 90 l-8 0 m0 0 l6 -6 m-6 6 l6 6" style="stroke:var(--px-text);stroke-width:2"/></g>
<g class="k1"><path d="M52 90 l-8 0 m0 0 l6 -6 m-6 6 l6 6" style="stroke:var(--px-bar);stroke-width:2"/></g>
<path d="M66 90 l8 0 m0 0 l-6 -6 m6 6 l-6 6" style="stroke:var(--px-bar);stroke-width:2"/>
<rect class="bx2" x="92" y="76" width="504" height="28" rx="14"/>
<g class="k2"><text class="m mt" x="108" y="95">shop.example.com/products?q=lamp</text></g>
<g class="k3"><text class="m mt" x="108" y="95">shop.example.com/products?q=lamp</text><text class="m txt" x="377" y="95" style="font-size:14px">&amp;page=2</text></g>
<line class="emS pq-urlstate-rm" x1="377" y1="101" x2="436" y2="100"/>
<!-- page content -->
<text class="m lab" x="48" y="152">search</text>
<rect class="bx2" x="48" y="162" width="220" height="40" rx="10"/>
<text class="m txt" x="64" y="188">lamp</text>
<text class="m hint" x="48" y="230">filters.q()  → 'lamp'</text>
<text class="m lab" x="340" y="152">page</text>
<rect class="bx2" x="340" y="162" width="112" height="40" rx="10"/>
<g class="k4"><text class="m val" x="396" y="189" text-anchor="middle">1</text></g>
<g class="k5"><text class="m val" x="396" y="189" text-anchor="middle">2</text></g>
<rect class="bx2" x="468" y="162" width="116" height="40" rx="10"/>
<text class="txt" x="526" y="188" text-anchor="middle">Next →</text>
<rect class="ring k6" x="464" y="158" width="124" height="48" rx="13"/>
<text class="m hint" x="340" y="230">page()  → number, not a string</text>
<!-- sync paths -->
<path class="ln" d="M396 162 C 396 136, 420 128, 420 106" stroke-dasharray="3 5"/>
<path class="ember k7" d="M396 162 C 396 136, 420 128, 420 106"/>
<rect class="ring k8" x="336" y="158" width="120" height="48" rx="13"/>
<rect class="ring k9" x="36" y="78" width="26" height="24" rx="6"/>
<text class="m hint" x="48" y="300">reload · share the link · back button: the state comes with it</text>
<text class="m hint" x="24" y="390">page 1 is the default, so it never appears in the URL</text>
</svg>
