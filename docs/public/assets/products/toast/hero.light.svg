@keyframes pq-toast-k5{0.0000%{opacity:0;animation-timing-function:step-end}28.6667%{opacity:1;animation-timing-function:step-end}75.5556%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-toast-k6{0%{transform:translate(0px,0px)}66.6667%{transform:translate(0px,0px)}69.1111%{transform:translate(0px,-76px)}99.4444%{transform:translate(0px,-76px)}99.5556%{transform:translate(0px,0px)}100%{transform:translate(0px,0px)}}
@keyframes pq-toast-k7{0%{stroke-dashoffset:0}28.6667%{stroke-dashoffset:0}30.8889%{stroke-dashoffset:0}75.4444%{stroke-dashoffset:0}100.0000%{stroke-dashoffset:-200}100%{stroke-dashoffset:-200}}
@keyframes pq-toast-k8{0%{opacity:0}28.4444%{opacity:0}29.3333%{opacity:1}30.6667%{opacity:0}100%{opacity:0}}
@keyframes pq-toast-k9{0%{stroke-dashoffset:36;opacity:0}42.2222%{stroke-dashoffset:36;opacity:1}44.2222%{stroke-dashoffset:-120;opacity:1}44.2333%{stroke-dashoffset:36;opacity:0}100%{stroke-dashoffset:36;opacity:0}}
@keyframes pq-toast-k10{0.0000%{opacity:0;animation-timing-function:step-end}44.2222%{opacity:1;animation-timing-function:step-end}86.6667%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-toast-k11{0%{transform:translate(0px,0px)}66.6667%{transform:translate(0px,0px)}69.1111%{transform:translate(0px,-76px)}75.5556%{transform:translate(0px,-76px)}78.0000%{transform:translate(0px,-152px)}99.4444%{transform:translate(0px,-152px)}99.5556%{transform:translate(0px,0px)}100%{transform:translate(0px,0px)}}
@keyframes pq-toast-k12{0%{stroke-dashoffset:0}44.2222%{stroke-dashoffset:0}46.4444%{stroke-dashoffset:0}86.5556%{stroke-dashoffset:0}100.0000%{stroke-dashoffset:-200}100%{stroke-dashoffset:-200}}
@keyframes pq-toast-k13{0%{opacity:0}44.0000%{opacity:0}44.8889%{opacity:1}46.2222%{opacity:0}100%{opacity:0}}
.pq-toast .k0{animation:pq-toast-k0 9000ms linear infinite}
.pq-toast .k1{animation:pq-toast-k1 9000ms linear infinite}
.pq-toast .k2{animation:pq-toast-k2 9000ms linear infinite}
.pq-toast .k3{animation:pq-toast-k3 9000ms linear infinite}
