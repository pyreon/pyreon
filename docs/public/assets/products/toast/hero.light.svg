<text class="m eb" x="24" y="34">ONE &lt;TOASTER /&gt; · TOAST() FROM ANY MODULE</text>
<rect class="bx" x="24" y="92" width="272" height="72" rx="14"/><text class="m lab" x="40" y="118">a store</text><text class="m mt" x="40" y="144" style="font-size:13px">toast.success('Saved')</text><rect class="bx" x="24" y="184" width="272" height="72" rx="14"/><text class="m lab" x="40" y="210">a route loader</text><text class="m mt" x="40" y="236" style="font-size:13px">toast('Copied')</text><rect class="bx" x="24" y="276" width="272" height="72" rx="14"/><text class="m lab" x="40" y="302">a fetch wrapper</text><text class="m mt" x="40" y="328" style="font-size:13px">toast.error('Upload failed')</text>
