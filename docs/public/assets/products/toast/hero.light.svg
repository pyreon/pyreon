@media (prefers-reduced-motion: reduce){.pq-toast .k0{opacity:0}.pq-toast .k1{opacity:1}.pq-toast .k2{stroke-dashoffset:0}.pq-toast .k3{opacity:0}.pq-toast .k4{opacity:0}.pq-toast .k5{opacity:1}.pq-toast .k6{transform:none}.pq-toast .k7{stroke-dashoffset:0}.pq-toast .k8{opacity:0}.pq-toast .k9{opacity:0}.pq-toast .k10{opacity:1}.pq-toast .k11{transform:none}.pq-toast .k12{stroke-dashoffset:0}.pq-toast .k13{opacity:0}}
</style>
