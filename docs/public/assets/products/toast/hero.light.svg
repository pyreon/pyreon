<svg data-theme="light" xmlns="http://www.w3.org/2000/svg" class="pxa pq-toast" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="pq-toast-t pq-toast-d" fill="none">
<title id="pq-toast-t">toast() from anywhere lands in one Toaster</title>
<desc id="pq-toast-d">Schematic: a store calls toast.success('Saved'), a route loader calls toast('Copied') and a fetch wrapper calls toast.error('Upload failed'). Each one travels to the single &lt;Toaster /&gt; and stacks there; the error toast carries role="alert", the others role="status". Each leaves when its countdown runs out.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}
.pq-toast{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pq-toast .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pq-toast .pq-toast-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.pq-toast *{animation:none!important;transition:none!important}.pq-toast .pq-toast-rm{opacity:1}.pq-toast .pq-toast-am{opacity:0}}

.pq-toast .ln{stroke:var(--px-hint);stroke-width:1.5}
.pq-toast .dash{stroke:var(--px-hint);stroke-width:1.5;stroke-dasharray:4 6}
.pq-toast .bx{fill:var(--px-card);stroke:var(--px-bar);stroke-width:1.5}
.pq-toast .bx2{fill:var(--px-raised);stroke:var(--px-bar);stroke-width:1.5}
.pq-toast .act{fill:none;stroke:var(--px-text);stroke-width:2}
.pq-toast .lab{fill:var(--px-fog);font-size:14px;letter-spacing:.02em}
.pq-toast .eb{fill:var(--px-fog);font-size:13px;letter-spacing:.16em}
.pq-toast .val{fill:var(--px-text);font-size:20px;font-weight:500}
.pq-toast .big{fill:var(--px-strong);font-size:30px;font-weight:600;letter-spacing:-.02em}
.pq-toast .txt{fill:var(--px-text);font-size:16px}
.pq-toast .mt{fill:var(--px-mist);font-size:14px}
.pq-toast .hint{fill:var(--px-fog);font-size:13px}
.pq-toast .ember{stroke:url(#pq-toast-eg);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:36 2000;fill:none}
.pq-toast .emS{stroke:url(#pq-toast-eg);stroke-width:2.5;fill:none}
.pq-toast .ring{fill:none;stroke:var(--px-accent);stroke-width:2}
.pq-toast .ok{fill:var(--px-ok)} .pq-toast .warm{fill:var(--px-warm)} .pq-toast .hot{fill:var(--px-accent)} .pq-toast .err{fill:var(--px-err)}
.pq-toast .okT{fill:var(--px-ok)} .pq-toast .warmT{fill:var(--px-warm)} .pq-toast .hotT{fill:var(--px-accent-text)} .pq-toast .errT{fill:var(--px-err)} .pq-toast .linkT{fill:var(--px-link)}
.pq-toast .focus{fill:none;stroke:var(--px-link);stroke-width:2;stroke-dasharray:3 3}
@keyframes pq-toast-k0{0%{stroke-dashoffset:36;opacity:0}11.1111%{stroke-dashoffset:36;opacity:1}13.1111%{stroke-dashoffset:-120;opacity:1}13.1222%{stroke-dashoffset:36;opacity:0}100%{stroke-dashoffset:36;opacity:0}}
@keyframes pq-toast-k1{0.0000%{opacity:0;animation-timing-function:step-end}13.1111%{opacity:1;animation-timing-function:step-end}66.6667%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-toast-k2{0%{stroke-dashoffset:0}13.1111%{stroke-dashoffset:0}15.3333%{stroke-dashoffset:0}66.5556%{stroke-dashoffset:0}100.0000%{stroke-dashoffset:-200}100%{stroke-dashoffset:-200}}
