@keyframes pq-feature-k1{0%{stroke-dashoffset:36;opacity:0}15.5556%{stroke-dashoffset:36;opacity:1}17.1111%{stroke-dashoffset:-60;opacity:1}17.1222%{stroke-dashoffset:36;opacity:0}100%{stroke-dashoffset:36;opacity:0}}
@keyframes pq-feature-k2{0%{stroke-dashoffset:36;opacity:0}20.0000%{stroke-dashoffset:36;opacity:1}21.3333%{stroke-dashoffset:-40;opacity:1}21.3444%{stroke-dashoffset:36;opacity:0}60.0000%{stroke-dashoffset:36;opacity:1}61.3333%{stroke-dashoffset:-40;opacity:1}61.3444%{stroke-dashoffset:36;opacity:0}100%{stroke-dashoffset:36;opacity:0}}
