@keyframes pq-feature-k4{0%{opacity:0}21.3333%{opacity:0}22.2222%{opacity:1}23.5556%{opacity:0}61.3333%{opacity:0}62.2222%{opacity:1}63.5556%{opacity:0}100%{opacity:0}}
@keyframes pq-feature-k5{0.0000%{opacity:0;animation-timing-function:step-end}13.8889%{opacity:1;animation-timing-function:step-end}33.3333%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-feature-k6{0.0000%{opacity:0;animation-timing-function:step-end}53.8889%{opacity:1;animation-timing-function:step-end}73.3333%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
.pq-feature .k0{animation:pq-feature-k0 9000ms linear infinite}
.pq-feature .k1{animation:pq-feature-k1 9000ms linear infinite}
.pq-feature .k2{animation:pq-feature-k2 9000ms linear infinite}
.pq-feature .k3{animation:pq-feature-k3 9000ms linear infinite}
.pq-feature .k4{animation:pq-feature-k4 9000ms linear infinite}
.pq-feature .k5{animation:pq-feature-k5 9000ms linear infinite}
.pq-feature .k6{animation:pq-feature-k6 9000ms linear infinite}
@media (prefers-reduced-motion: reduce){.pq-feature .k0{opacity:1}.pq-feature .k1{opacity:0}.pq-feature .k2{opacity:0}.pq-feature .k3{opacity:0}.pq-feature .k4{opacity:0}.pq-feature .k5{opacity:1}.pq-feature .k6{opacity:0}}
</style>
