<svg data-theme="light" xmlns="http://www.w3.org/2000/svg" class="pxa pq-feature" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="pq-feature-t pq-feature-d" fill="none">
<title id="pq-feature-t">One schema becomes the list, form, table and store</title>
<desc id="pq-feature-d">Schematic: defineFeature with the name posts, a three-field schema and the path /api/posts fans out to generated members: useList, useForm, useTable and useStore. Submitting the form sends POST /api/posts and the list refetches with the new row; deleting it sends DELETE /api/posts/:id and the list refetches again.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}
.pq-feature{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pq-feature .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pq-feature .pq-feature-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.pq-feature *{animation:none!important;transition:none!important}.pq-feature .pq-feature-rm{opacity:1}.pq-feature .pq-feature-am{opacity:0}}

.pq-feature .ln{stroke:var(--px-hint);stroke-width:1.5}
.pq-feature .dash{stroke:var(--px-hint);stroke-width:1.5;stroke-dasharray:4 6}
.pq-feature .bx{fill:var(--px-card);stroke:var(--px-bar);stroke-width:1.5}
.pq-feature .bx2{fill:var(--px-raised);stroke:var(--px-bar);stroke-width:1.5}
.pq-feature .act{fill:none;stroke:var(--px-text);stroke-width:2}
.pq-feature .lab{fill:var(--px-fog);font-size:14px;letter-spacing:.02em}
.pq-feature .eb{fill:var(--px-fog);font-size:13px;letter-spacing:.16em}
.pq-feature .val{fill:var(--px-text);font-size:20px;font-weight:500}
.pq-feature .big{fill:var(--px-strong);font-size:30px;font-weight:600;letter-spacing:-.02em}
.pq-feature .txt{fill:var(--px-text);font-size:16px}
.pq-feature .mt{fill:var(--px-mist);font-size:14px}
.pq-feature .hint{fill:var(--px-fog);font-size:13px}
.pq-feature .ember{stroke:url(#pq-feature-eg);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:36 2000;fill:none}
.pq-feature .emS{stroke:url(#pq-feature-eg);stroke-width:2.5;fill:none}
.pq-feature .ring{fill:none;stroke:var(--px-accent);stroke-width:2}
.pq-feature .ok{fill:var(--px-ok)} .pq-feature .warm{fill:var(--px-warm)} .pq-feature .hot{fill:var(--px-accent)} .pq-feature .err{fill:var(--px-err)}
.pq-feature .okT{fill:var(--px-ok)} .pq-feature .warmT{fill:var(--px-warm)} .pq-feature .hotT{fill:var(--px-accent-text)} .pq-feature .errT{fill:var(--px-err)} .pq-feature .linkT{fill:var(--px-link)}
.pq-feature .focus{fill:none;stroke:var(--px-link);stroke-width:2;stroke-dasharray:3 3}
