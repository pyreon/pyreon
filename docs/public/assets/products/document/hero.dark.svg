<svg data-theme="dark" xmlns="http://www.w3.org/2000/svg" class="pxa pq-document" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="pq-document-t pq-document-d" fill="none">
<title id="pq-document-t">One document tree rendered to PDF, a spreadsheet, Slack and Markdown</title>
<desc id="pq-document-d">An invoice written once as JSX: &lt;Document&gt; with a &lt;Heading&gt; and a &lt;Table&gt;. render(doc, format) is called with 'pdf', then 'xlsx', then 'slack', then 'md', and each time the same tree lights up a different output: a PDF page, a spreadsheet grid, a Slack Block Kit message and a Markdown file.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}
.pq-document{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pq-document .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pq-document .pq-document-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.pq-document *{animation:none!important;transition:none!important}.pq-document .pq-document-rm{opacity:1}.pq-document .pq-document-am{opacity:0}}

.pq-document .ln{stroke:var(--px-hint);stroke-width:1.5;fill:none}
.pq-document .dash{stroke:var(--px-hint);stroke-width:1.5;stroke-dasharray:3 5;fill:none}
.pq-document .bx{fill:var(--px-card);stroke:var(--px-bar);stroke-width:1.5}
.pq-document .bx2{fill:var(--px-raised);stroke:var(--px-bar);stroke-width:1.5}
.pq-document .lab{fill:var(--px-fog);font-size:14px;letter-spacing:.04em}
.pq-document .eb{fill:var(--px-fog);font-size:13px;letter-spacing:.16em}
.pq-document .val{fill:var(--px-text);font-size:20px;font-weight:500}
.pq-document .big{fill:var(--px-strong);font-size:24px;font-weight:600;letter-spacing:-.02em}
.pq-document .code{fill:var(--px-text);font-size:15px}
.pq-document .kw{fill:var(--px-accent-text)} .pq-document .fn{fill:var(--px-link)} .pq-document .str{fill:var(--px-warm)} .pq-document .ty{fill:var(--px-violet)}
.pq-document .dim{fill:var(--px-fog)}
.pq-document .hint{fill:var(--px-hint);font-size:13px}
.pq-document .ember{stroke:url(#pq-document-egu);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:36 900;fill:none}
.pq-document .emberS{stroke:url(#pq-document-egu);stroke-width:2.5;stroke-linecap:round;fill:none}
.pq-document .ring{fill:none;stroke:var(--px-accent);stroke-width:2}
.pq-document .ok{fill:var(--px-ok)} .pq-document .warm{fill:var(--px-warm)} .pq-document .hot{fill:var(--px-accent)} .pq-document .errF{fill:var(--px-err)}
.pq-document .okT{fill:var(--px-ok)} .pq-document .warmT{fill:var(--px-warm)} .pq-document .hotT{fill:var(--px-accent-text)} .pq-document .errT{fill:var(--px-err)}
.pq-document .okS{stroke:var(--px-ok)} .pq-document .errS{stroke:var(--px-err)}
.pq-document .gfill{fill:url(#pq-document-eg)}
@media (prefers-reduced-motion: reduce){.pq-document .ember{opacity:0}}

.pq-document .sk{fill:var(--px-line2)}
.pq-document .skS{stroke:var(--px-line2);stroke-width:1.5}
@keyframes pq-document-f0{0.0000%{opacity:0;animation-timing-function:step-end}7.5000%{opacity:1;animation-timing-function:step-end}30.0000%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-document-f1{0.0000%{opacity:0;animation-timing-function:step-end}30.0000%{opacity:1;animation-timing-function:step-end}52.5000%{opacity:0;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
