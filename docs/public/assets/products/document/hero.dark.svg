<text class="m code" x="64" y="166">&lt;<tspan class="ty">Table</tspan> rows={lines} /&gt;</text>
<text class="m code" x="48" y="192">&lt;/<tspan class="ty">Document</tspan>&gt;)</text>
<text class="m code" x="40" y="232"><tspan class="fn">render</tspan>(doc,</text>
<text class="m code f0" x="157" y="232"><tspan class="str">'pdf'</tspan>)</text><text class="m code f1" x="157" y="232" opacity="0"><tspan class="str">'xlsx'</tspan>)</text><text class="m code f2" x="157" y="232" opacity="0"><tspan class="str">'slack'</tspan>)</text><text class="m code f3" x="157" y="232" opacity="0"><tspan class="str">'md'</tspan>)</text>
