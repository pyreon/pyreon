@keyframes pq-document-f3{0.0000%{opacity:1;animation-timing-function:step-end}7.5000%{opacity:0;animation-timing-function:step-end}75.0000%{opacity:1;animation-timing-function:step-end}100.0000%{opacity:0;animation-timing-function:step-end}}
@keyframes pq-document-t0{0%{stroke-dashoffset:36;opacity:0}7.5000%{stroke-dashoffset:36;opacity:1}10.0000%{stroke-dashoffset:-160;opacity:1}10.0125%{stroke-dashoffset:36;opacity:0}100%{stroke-dashoffset:36;opacity:0}}
@keyframes pq-document-t1{0%{stroke-dashoffset:36;opacity:0}30.0000%{stroke-dashoffset:36;opacity:1}32.5000%{stroke-dashoffset:-160;opacity:1}32.5125%{stroke-dashoffset:36;opacity:0}100%{stroke-dashoffset:36;opacity:0}}
@keyframes pq-document-t2{0%{stroke-dashoffset:36;opacity:0}52.5000%{stroke-dashoffset:36;opacity:1}55.0000%{stroke-dashoffset:-160;opacity:1}55.0125%{stroke-dashoffset:36;opacity:0}100%{stroke-dashoffset:36;opacity:0}}
@keyframes pq-document-t3{0%{stroke-dashoffset:36;opacity:0}75.0000%{stroke-dashoffset:36;opacity:1}77.5000%{stroke-dashoffset:-160;opacity:1}77.5125%{stroke-dashoffset:36;opacity:0}100%{stroke-dashoffset:36;opacity:0}}
@keyframes pq-document-r0{0%{opacity:0}9.5000%{opacity:0}10.5000%{opacity:1}12.0000%{opacity:0}100%{opacity:0}}
@keyframes pq-document-r1{0%{opacity:0}32.0000%{opacity:0}33.0000%{opacity:1}34.5000%{opacity:0}100%{opacity:0}}
@keyframes pq-document-r2{0%{opacity:0}54.5000%{opacity:0}55.5000%{opacity:1}57.0000%{opacity:0}100%{opacity:0}}
@keyframes pq-document-r3{0%{opacity:0}77.0000%{opacity:0}78.0000%{opacity:1}79.5000%{opacity:0}100%{opacity:0}}
.pq-document .f0{animation:pq-document-f0 8000ms linear infinite}
.pq-document .t0{animation:pq-document-t0 8000ms linear infinite}
.pq-document .r0{animation:pq-document-r0 8000ms linear infinite}
.pq-document .f1{animation:pq-document-f1 8000ms linear infinite}
