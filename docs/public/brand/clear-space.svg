<svg xmlns="http://www.w3.org/2000/svg" class="pxa pbcs" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="pbcs-t pbcs-d" fill="none">
<title id="pbcs-t">Pyreon mark: clear space and minimum sizes</title>
<desc id="pbcs-d">The Pyreon mark with a dashed clear-space box of 11 units (half the disc radius) on every side, and its minimum sizes: 32 px in colour, 16 px in mono.</desc>
<style>
.pxa{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
@media (prefers-color-scheme: light){.pxa{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}}
[data-theme="dark"] .pxa,.pxa[data-theme="dark"]{--px-bg:#0A0A0E;--px-card:#111118;--px-raised:#181822;--px-line:#23232E;--px-line2:#2E2E3B;--px-text:#F4EFE6;--px-strong:#FFFCF5;--px-mist:#C9C4B8;--px-fog:#8A8696;--px-hint:#8A8696;--px-dim:#5C5867;--px-accent:#FF5E1A;--px-accent-text:#FF8A4C;--px-warm:#FFC83D;--px-plasma:#FF1F8C;--px-ok:#4ADE80;--px-warn:#FACC15;--px-err:#F87171;--px-link:#22D3EE;--px-violet:#A78BFA;--px-bar:#3A3846;--px-g1:#FF1F8C;--px-g2:#FF5E1A;--px-g3:#FFC83D;--px-glow:rgba(255,94,26,.16)}
[data-theme="light"] .pxa,.pxa[data-theme="light"]{--px-bg:#FAF5EB;--px-card:#FFFFFF;--px-raised:#F4EFE6;--px-line:#E6DFD2;--px-line2:#D6CFC2;--px-text:#14141C;--px-strong:#0A0A0E;--px-mist:#45414F;--px-fog:#67637A;--px-hint:#8E8A9A;--px-dim:#B5AFA3;--px-accent:#E84A0F;--px-accent-text:#A8380A;--px-warm:#8A5A00;--px-plasma:#E40C70;--px-ok:#11692F;--px-warn:#8A5A00;--px-err:#B91C1C;--px-link:#0A6E89;--px-violet:#6D28D9;--px-bar:#D9D2C4;--px-g1:#D1106F;--px-g2:#C2410C;--px-g3:#9A6200;--px-glow:rgba(232,74,15,.10)}
.pbcs{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
.pbcs .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.pbcs .pbcs-rm{opacity:0}
@media (prefers-reduced-motion: reduce){.pbcs *{animation:none!important;transition:none!important}.pbcs .pbcs-rm{opacity:1}.pbcs .pbcs-am{opacity:0}}
.pbcs .g{stroke:var(--px-fog);stroke-width:1}.pbcs .d{stroke:var(--px-accent);stroke-width:1.25;stroke-dasharray:5 4}
.pbcs .t{fill:var(--px-fog);font-size:13px;letter-spacing:.04em}.pbcs .tt{fill:var(--px-text);font-size:14px}
.pbcs .n{stroke:var(--px-text)}.pbcs .h{fill:var(--px-hint);font-size:12px}
</style>
<defs><linearGradient id="pbcs-eg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pbcs-egu" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="760" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pbcs-egv" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient><linearGradient id="pbcs-egd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--px-g1)"/><stop offset=".55" style="stop-color:var(--px-g2)"/><stop offset="1" style="stop-color:var(--px-g3)"/></linearGradient></defs>

<rect class="d" x="47.199999999999996" y="72.4" width="300" height="182.40000000000003"/>
<rect class="g" x="73.6" y="98.8" width="247.20000000000002" height="129.60000000000002" stroke-dasharray="2 3"/>
<g transform="translate(40 10) scale(2.4)"><circle cx="36" cy="64" r="22" fill="url(#pbcs-egd)"/><path class="n" d="M70 86 L70 42 L70 64 Q70 42 92 42 Q112 42 112 64 L112 86" stroke-width="10" stroke-linecap="square" fill="none"/></g>
<line class="g" x1="47.199999999999996" y1="272.8" x2="73.6" y2="272.8"/>
<line class="g" x1="47.199999999999996" y1="267.8" x2="47.199999999999996" y2="277.8"/><line class="g" x1="73.6" y1="267.8" x2="73.6" y2="277.8"/>
<text class="m t" x="47.199999999999996" y="294.8">x = 11 units</text>
<text class="m h" x="47.199999999999996" y="312.8">half the disc radius (r = 22), about 9% of the mark</text>
<text class="m t" x="440" y="78">CLEAR SPACE</text>
<text class="tt" x="440" y="102">Keep x free on every side.</text>
<text class="m t" x="440" y="150">MINIMUM SIZE</text>
<g transform="translate(440 166)"><g transform="scale(0.26666666666666666)"><circle cx="36" cy="64" r="22" fill="url(#pbcs-egd)"/><path class="n" d="M70 86 L70 42 L70 64 Q70 42 92 42 Q112 42 112 64 L112 86" stroke-width="10" stroke-linecap="square" fill="none"/></g>
<text class="m h" x="40" y="22">colour ≥ 32 px</text></g>
<g transform="translate(440 206)"><g transform="scale(0.13333333333333333)"><circle cx="36" cy="64" r="22" style="fill:var(--px-text)"/><path class="n" d="M70 86 L70 42 L70 64 Q70 42 92 42 Q112 42 112 64 L112 86" stroke-width="10" stroke-linecap="square" fill="none"/></g>
<text class="m h" x="40" y="14">mono ≥ 16 px</text></g>
<text class="m t" x="440" y="262">EMBER</text>
<text class="tt" x="440" y="286">The disc is the one lit particle.</text>
<text class="m h" x="440" y="306">"on" in ember: once per page.</text>
</svg>
